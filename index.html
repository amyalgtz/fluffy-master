<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main">
    <div class="mobile-top"><div class="brand">Fluffy Master</div><button class="btn sm" data-go="mas">Menú</button></div>
    <div id="view"></div>
  </main>
</div>
<nav class="bottom" id="bottom"></nav>
<div id="overlay"></div>
<div id="gate" style="display:none"></div>
<script>
window.FM_VERSION = '2026-10-15 15:04';
/* =========================================================
   VERSIÓN WEB (Supabase) — reemplaza el almacenamiento de Claude por Supabase:
   - login por persona (correo y contraseña) y roles en la tabla members
   - los datos viven en la tabla docs, protegida con Row Level Security
   - el histórico del Excel se carga desde la base, no viene dentro de la página
   La app usa la misma interfaz window.claude que en Claude, así que el resto del código no cambia.
   ========================================================= */
var DATA = null, PERF = null;
const FM = { sb: null, session: null, member: null, cache: new Map(), subs: new Set(), ready: false };
const ROLE_LABEL = { admin: 'Administración', editor: 'Edición', recepcion: 'Recepción', lectura: 'Solo lectura' };
const WRITE_ROLES = ['admin', 'editor', 'recepcion'];
const colMap = c => { if (!FM.cache.has(c)) FM.cache.set(c, new Map()); return FM.cache.get(c); };
const clone = x => x == null ? x : JSON.parse(JSON.stringify(x));
const genId = () => Array.from(crypto.getRandomValues(new Uint8Array(10)), b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
const sbError = e => { const m = (e && (e.message || e.code)) || 'error'; return new Error(/row-level security|permission|42501/i.test(m) ? 'Tu usuario no tiene permiso para guardar esto.' : m); };
function emit(col, id) { FM.subs.forEach(s => { if (s.col === col && (s.id == null || s.id === id)) s.fire(); }); }

/* ---------- db con la misma forma que usa la app ---------- */
function docRef(col, id) {
  return {
    id, path: col + '/' + id,
    async set(data) {
      const clean = clone(data);
      const { error } = await FM.sb.from('docs').upsert({ collection: col, id, data: clean, updated_by: FM.session.user.email });
      if (error) throw sbError(error);
      colMap(col).set(id, clean); emit(col, id);
    },
    async update(patch) { return this.set({ ...(colMap(col).get(id) || {}), ...patch }); },
    async delete() {
      const { error } = await FM.sb.from('docs').delete().match({ collection: col, id });
      if (error) throw sbError(error);
      colMap(col).delete(id); emit(col, id);
    },
    async get() { const d = colMap(col).get(id); return { id, exists: d !== undefined, data: () => clone(d) }; },
    onSnapshot(cb) { const s = { col, id, fire: () => { const d = colMap(col).get(id); cb({ id, exists: d !== undefined, data: () => clone(d) }); } }; FM.subs.add(s); setTimeout(s.fire); return () => FM.subs.delete(s); },
  };
}
const fmDb = {
  doc(path) { const [col, id] = path.split('/'); return docRef(col, id); },
  collection(col) {
    return {
      doc: id => docRef(col, id || genId()),
      onSnapshot(cb) {
        const s = { col, fire: () => { const docs = [...colMap(col)].map(([id, d]) => ({ id, data: () => clone(d) })); cb({ docs, size: docs.length, empty: !docs.length }); } };
        FM.subs.add(s); setTimeout(s.fire); return () => FM.subs.delete(s);
      },
    };
  },
};
window.claude = {
  async use(name) {
    if (name === 'db') return fmDb;
    if (name === 'user') return {
      id: async () => FM.session.user.id, name: FM.member.name, role: FM.member.role,
      can: async p => p === 'data.write' ? WRITE_ROLES.includes(FM.member.role) : null,
      canEdit: () => FM.member.role === 'admin', isOwner: () => FM.member.role === 'admin',
    };
    if (name === 'downloads') return {
      async save({ filename, data }) {
        const blob = data instanceof Blob ? data : new Blob([data], { type: /\.csv$/.test(filename) ? 'text/csv;charset=utf-8' : 'application/octet-stream' });
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      },
    };
    return null;
  },
};

/* ---------- carga inicial ---------- */
async function loadAll() {
  const parts = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await FM.sb.from('docs').select('collection,id,data,updated_at').range(from, from + 999).order('collection').order('id');
    if (error) throw sbError(error);
    parts.push(...data); if (data.length < 1000) break;
  }
  FM.cache.clear();
  parts.forEach(r => colMap(r.collection).set(r.id, r.data));
  FM.mark = parts.reduce((m, r) => r.updated_at && r.updated_at > m ? r.updated_at : m, FM.mark || '');
  FM.syncedAt = new Date(); FM.online = true;
  const h = [...colMap('historico')].sort((a, b) => a[0].localeCompare(b[0])).map(([, d]) => d.text || '').join('');
  if (h) { const x = JSON.parse(h); DATA = x.DATA; PERF = x.PERF; }
}
/* Respaldo de la sincronización en vivo: cada 30 s, al volver a la app y con el botón Actualizar,
   se piden los cambios recientes, así todas las pantallas (recepción y administración) cuadran. */
FM.lastSync = null;
async function pullChanges(full) {
  if (!FM.session || !FM.member) return;
  try {
    if (full) { await loadAll(); FM.lastSync = new Date(Date.now() - 2000).toISOString(); UI.render(); return; }
    // Marca de agua del servidor (no del reloj del dispositivo): se piden los cambios posteriores al último visto, con 2 min de margen.
    const since = FM.mark ? new Date(new Date(FM.mark).getTime() - 120000).toISOString() : new Date(Date.now() - 600000).toISOString();
    const { data, error } = await FM.sb.from('docs').select('collection,id,data,updated_at').gt('updated_at', since).neq('collection', 'historico').order('updated_at').limit(1000);
    if (error || !data) { FM.online = false; UI.renderNav(); return; }
    let changed = 0;
    data.forEach(r => { const cur = colMap(r.collection).get(r.id); if (JSON.stringify(cur) !== JSON.stringify(r.data)) { colMap(r.collection).set(r.id, r.data); emit(r.collection, r.id); changed++; } if (r.updated_at > (FM.mark || '')) FM.mark = r.updated_at; });
    FM.syncedAt = new Date(); FM.online = true; if (!changed) UI.renderNav();
    if (Date.now() - (FM.lastIdCheck || 0) > 180000) {          // cada 3 min: quita lo que otra pantalla borró
      FM.lastIdCheck = Date.now(); const ids = new Set();
      for (let from = 0; ; from += 1000) { const { data: d2 } = await FM.sb.from('docs').select('collection,id').neq('collection', 'historico').range(from, from + 999); if (!d2) return; d2.forEach(r => ids.add(r.collection + '/' + r.id)); if (d2.length < 1000) break; }
      FM.cache.forEach((m, col) => { if (col === 'historico') return; [...m.keys()].forEach(id => { if (!ids.has(col + '/' + id)) { m.delete(id); emit(col, id); } }); });
    }
  } catch (e) {}
}
setInterval(() => { if (document.visibilityState === 'visible') pullChanges(false); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pullChanges(false); });
window.addEventListener('focus', () => pullChanges(false));
document.addEventListener('click', e => { if (e.target.closest('[data-sync]')) { UI.toast('Actualizando…'); pullChanges(true).then(() => UI.toast('Datos al día')); } });

function listenRealtime() {
  FM.sb.channel('fm-docs').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
    const r = p.eventType === 'DELETE' ? p.old : p.new; if (!r || !r.collection || r.collection === 'historico') return;
    if (r.updated_at && r.updated_at > (FM.mark || '')) FM.mark = r.updated_at; FM.syncedAt = new Date(); FM.live = true;
    if (p.eventType === 'DELETE') colMap(r.collection).delete(r.id); else colMap(r.collection).set(r.id, r.data);
    emit(r.collection, r.id);
  }).subscribe(st => { FM.live = st === 'SUBSCRIBED'; });
}

/* ---------- pantallas de acceso ---------- */
const gate = html => { document.getElementById('gate').innerHTML = `<div class="gate"><img class="brandlogo lg" src="logo-mark.png" alt="Fluffy Lashes"><div class="brand" style="font-size:30px;padding:0">Fluffy Master</div><p style="color:var(--muted);margin:6px 0 24px">Fluffy Lashes · gestión del salón</p>${html}</div>`; document.getElementById('gate').style.display = ''; };
const gateOff = () => { document.getElementById('gate').style.display = 'none'; };
const qs = s => document.querySelector(s);

function loginScreen(msg) {
  gate(`<h1 style="font-size:26px;margin:0 0 14px">Iniciar sesión</h1>
    <label class="field">Correo<input type="email" id="lg-email" autocomplete="username"></label>
    <label class="field" style="margin-top:10px">Contraseña<input type="password" id="lg-pass" autocomplete="current-password"></label>
    <p class="err" id="lg-err" style="color:var(--bad);font-size:13px;font-weight:600;min-height:18px">${msg || ''}</p>
    <button class="btn primary" id="lg-go" style="width:100%;justify-content:center">Entrar</button>
    <div class="chips" style="justify-content:space-between;margin-top:14px"><button class="linkbtn" id="lg-new">Crear mi contraseña</button><button class="linkbtn" id="lg-reset">Olvidé mi contraseña</button></div>
    <p class="formula">Solo pueden entrar los correos que administración dio de alta.</p>`);
  const err = t => { qs('#lg-err').textContent = t; };
  const go = async () => {
    const email = qs('#lg-email').value.trim(), password = qs('#lg-pass').value;
    if (!email || !password) return err('Escribe tu correo y contraseña.');
    qs('#lg-go').disabled = true;
    const { error } = await FM.sb.auth.signInWithPassword({ email, password });
    qs('#lg-go').disabled = false;
    if (error) err(/confirm/i.test(error.message) ? 'Confirma tu correo con el enlace que te llegó.' : 'Correo o contraseña incorrectos.');
  };
  qs('#lg-go').onclick = go; qs('#lg-pass').onkeydown = e => { if (e.key === 'Enter') go(); };
  qs('#lg-new').onclick = signupScreen;
  qs('#lg-reset').onclick = async () => {
    const email = qs('#lg-email').value.trim(); if (!email) return err('Escribe tu correo arriba y vuelve a tocar "Olvidé mi contraseña".');
    const { error } = await FM.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    err(error ? 'No se pudo enviar el correo.' : 'Te enviamos un correo para crear una contraseña nueva.');
  };
}
function signupScreen() {
  gate(`<h1 style="font-size:26px;margin:0 0 6px">Crear mi contraseña</h1><p style="color:var(--muted);margin:0 0 14px">Usa el correo que administración dio de alta.</p>
    <label class="field">Correo<input type="email" id="su-email" autocomplete="username"></label>
    <label class="field" style="margin-top:10px">Contraseña (mínimo 8 caracteres)<input type="password" id="su-pass" autocomplete="new-password"></label>
    <p class="err" id="su-err" style="color:var(--bad);font-size:13px;font-weight:600;min-height:18px"></p>
    <button class="btn primary" id="su-go" style="width:100%;justify-content:center">Crear</button>
    <button class="linkbtn" id="su-back" style="margin-top:14px">Ya tengo contraseña</button>`);
  qs('#su-back').onclick = () => loginScreen();
  qs('#su-go').onclick = async () => {
    const email = qs('#su-email').value.trim(), password = qs('#su-pass').value;
    if (!email || password.length < 8) return (qs('#su-err').textContent = 'Escribe tu correo y una contraseña de al menos 8 caracteres.');
    const { data, error } = await FM.sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) return (qs('#su-err').textContent = error.message);
    if (!data.session) loginScreen('Revisa tu correo y confirma tu cuenta. Después entra con tu contraseña.');
  };
}
function newPasswordScreen() {
  gate(`<h1 style="font-size:26px;margin:0 0 14px">Contraseña nueva</h1>
    <label class="field">Contraseña (mínimo 8 caracteres)<input type="password" id="np-pass" autocomplete="new-password"></label>
    <p class="err" id="np-err" style="color:var(--bad);font-size:13px;font-weight:600;min-height:18px"></p><button class="btn primary" id="np-go" style="width:100%;justify-content:center">Guardar</button>`);
  qs('#np-go').onclick = async () => {
    const p = qs('#np-pass').value; if (p.length < 8) return (qs('#np-err').textContent = 'Mínimo 8 caracteres.');
    const { error } = await FM.sb.auth.updateUser({ password: p }); if (error) return (qs('#np-err').textContent = error.message);
    start();
  };
}
function noAccessScreen() {

  gate(`<h1 style="font-size:24px;margin:0 0 6px">Cargar datos iniciales</h1><p style="color:var(--muted);margin:0 0 14px">Solo se hace una vez. Están en la carpeta <b>migracion</b> del proyecto.</p>

  const msg = t => { qs('#st-msg').textContent = t; };
  qs('#st-go').onclick = async () => {
    const fh = qs('#st-h').files[0], fc = qs('#st-c').files[0];
    if (!fh) return msg('Elige el archivo historico.json.');
    qs('#st-go').disabled = true;
    try {
      const text = await fh.text(); JSON.parse(text);
      const size = 250000, rows = [];
      for (let i = 0, n = 0; i < text.length; i += size, n++) rows.push({ collection: 'historico', id: 'parte-' + String(n).padStart(3, '0'), data: { text: text.slice(i, i + size) }, updated_by: FM.session.user.email });
      msg('Subiendo histórico…'); const { error } = await FM.sb.from('docs').upsert(rows); if (error) throw sbError(error);
      if (fc) {
        const docs = JSON.parse(await fc.text());
        for (let i = 0; i < docs.length; i += 100) {
          msg(`Subiendo datos guardados ${Math.min(i + 100, docs.length)}/${docs.length}…`);
          const { error: e2 } = await FM.sb.from('docs').upsert(docs.slice(i, i + 100).map(d => ({ collection: d.collection, id: d.id, data: d.data, updated_by: FM.session.user.email })));
          if (e2) throw sbError(e2);
        }
      }
      msg('Listo.'); start();
    } catch (e) { qs('#st-go').disabled = false; msg('No se pudo cargar: ' + e.message); }
  };
}

let booted = false;
async function start() {
  const { data: { session } } = await FM.sb.auth.getSession(); FM.session = session;
  if (!session) return loginScreen();
  const { data: m } = await FM.sb.from('members').select('*').eq('email', session.user.email.toLowerCase()).maybeSingle();
  if (!m || m.active === false) { FM.member = null; return noAccessScreen(); }
  FM.member = m;
  gate('<p class="loading">Cargando datos…</p>');
  try { await loadAll(); } catch (e) { gate(`<p>No se pudieron cargar los datos: ${esc(e.message)}</p>`); return; }
  if (!DATA) return setupScreen();
  gateOff();
  FM.lastSync = new Date(Date.now() - 2000).toISOString();
  if (!booted) { booted = true; listenRealtime(); window.FM_BOOT(); }
  else UI.render();
}

'use strict';
/* =========================================================
   LOGIC — business rules translated from the Excel formulas.
   No DOM in this section.
   ========================================================= */
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

const Dates = {
  // Dates are stored as whole days since 1970-01-01 (UTC) to avoid timezone drift.
  today() { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); },
  fromISO(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); if (!y || !m || !d) return null; return Math.floor(Date.UTC(y, m - 1, d) / 864e5); },
  toISO(day) { return new Date(day * 864e5).toISOString().slice(0, 10); },
  parts(day) { const d = new Date(day * 864e5); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), dow: d.getUTCDay() }; },
  ym(day) { return Dates.toISO(day).slice(0, 7); },
  monthStart(y, m) { return Math.floor(Date.UTC(y, m, 1) / 864e5); },
  monthEnd(y, m) { return Math.floor(Date.UTC(y, m + 1, 1) / 864e5) - 1; },
  // FLUFFY_WEEK_START = Fecha - MOD(WEEKDAY(Fecha,16),7)  → weeks run Friday to Thursday.
  fluffyWeekStart(day) { const dow = Dates.parts(day).dow; return day - ((dow - 5 + 7) % 7); },
  fmt(day, opts) { return new Date(day * 864e5).toLocaleDateString('es-MX', Object.assign({ timeZone: 'UTC' }, opts || { day: '2-digit', month: 'short', year: 'numeric' })); },
  monthName(y, m) { const s = new Date(Date.UTC(y, m, 1)).toLocaleDateString('es-MX', { month: 'long', timeZone: 'UTC' }); return s.charAt(0).toUpperCase() + s.slice(1); },
};

const Logic = {
  // COMISION = COMISION_PCT × (PRECIO − DESCUENTO)   (tips never enter the base)
  calculateCommission(price, discount, rate) { return r2(num(rate) * (num(price) - num(discount))); },

  // Full, auditable breakdown of one sale.
  calculateSale({ price, discount, tip, rate, manualCommission }) {
    price = r2(price); discount = r2(discount); tip = r2(tip);
    const net = r2(price - discount);
    const auto = Logic.calculateCommission(price, discount, rate);
    const commission = manualCommission !== null && manualCommission !== undefined && manualCommission !== '' ? r2(manualCommission) : auto;
    return {
      subtotal: price, discount, net, tip,
      totalPaid: r2(net + tip),            // TPV = PRECIO − DESCUENTO + TIP
      rate: num(rate), commissionAuto: auto, commission,
      payout: r2(commission + tip),        // PAGO TOTAL (lashista) = TIP + COMISION
      fluffyIncome: r2(net - commission),
    };
  },

  sum(list, key) { let t = 0; for (const x of list) t += x[key] || 0; return r2(t); },

  filterSales(sales, f) {
    return sales.filter(s => (f.from == null || s.day >= f.from) && (f.to == null || s.day <= f.to)
      && (!f.artist || s.artistKey === f.artist) && (!f.service || s.service === f.service)
      && (!f.method || (s.method || 'Sin registrar') === f.method));
  },

  totals(sales) {
    const t = { count: sales.length, ventas: 0, descuentos: 0, tips: 0, comisiones: 0, cobrado: 0 };
    for (const s of sales) { t.ventas += s.price; t.descuentos += s.discount; t.tips += s.tip; t.comisiones += s.commission; }
    for (const k of ['ventas', 'descuentos', 'tips', 'comisiones']) t[k] = r2(t[k]);
    t.netas = r2(t.ventas - t.descuentos); t.cobrado = r2(t.netas + t.tips); t.fluffy = r2(t.netas - t.comisiones);
    t.promedio = t.count ? r2(t.ventas / t.count) : 0;
    return t;
  },

  calculatePayroll(sales, from, to) {
    const by = new Map();
    for (const s of sales) {
      if (s.day < from || s.day > to) continue;
      let p = by.get(s.artistKey);
      if (!p) { p = { key: s.artistKey, name: s.artistName, count: 0, ventas: 0, descuentos: 0, comision: 0, tips: 0 }; by.set(s.artistKey, p); }
      p.count++; p.ventas += s.price; p.descuentos += s.discount; p.comision += s.commission; p.tips += s.tip;
    }
    return [...by.values()].map(p => {
      const netas = r2(p.ventas - p.descuentos);
      return { ...p, ventas: r2(p.ventas), descuentos: r2(p.descuentos), netas, comision: r2(p.comision), tips: r2(p.tips),
        pct: netas ? p.comision / netas : 0, total: r2(p.comision + p.tips) };
    }).sort((a, b) => b.total - a.total);
  },

  calculateDailySales(sales, day) {
    const list = sales.filter(s => s.day === day);
    return { list, ...Logic.totals(list) };
  },

  groupBy(list, keyFn, valFn) {
    const m = new Map();
    for (const x of list) { const k = keyFn(x); const o = m.get(k) || { key: k, value: 0, count: 0 }; o.value += valFn(x); o.count++; m.set(k, o); }
    return [...m.values()].map(o => ({ ...o, value: r2(o.value) })).sort((a, b) => b.value - a.value);
  },

  // Utilidad = Ventas − Gastos + Rentas ; Utilidad real = Utilidad + Propinas  (Resumen sheet)
  calculateProfit({ ventas, gastos, rentas, propinas }) {
    const utilidad = r2(ventas - gastos + rentas);
    return { utilidad, utilidadReal: r2(utilidad + propinas) };
  },

  // Propinas que suman a la utilidad real (hoja Resumen, columna G):
  // desde tipsRule.excludeFrom ya no cuentan; tipsRule.manual[ym] usa el valor escrito en el Resumen; si no, la suma de tips.
  propinasMes(ym, tipsSum, rule) {
    rule = rule || {};
    if (rule.excludeFrom && ym >= rule.excludeFrom) return 0;
    const m = (rule.manual || {})[ym];
    return m != null && m !== '' ? num(m) : r2(tipsSum);
  },
  propinasInRange(sales, from, to, rule) {
    const byM = new Map();
    for (const s of sales) if (s.day >= from && s.day <= to) { const k = Dates.ym(s.day); byM.set(k, (byM.get(k) || 0) + s.tip); }
    let t = 0;
    for (const [ym, tips] of byM) {
      const [y, m] = ym.split('-').map(Number), full = Dates.monthStart(y, m - 1) >= from && Dates.monthEnd(y, m - 1) <= to;
      if (rule && rule.excludeFrom && ym >= rule.excludeFrom) continue;
      t += full ? Logic.propinasMes(ym, tips, rule) : tips;
    }
    return r2(t);
  },

  rentasInRange(rentas, from, to) {
    // Rentas are monthly; they count only for months fully inside the range.
    let t = 0;
    for (const [ym, v] of Object.entries(rentas || {})) {
      const [y, m] = ym.split('-').map(Number);
      if (Dates.monthStart(y, m - 1) >= from && Dates.monthEnd(y, m - 1) <= to) t += num(v);
    }
    return r2(t);
  },

  calculateMonthlySummary(sales, expenses, rentas, tipsRule) {
    const months = new Map();
    const get = ym => { if (!months.has(ym)) months.set(ym, { ym, ventas: 0, descuentos: 0, tips: 0, comisiones: 0, gastos: 0, count: 0 }); return months.get(ym); };
    for (const s of sales) { const o = get(Dates.ym(s.day)); o.ventas += s.price; o.descuentos += s.discount; o.tips += s.tip; o.comisiones += s.commission; o.count++; }
    for (const e of expenses) get(Dates.ym(e.day)).gastos += e.amount;
    for (const ym of Object.keys(rentas || {})) get(ym);
    return [...months.values()].sort((a, b) => a.ym < b.ym ? -1 : 1).map(o => {
      const rent = num((rentas || {})[o.ym]);
      const res = { ...o, ventas: r2(o.ventas), descuentos: r2(o.descuentos), tips: r2(o.tips), comisiones: r2(o.comisiones), gastos: r2(o.gastos), rentas: rent };
      res.propinas = Logic.propinasMes(o.ym, res.tips, tipsRule);
      return Object.assign(res, Logic.calculateProfit({ ventas: res.ventas, gastos: res.gastos, rentas: rent, propinas: res.propinas }));
    });
  },
};

/* =========================================================
   STORE — historical import (read-only) + live records in db.
   ========================================================= */
const PAYMENT_METHODS = ['Tarjeta (Clover)', 'Efectivo', 'Zelle', 'Cash App', 'Depósito', 'Otro'];

const Store = {
  db: null, user: null, canWrite: null, ready: false, dbState: 'connecting',
  config: null, appSales: [], appExpenses: [], hist: { sales: [], expenses: [] },
  listeners: new Set(), connectHooks: [],

  defaultConfig() {
    return {
      artists: DATA.artists.map(a => ({ id: a.id, code: a.code, name: a.name, rate: a.rate, active: true, start: '', end: '' })),
      services: DATA.services.map(s => ({ id: s.id, code: s.code, name: s.name, price: s.price, category: s.category, active: true })),
      categories: DATA.cats.slice(),
      rentas: Object.assign({}, DATA.rentas),
      methods: PAYMENT_METHODS.slice(),
      products: (typeof PERF !== 'undefined' ? PERF.products : []).map(p => ({ ...p })),
      taxRate: 0.07,
      tipsRule: { excludeFrom: '2026-07', manual: { '2026-01': 5692, '2026-02': 4499.5, '2026-03': 5375, '2026-04': 4505, '2026-05': 6810, '2026-06': 5258 } },
    };
  },

  loadHistory() {
    const artists = DATA.artists;
    this.hist.sales = DATA.sales.map(r => {
      const a = artists[r[2]];
      return { id: r[0], source: 'excel', day: r[1], artistKey: a ? a.id : 'none', artistName: a ? a.name : 'Sin lashista',
        service: DATA.svcNames[r[3]], price: r[4], discount: r[5], tip: r[6], commission: r[7], rate: r[8],
        first: r[9], last: r[10], comments: r[11], manual: !!r[12], method: null };
    });
    this.hist.expenses = DATA.expenses.map(r => ({ id: r[0], source: 'excel', day: r[1], description: r[2], amount: r[3], category: DATA.cats[r[4]], comments: r[5] }));
    this.config = this.defaultConfig();
  },

  get sales() { return this._salesCache || (this._salesCache = this.hist.sales.concat(this.appSales).sort((a, b) => b.day - a.day || (a.id < b.id ? 1 : -1))); },
  get expenses() {
    if (!this._expCache) {
      const rep = (this.config && this.config.replacedExcelExpenseMonths) || {};
      this._expCache = this.hist.expenses.filter(e => !rep[Dates.ym(e.day)]).concat(this.appExpenses).sort((a, b) => b.day - a.day);
    }
    return this._expCache;
  },
  invalidate() { this._salesCache = null; this._expCache = null; this.listeners.forEach(fn => fn()); },
  onChange(fn) { this.listeners.add(fn); },

  async connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { this.dbState = 'off'; this.invalidate(); return; }
    try {
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      this.db = db; this.user = user;
      if (!db) { this.dbState = 'off'; this.invalidate(); return; }
      try { this.canWrite = user ? await user.can('data.write') : null; } catch (e) { this.canWrite = null; }
      this.dbState = 'on';
      db.doc('config/main').onSnapshot(snap => {
        if (snap.exists) { const d = snap.data(); this.config = Object.assign(this.defaultConfig(), JSON.parse(JSON.stringify(d))); }
        this.invalidate();
      }, () => {});
      db.collection('sales').onSnapshot(snap => {
        this.appSales = snap.docs.map(d => Store.fromSaleDoc(d.id, d.data())); this.invalidate();
      }, () => {});
      db.collection('expenses').onSnapshot(snap => {
        this.appExpenses = snap.docs.map(d => { const x = d.data(); return { id: d.id, source: 'app', day: Dates.fromISO(x.date), description: x.description || '', amount: num(x.amount), category: x.category || 'Sin categoría', comments: x.comments || '', createdAt: x.createdAt, updatedAt: x.updatedAt, updatedByName: x.updatedByName || '', createdByName: x.createdByName || '', batch: x.batch || '' }; });
        this.invalidate();
      }, () => {});
      this.connectHooks.forEach(fn => fn(db));
    } catch (e) { this.dbState = 'off'; this.invalidate(); }
  },

  fromSaleDoc(id, x) {
    return { id, source: 'app', day: Dates.fromISO(x.date), artistKey: x.artistId, artistName: x.artistName, service: x.serviceName,
      serviceId: x.serviceId, servicePriceSnapshot: x.servicePriceSnapshot, price: num(x.price), discount: num(x.discount), tip: num(x.tip),
      commission: num(x.commission), rate: num(x.commissionRateSnapshot), first: x.clientFirstName || '', last: x.clientLastName || '',
      comments: x.comments || '', manual: !!x.manualCommission, method: x.paymentMethod || null, createdAt: x.createdAt, updatedAt: x.updatedAt,
      depositId: x.depositId || null, depositAmount: num(x.depositAmount), depositMethod: x.depositMethod || null, cashierName: x.cashierName || '',
      packageId: x.packageId || null, packageSession: num(x.packageSession), txn: x.txn || '', origin: x.origin || '', createdBy: x.createdBy || '', payments: Array.isArray(x.payments) ? x.payments : [], payGroup: x.payGroup || '' };
  },

  writable() { return this.dbState === 'on' && this.canWrite !== false; },
  async who() { try { return this.user ? await this.user.id() : null; } catch (e) { return null; } },

  async saveConfig(patch) {
    if (!this.writable()) throw new Error('No tienes permiso para guardar cambios en esta vista.');
    const next = Object.assign({}, this.config, patch, { updatedAt: new Date().toISOString(), updatedBy: await this.who() });
    await this.db.doc('config/main').set(JSON.parse(JSON.stringify(next)));
  },

  async saveSale(form, existingId) {
    if (!this.writable()) throw new Error('No tienes permiso para guardar cambios en esta vista.');
    const artist = this.config.artists.find(a => a.id === form.artistId);
    const svc = this.config.services.find(s => s.id === form.serviceId);
    if (!artist || !svc) throw new Error('Elige lashista y servicio.');
    // Rate and price snapshots: on edit we keep the rate stored at sale time.
    const prev = existingId ? this.appSales.find(s => s.id === existingId) : null;
    const rate = prev && prev.artistKey === artist.id ? prev.rate : artist.rate;
    const calc = Logic.calculateSale({ price: form.price, discount: form.discount, tip: form.tip, rate, manualCommission: form.manualOn ? form.manualCommission : null });
    const now = new Date().toISOString(), uid = await this.who();
    const doc = {
      date: form.date, artistId: artist.id, artistName: artist.name, serviceId: svc.id, serviceName: svc.name,
      servicePriceSnapshot: prev && prev.serviceId === svc.id ? prev.servicePriceSnapshot : svc.price,
      commissionRateSnapshot: rate, price: calc.subtotal, discount: calc.discount, tip: calc.tip, totalPaid: calc.totalPaid,
      commission: calc.commission, manualCommission: !!form.manualOn, payout: calc.payout, fluffyIncome: calc.fluffyIncome,
      paymentMethod: form.method || '', clientFirstName: form.first.trim(), clientLastName: form.last.trim(), comments: form.comments.trim(),
      depositId: form.depositId || '', depositAmount: form.depositId ? r2(form.depositAmount) : 0, depositMethod: form.depositId ? form.depositMethod || '' : '',
      cashierName: prev ? (prev.cashierName || '') : (form.cashierName || ''),
      packageId: form.packageId || '', packageSession: form.packageId ? num(form.packageSession) : 0,
      txn: String(form.txn || '').trim(), origin: prev ? (prev.origin || '') : (form.origin || ''),
      payments: Array.isArray(form.payments) && form.payments.length > 1 ? form.payments.map(p => ({ method: p.method, amount: r2(p.amount), txn: String(p.txn || '').trim() })) : [], payGroup: form.payGroup || '',
      createdAt: prev ? prev.createdAt || now : now, updatedAt: now, updatedBy: uid,
    };
    doc.createdBy = prev ? prev.createdBy || '' : uid;
    const ref = existingId ? this.db.doc('sales/' + existingId) : this.db.collection('sales').doc();
    await ref.set(doc);
    return ref.id;
  },
  async deleteSale(id) { await this.db.doc('sales/' + id).delete(); },

  async saveExpense(form, existingId, editor) {
    if (!this.writable()) throw new Error('No tienes permiso para guardar cambios en esta vista.');
    const now = new Date().toISOString(), uid = await this.who();
    const prev = existingId ? this.appExpenses.find(e => e.id === existingId) : null;
    const doc = { date: form.date, description: form.description.trim(), amount: r2(form.amount), category: form.category, comments: (form.comments || '').trim(),
      createdAt: prev ? prev.createdAt || now : now, updatedAt: now, updatedBy: uid, updatedByName: editor ? editor.name : '' };
    if (prev) { if (prev.createdByName) doc.createdByName = prev.createdByName; if (prev.batch) doc.batch = prev.batch; } else { doc.createdBy = uid; doc.createdByName = editor ? editor.name : ''; }
    const ref = existingId ? this.db.doc('expenses/' + existingId) : this.db.collection('expenses').doc();
    await ref.set(doc);
    return { id: ref.id, before: prev, after: doc };
  },
  async deleteExpense(id) { await this.db.doc('expenses/' + id).delete(); },
};

/* =========================================================
   EXPORT — CSV / Excel through the viewer's download prompt.
   ========================================================= */
const Exporter = {
  async save(filename, data) {
    const c = window.claude; const dl = c && c.use ? await c.use('downloads') : null;
    if (!dl) { UI.toast('La descarga no está disponible en esta vista.', true); return; }
    try { await dl.save({ filename, data }); UI.toast('Archivo listo: ' + filename); }
    catch (e) { if (e && e.code === 'declined') return; UI.toast('No se pudo descargar el archivo (' + ((e && e.code) || 'error') + ').', true); }
  },
  csv(rows) { return '\ufeff' + rows.map(r => r.map(v => { const s = v == null ? '' : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n'); },
  async run(kind, name, rows) {
    const stamp = Dates.toISO(Dates.today());
    if (kind === 'csv') return this.save(`${name}_${stamp}.csv`, this.csv(rows));
    if (kind === 'xlsx') {
      if (!window.XLSX) { UI.toast('El módulo de Excel no cargó. Exporta en CSV.', true); return; }
      const ws = XLSX.utils.aoa_to_sheet(rows); const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
      const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
      return this.save(`${name}_${stamp}.xlsx`, new Blob([buf]));
    }
    if (kind === 'pdf') { try { window.print(); } catch (e) { UI.toast('La impresión no está disponible aquí.', true); } }
  },
};

/* =========================================================

  </div>`;
}
function mountPeriod(root, state, rerender) {
  $$('[data-period] [data-k]', root).forEach(b => b.onclick = () => { state.kind = b.dataset.k; rerender(); });
  const y = $('[data-year]', root); if (y) y.onchange = () => { state.year = +y.value; rerender(); };
  const f = $('[data-from]', root), t = $('[data-to]', root);
  if (f) f.onchange = () => { const d = Dates.fromISO(f.value); if (d != null) { state.from = d; if (state.to < d) state.to = d; rerender(); } };
  if (t) t.onchange = () => { const d = Dates.fromISO(t.value); if (d != null) { state.to = d; if (state.from > d) state.from = d; rerender(); } };
}
function periodRange(st) {
  const t = Dates.today(), { y, m } = Dates.parts(t);
  switch (st.kind) {
    case 'hoy': return { from: t, to: t, title: 'Hoy', sub: Dates.fmt(t, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) };
    case 'semana': { const s = Dates.fluffyWeekStart(t); return { from: s, to: s + 6, title: 'Esta semana', sub: weekLabel(s) }; }
    case 'prev': { const pm = m === 0 ? 11 : m - 1, py = m === 0 ? y - 1 : y; return { from: Dates.monthStart(py, pm), to: Dates.monthEnd(py, pm), title: `${Dates.monthName(py, pm)} ${py}`, sub: 'Mes anterior' }; }
    case 'anio': return { from: Dates.monthStart(st.year, 0), to: Dates.monthEnd(st.year, 11), title: String(st.year), sub: 'Año completo' };
    case 'rango': return { from: st.from, to: st.to, title: 'Rango', sub: `${Dates.fmt(st.from)} – ${Dates.fmt(st.to)}` };
    default: return { from: Dates.monthStart(y, m), to: Dates.monthEnd(y, m), title: `${Dates.monthName(y, m)} ${y}`, sub: 'Este mes' };
  }
}
const weekLabel = s => `Vie ${Dates.fmt(s, { day: 'numeric', month: 'short' })} – Jue ${Dates.fmt(s + 6, { day: 'numeric', month: 'short', year: 'numeric' })}`;

function barChart(points, opts = {}) {
  if (!points.length || points.every(p => !p.value)) return `<div class="empty"><b>Sin ventas en este periodo</b>Elige otro periodo para ver la gráfica.</div>`;
  const W = 760, H = opts.h || 230, L = 52, B = 26, T = 10, R = 6;
  const max = Math.max(...points.map(p => p.value)) || 1;
  const step = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / step) * step;
  const bw = (W - L - R) / points.length, every = Math.ceil(points.length / 14);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = top * i / 4, yy = T + (H - T - B) * (1 - i / 4); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${v >= 1000 ? '$' + (v / 1000).toLocaleString('en-US', { maximumFractionDigits: 1 }) + 'k' : '$' + v}</text>`; }
  points.forEach((p, i) => {
    const h = (H - T - B) * (p.value / top), x = L + i * bw + bw * 0.16, w = Math.max(bw * 0.68, 1);
    g += `<rect x="${x}" y="${H - B - h}" width="${w}" height="${Math.max(h, 0)}" rx="${Math.min(4, w / 2)}" fill="${p.hi ? 'var(--gold)' : 'var(--pink)'}"><title>${esc(p.label)}: ${money(p.value)}</title></rect>`;
    if (i % every === 0) g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${esc(p.short || p.label)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Gráfica')}">${g}</svg></div>`;
}
function rankList(items, opts = {}) {
  if (!items.length) return `<div class="empty"><b>Sin datos</b>${opts.empty || 'No hay registros en este periodo.'}</div>`;
  const metric = it => opts.byCount ? it.count : it.value, max = Math.max(...items.map(metric)) || 1;
  return `<ol class="rank">${items.map((it, i) => `<li><span class="n">${i + 1}</span><div>${esc(it.key)}<div class="bar"><i style="width:${Math.max(2, 100 * metric(it) / max)}%"></i></div></div><div class="amt">${opts.byCount ? intf(it.count) + ' ' + opts.countLabel : money(it.value)}<small>${opts.byCount ? money(it.value) : (opts.countLabel ? intf(it.count) + ' ' + opts.countLabel : '')}</small></div></li>`).join('')}</ol>`;
}
function table(cols, rows, foot, opts = {}) {

function ventasFiltered() {
  const f = S.ventas, q = f.q.trim().toLowerCase();
  return Store.sales.filter(s => (f.from == null || s.day >= f.from) && (f.to == null || s.day <= f.to) && (!f.artist || s.artistKey === f.artist)
    && (!f.service || s.service === f.service) && (!f.source || s.source === f.source)
    && (!q || (s.first + ' ' + s.last + ' ' + s.service + ' ' + s.artistName + ' ' + s.comments + ' ' + (s.txn || '')).toLowerCase().includes(q)));
}

function editorModal(titleTxt, fields, values, onSave) {
  UI.modal(`<h3>${esc(titleTxt)}</h3><form class="formgrid" novalidate data-ed>${fields.map(f => `<label class="field ${f.full ? 'full' : ''}">${esc(f.label)}${
      f.type === 'select' ? `<select name="${f.name}">${f.options.map(o => `<option ${String(values[f.name]) === String(o) ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
      : f.type === 'check' ? `<span class="check"><input type="checkbox" name="${f.name}" ${values[f.name] ? 'checked' : ''}> ${esc(f.hint || '')}</span>`
      : `<input name="${f.name}" type="${f.type || 'text'}" ${f.step ? `step="${f.step}"` : ''} value="${esc(values[f.name] == null ? '' : values[f.name])}" ${f.list ? `list="${f.name}-l"` : ''}>${f.list ? `<datalist id="${f.name}-l">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}`
    }<span class="err"></span></label>`).join('')}</form>
    <div class="acts"><button class="btn" data-x="no">Cancelar</button><button class="btn primary" data-x="ok" ${Store.writable() ? '' : 'disabled'}>Guardar</button></div>`, m => {
    $('[data-x=no]', m).onclick = UI.close;
    $('[data-x=ok]', m).onclick = async () => {
      const form = $('[data-ed]', m), out = {};
      fields.forEach(f => { const el = form[f.name]; out[f.name] = f.type === 'check' ? el.checked : el.value; });
      $$('.field', form).forEach(x => { x.classList.remove('invalid'); $('.err', x).textContent = ''; });
      const errs = fields.reduce((a, f) => { const e = f.validate && f.validate(out[f.name], out); if (e) a[f.name] = e; return a; }, {});
      if (Object.keys(errs).length) { Object.entries(errs).forEach(([k, msg]) => { const fld = form[k].closest('.field'); fld.classList.add('invalid'); $('.err', fld).textContent = msg; }); return; }
      const b = $('[data-x=ok]', m); b.disabled = true; b.textContent = 'Guardando…';
      try { await onSave(out); UI.close(); UI.toast('Cambios guardados'); } catch (e) { b.disabled = false; b.textContent = 'Guardar'; UI.toast('No se pudo guardar: ' + (e.message || e.code), true); }
    };
  });
}

/* ---------- reports ---------- */
const REPORTS = [['ventas', 'Ventas'], ['comisiones', 'Comisiones'], ['tips', 'Tips'], ['gastos', 'Gastos'], ['utilidad', 'Resumen mensual'], ['lashista', 'Por lashista'], ['servicio', 'Por servicio'], ['payroll', 'Payroll semanal'], ['conciliacion', 'Conciliación Excel'], ['importacion', 'Importación']];
function buildReport() {
  const f = S.rep, sales = Logic.filterSales(Store.sales, f), exps = Store.expenses.filter(e => e.day >= f.from && e.day <= f.to);
  const M = v => money(v, 1);
  switch (f.tab) {
    case 'ventas': { const rows = salesRows(sales); return { cols: rows[0].map((l, i) => ({ label: l, r: [3, 4, 5, 6, 8, 9, 10].includes(i), f: [3, 4, 5, 6, 8, 9, 10].includes(i) ? M : (i === 7 ? pct : null) })), rows: rows.slice(1), cap: 200, aoa: rows }; }
    case 'comisiones': case 'tips': {
      const k = f.tab === 'tips' ? 'tip' : 'commission';
      const g = Logic.calculatePayroll(sales, f.from, f.to);
      const cols = f.tab === 'tips' ? ['Lashista', 'Servicios', 'Tips', 'Tip promedio'] : ['Lashista', 'Servicios', 'Ventas netas', '% efectivo', 'Comisión'];
      const rows = g.map(r => f.tab === 'tips' ? [r.name, r.count, r.tips, r.count ? r.tips / r.count : 0] : [r.name, r.count, r.netas, r.pct, r.comision]);
      const foot = f.tab === 'tips' ? ['Total', sales.length, Logic.sum(sales, 'tip'), sales.length ? Logic.sum(sales, 'tip') / sales.length : 0] : ['Total', sales.length, Logic.sum(g, 'netas'), '', Logic.sum(sales, 'commission')];
      return { cols: cols.map((l, i) => ({ label: l, r: i > 0, f: i === 0 ? null : i === 1 ? intf : (l.startsWith('%') ? (v => v === '' ? '' : pct(v)) : M) })), rows, foot, aoa: [cols].concat(rows, [foot]) };
    }
    case 'gastos': {
      const g = Logic.groupBy(exps, e => e.category, e => e.amount), tot = Logic.sum(exps, 'amount');
      const rows = g.map(x => [x.key, x.count, x.value, tot ? x.value / tot : 0]);
      return { cols: [{ label: 'Categoría' }, { label: 'Registros', r: 1, f: intf }, { label: 'Monto', r: 1, f: M }, { label: '% del total', r: 1, f: pct }], rows, foot: ['Total', exps.length, tot, 1], aoa: [['Categoría', 'Registros', 'Monto', '% del total']].concat(rows) };
    }
    case 'utilidad': {
      const all = Logic.calculateMonthlySummary(Store.sales, Store.expenses, Store.config.rentas, Store.config.tipsRule).filter(m => { const [y, mm] = m.ym.split('-').map(Number); return Dates.monthEnd(y, mm - 1) >= f.from && Dates.monthStart(y, mm - 1) <= f.to; });
      const lab = ym => { const [y, m] = ym.split('-').map(Number); return `${Dates.monthName(y, m - 1)} ${y}`; };
      const rows = all.map(m => [lab(m.ym), m.ventas, m.gastos, m.rentas, m.utilidad, m.tips, m.propinas, m.utilidadReal, m.comisiones]);
      const sum = i => rows.reduce((a, r) => a + r[i], 0);
      const head = ['Mes', 'Ventas', 'Gastos / egresos', 'Rentas', 'Utilidad', 'Tips cobrados', 'Propinas en utilidad', 'Utilidad real', 'Comisiones generadas'];
      return { cols: head.map((l, i) => ({ label: l, r: i > 0, f: i ? M : null })), rows, foot: rows.length ? ['Total', sum(1), sum(2), sum(3), sum(4), sum(5), sum(6), sum(7), sum(8)] : null, aoa: [head].concat(rows),
        note: 'Calculado desde las transacciones. Utilidad = ventas − gastos + rentas. Utilidad real = utilidad + propinas en utilidad: enero a junio 2026 usa las propinas del Resumen del Excel y desde julio 2026 las propinas no suman. Rentas y propinas se ajustan en Configuración.' };
    }
    case 'lashista': {
      const g = Logic.calculatePayroll(sales, f.from, f.to), head = ['Lashista', 'Servicios', 'Ventas', 'Descuentos', 'Comisión', 'Tips', 'Ticket promedio'];
      const rows = g.map(r => [r.name, r.count, r.ventas, r.descuentos, r.comision, r.tips, r.count ? r.ventas / r.count : 0]);
      return { cols: head.map((l, i) => ({ label: l, r: i > 0, f: i === 1 ? intf : (i ? M : null) })), rows, aoa: [head].concat(rows) };
    }
    case 'servicio': {
      const g = Logic.groupBy(sales, s => s.service, s => s.price), head = ['Servicio', 'Vendidos', 'Ventas', 'Precio promedio'];
      const rows = g.map(x => [x.key, x.count, x.value, x.count ? x.value / x.count : 0]);
      return { cols: head.map((l, i) => ({ label: l, r: i > 0, f: i === 1 ? intf : (i ? M : null) })), rows, aoa: [head].concat(rows) };
    }
    case 'payroll': {
      const head = ['Semana Fluffy', 'Lashista', 'Servicios', 'Ventas', 'Descuentos', 'Comisión', 'Tips', 'Total a pagar'], rows = [];
      for (let ws = Dates.fluffyWeekStart(f.to); ws + 6 >= f.from; ws -= 7) Logic.calculatePayroll(sales, Math.max(ws, f.from), Math.min(ws + 6, f.to)).forEach(r => rows.push([weekLabel(ws), r.name, r.count, r.ventas, r.descuentos, r.comision, r.tips, r.total]));
      return { cols: head.map((l, i) => ({ label: l, r: i > 1, f: i === 2 ? intf : (i > 2 ? M : null) })), rows, cap: 300, aoa: [head].concat(rows) };
    }
    case 'conciliacion': return reconciliation();
    case 'importacion': return importReport();
  }
}
function reconciliation() {
  const hist = Logic.calculateMonthlySummary(Store.hist.sales, Store.hist.expenses, DATA.rentas), byM = new Map(hist.map(m => [m.ym, m]));
  const head = ['Mes', 'Ventas Excel', 'Ventas app', 'Dif. ventas', 'Gastos hoja GASTOS', 'Gastos app', 'Dif. gastos', 'Gastos en Resumen', 'Utilidad Excel', 'Utilidad app', 'Dif. utilidad', 'Explicación'];
  const rows = Object.entries(DATA.excel).map(([ym, x]) => {
    const a = byM.get(ym) || { ventas: 0, gastos: 0, tips: 0, utilidad: 0 }, [y, m] = ym.split('-').map(Number);
    const dv = x.ventas == null ? null : a.ventas - x.ventas, dg = x.gastosSumifs == null ? null : a.gastos - x.gastosSumifs, du = x.utilidad == null ? null : a.utilidad - x.utilidad;
    const why = [];

    if (dv != null && Math.abs(dv) > 0.01) why.push(`Ventas difieren ${money(dv, 1)}.`);
    if (dg != null && Math.abs(dg) > 0.01) why.push(`Gastos difieren ${money(dg, 1)}.`);
    const rentNeg = -Store.hist.expenses.filter(e => e.amount < 0 && Dates.ym(e.day) === ym).reduce((t, e) => t + e.amount, 0);
    if (rentNeg) why.push(`La hoja GASTOS ya resta ${money(rentNeg, 1)} de renta de cabinas como gasto negativo, así que la app no la suma otra vez.`);
    if (x.gastos != null && x.gastosSumifs != null && Math.abs(x.gastos - x.gastosSumifs - rentNeg) > 0.01) why.push(`Gastos escritos a mano en el Resumen (${money(x.gastos, 1)}) difieren de la hoja GASTOS por ${money(x.gastos - x.gastosSumifs - rentNeg, 1)}.`);
    if (x.rentas != null && rentNeg && Math.abs(x.rentas - rentNeg) > 0.01) why.push(`El Resumen sumó ${money(x.rentas, 1)} de rentas, pero GASTOS registra ${money(rentNeg, 1)}.`);
    if (x.propinas != null && Math.abs(x.propinas - a.tips) > 0.01) why.push(`Propinas del Resumen escritas a mano (${money(x.propinas)}) vs suma de tips (${money(a.tips)}).`);
    if (!why.length) why.push('Cuadra.');
    return [`${Dates.monthName(y, m - 1)} ${y}`, x.ventas, a.ventas, dv, x.gastosSumifs, a.gastos, dg, x.gastos, x.utilidad, a.utilidad, du, why.join(' ')];
  });
  const M = v => v == null ? '—' : money(v, 1);

    wrap: 'last', note: 'Compara solo el histórico importado contra el Resumen del Excel. Ventas y gastos cuadran a $0 donde el Excel tiene datos. Cada fila explica cualquier diferencia de utilidad.' };
}

const fmtVal = (type, v) => {
  if (v == null || v === '') return '—';
  switch (type) {
    case 'money': return money(v, 1);
    case 'money0': return money(v);
    case 'int': return intf(v);
    case 'pct': return pct(v);
    default: return String(v);
  }
};
const TT = {

  mem: {},

      footStyles: { fillColor: [255, 255, 255], textColor: [58, 42, 46], fontStyle: 'bold' },

    }
    return orig.call(Exporter, kind, name, rows);

/* =========================================================
   RENDIMIENTO — metas semanales, productividad mensual y notas de insumos.
   Logic first (pure), then store, then UI.
   ========================================================= */
const SERVICE_GROUPS = ['Full set', 'Refill', 'Brow & wax', 'Lash lift', 'Extras', 'Complimentary fills'];
const LASH_LIFT = new Set(['Lash Lift + Tint', 'Lash Lift', 'Eyelash Tinting', 'lash lift reversible']);
const NOT_A_SERVICE = new Set(['Descuento', 'Bono']); // adjustment lines, not work done
const CHECKS = [['limpieza', 'Limpieza'], ['reviews', 'Reviews'], ['fotos', 'Fotos y videos']];
const CHECK_CYCLE = ['', 'O', 'X', '?'];

const Perf = {
  serviceGroup(name) {
    if (NOT_A_SERVICE.has(name)) return null;
    if (LASH_LIFT.has(name)) return 'Lash lift';
    if (name === 'Complimentary Fill') return 'Complimentary fills';
    const s = Store.config.services.find(x => x.name === name);
    const c = s ? s.category : '';
    return c === 'Full Set' ? 'Full set' : c === 'Refill' ? 'Refill' : c === 'Brows & Wax' ? 'Brow & wax' : 'Extras';
  },
  // A Fri–Thu week counts for the month that holds most of its days (= the month of its Monday).
  weekMonth(ws) { return Dates.ym(ws + 3); },
  weeksOfMonth(ym) {
    const [y, m] = ym.split('-').map(Number), out = [];
    for (let ws = Dates.fluffyWeekStart(Dates.monthStart(y, m - 1)) - 7; ws <= Dates.monthEnd(y, m - 1); ws += 7) if (Perf.weekMonth(ws) === ym) out.push(ws);
    return out;
  },
  weekSales(sales, ws) {
    const m = new Map();
    for (const s of sales) if (s.day >= ws && s.day <= ws + 6) m.set(s.artistKey, r2((m.get(s.artistKey) || 0) + s.price));
    return m;
  },
  calculatePerformance(sales, from, to) {
    const by = new Map();
    for (const s of sales) {
      if (s.day < from || s.day > to) continue;
      let p = by.get(s.artistKey);
      if (!p) { p = { key: s.artistKey, name: s.artistName, count: 0, groups: Object.fromEntries(SERVICE_GROUPS.map(g => [g, 0])), ventas: 0, tips: 0 }; by.set(s.artistKey, p); }
      const g = Perf.serviceGroup(s.service);
      if (g) { p.groups[g]++; p.count++; }
      p.ventas += s.price; p.tips += s.tip;
    }
    for (const p of by.values()) { p.ventas = r2(p.ventas); p.tips = r2(p.tips); p.ticket = p.count ? r2(p.ventas / p.count) : 0; }
    return by;
  },
  // Notes (Jerry model): Subtotal → sequential discounts (each over the previous result) → tax 7% → TOTAL DUE.
  // With no discounts this equals the Excel notes: Tax due = ROUND(subtotal × 7%, 2).
  calculateNote(items, taxRate, discounts) {
    const lines = items.map(i => ({ ...i, amount: r2(num(i.qty) * num(i.unit)) }));
    const subtotal = r2(lines.reduce((t, i) => t + i.amount, 0));
    let run = subtotal;
    const disc = (discounts || []).filter(d => num(d.value) > 0).map(d => {
      const amount = d.type === 'pct' ? r2(run * num(d.value) / 100) : Math.min(r2(num(d.value)), run);
      run = r2(run - amount); return { ...d, amount, after: run };
    });
    const tax = r2(run * num(taxRate));
    return { lines, subtotal, discounts: disc, discountTotal: r2(subtotal - run), taxable: run, tax, total: r2(run + tax) };
  },
};

  metasFoot(vr) {

    return { name: 'Total', meta: tm, real: r2(vr.reduce((t, r) => t + r.real, 0)), ratio: tm ? r2(tr / tm * 1000) / 1000 : null, diff: tm ? r2(tr - tm) : null };

  metas() {
    const ws = S.perf.week, data = this.metasData(ws), cols = this.metasCols(), ro = !Store.writable();

    return `<div class="filters no-print" style="align-items:center;justify-content:space-between">

  prodData(ym) {

    return [...ids].filter(Boolean).map(id => {
      const p = perf.get(id) || { count: 0, groups: Object.fromEntries(SERVICE_GROUPS.map(g => [g, 0])), ventas: 0, tips: 0, ticket: 0 };
      let meta = 0, real = 0, ok = 0, marked = 0;
      weeks.forEach(ws => { const g = Store.goalsFor(ws)[id] || {}; if (g.meta) { meta += num(g.meta); real += Perf.weekSales(Store.sales, ws).get(id) || 0; } CHECKS.forEach(([k]) => { if (g[k] === 'O' || g[k] === 'X') { marked++; if (g[k] === 'O') ok++; } }); });

      { key: 'name', label: 'Lashista', always: 1, get: r => r._name, html: r => `<button class="linkbtn" data-detail="${r._key}">${esc(r._name)}</button>` },
      { key: 'score', label: 'Rendimiento', type: 'pct', get: r => r.score, html: r => `<span class="pctin"><input class="inp num" type="number" min="0" max="100" step="1" data-score="${r._key}" value="${r.score != null ? Math.round(r.score * 100) : ''}" placeholder="—" ${ro ? 'disabled' : ''} aria-label="Rendimiento de ${esc(r._name)}">%</span>` },

      { key: 'tips', label: 'Tips', r: 1, type: 'money0', get: r => r.tips },

  productividad() {
    const ym = S.perf.month, data = this.prodData(ym), cols = this.prodCols();
    this._prod = data;
    return `<div class="filters no-print" style="align-items:center;justify-content:space-between"><div class="weeknav"><button class="btn sm" data-pm="-1" aria-label="Mes anterior">${ic('left')}</button><span class="w">${esc(ymLabel(ym))}</span><button class="btn sm" data-pm="1" aria-label="Mes siguiente">${ic('right')}</button></div>${TT.toolbar('prod', cols, data)}</div>
      ${TT.table('prod', cols, data, null, { emptyTitle: 'Sin lashistas en la tabla', empty: 'Elige otro mes, o vuelve a marcar lashistas en el selector.' })}
      <p class="formula">Servicios, ventas y tips salen solos de las ventas del mes. Meta del mes = suma de metas de las semanas que caen en este mes. Rendimiento y Comentarios los escribe la administración. El PDF sale con las lashistas y columnas que tengas marcadas.</p>`;

      <div class="filters no-print">
        <label class="field">Mes<select data-nf="nMonth"><option value="">Todos</option>${months.map(m => `<option value="${m || 'none'}" ${f.nMonth === (m || 'none') ? 'selected' : ''}>${esc(ymLabel(m))}</option>`).join('')}</select></label>
        <label class="field">Lashista<select data-nf="nArtist">${artistOptions(f.nArtist, 1, 1)}</select></label>

        list.map(n => [ymLabel(n.month), n.artistName, n.invoice || '—', intf(n.items.reduce((t, i) => t + num(i.qty), 0)), money(n.subtotal, 1), n.discountTotal ? '−' + money(n.discountTotal, 1) : '—', money(n.tax, 1), money(n.total, 1),

        list.length ? ['Total', '', '', '', money(tot('subtotal'), 1), '−' + money(tot('discountTotal'), 1), money(tot('tax'), 1), money(tot('total'), 1), '', ''] : null,
        { click: 1, emptyTitle: 'Sin notas', empty: 'Registra una nota con los insumos que consumió cada lashista en el mes.' })}
      <div class="pager"><span>Subtotal → descuentos → tax ${pct(Store.config.taxRate)} → total. Las canceladas no suman. Toca una nota para ver el detalle o descargar el invoice.</span>${exportButtons('notas')}</div>`;
  },

  mount(root) {

        b.innerHTML = checkMark(row[k]);
        try { await Store.saveGoals(ws, g); } catch (e) { fail(e); }
      });
      const cp = $('[data-copy]', root); if (cp) cp.onclick = async () => {
        const prev = Store.goalsFor(ws - 7), g = cur(); let n = 0;
        Object.entries(prev).forEach(([id, p]) => { if (p.meta != null && (g[id] || {}).meta == null) { g[id] = { ...(g[id] || {}), meta: p.meta }; n++; } });
        if (!n) { UI.toast('No hay metas nuevas que copiar.'); return; }
        try { await Store.saveGoals(ws, g); UI.toast(`${n} metas copiadas`); } catch (e) { fail(e); }
      };
      TT.mount(root, 'metas', this.metasCols(), this._metas, { title: 'Metas semanales', subtitle: weekLabel(ws), file: 'Metas_' + Dates.toISO(ws), foot: vr => this.metasFoot(vr) });
    }
    if (f.tab === 'productividad') {

        .concat(this._notesList.flatMap(n => n.items.map((i, k) => [n.month || 'Sin mes', n.artistName, n.invoice || '', i.code, i.desc, i.qty, i.unit, i.amount, k ? '' : n.subtotal, k ? '' : n.discountTotal, k ? '' : n.tax, k ? '' : n.total, n.status, n.source === 'app' ? 'App' : n.excelRef]))), 'Notas_insumos');

function perfDetail(id, ym) {
  const [y, m] = ym.split('-').map(Number), cur = Perf.calculatePerformance(Store.sales, Dates.monthStart(y, m - 1), Dates.monthEnd(y, m - 1)).get(id);
  const pym = shiftMonth(ym, -1), [py, pm] = pym.split('-').map(Number), prev = Perf.calculatePerformance(Store.sales, Dates.monthStart(py, pm - 1), Dates.monthEnd(py, pm - 1)).get(id);
  const delta = (a, b) => !b ? '—' : `<span class="${a >= b ? 'okc' : 'neg'}">${a >= b ? '+' : '−'}${pct(Math.abs(a - b) / b)}</span>`;
  const weeks = Perf.weeksOfMonth(ym).map(ws => { const g = Store.goalsFor(ws)[id] || {}, real = Perf.weekSales(Store.sales, ws).get(id) || 0; return [weekLabel(ws), g.meta ? money(g.meta) : '—', money(real), g.meta ? pctCell(real, num(g.meta)) : '—', ...CHECKS.map(([k]) => checkMark(g[k]))]; });
  const notes = Store.notes.filter(n => n.month === ym && n.artistId === id);
  const c = cur || { count: 0, ventas: 0, ticket: 0, tips: 0, groups: {} }, p = prev || { count: 0, ventas: 0, ticket: 0 };
  UI.modal(`<h3>${esc(artistName(id))}</h3><p style="color:var(--muted);margin:0 0 14px">${esc(ymLabel(ym))} comparado con ${esc(ymLabel(pym))}</p>
    ${table([{ label: 'Métrica' }, { label: 'Este mes', r: 1 }, { label: 'Mes anterior', r: 1 }, { label: 'Cambio', r: 1, html: 1 }],
      [['Ventas', money(c.ventas), money(p.ventas), delta(c.ventas, p.ventas)], ['Servicios', intf(c.count), intf(p.count), delta(c.count, p.count)], ['Ticket promedio', money(c.ticket), money(p.ticket), delta(c.ticket, p.ticket)], ['Tips', money(c.tips), money((prev || {}).tips || 0), delta(c.tips, (prev || {}).tips || 0)]])}
    <h4 style="margin:18px 0 8px">Semanas del mes</h4>
    ${table([{ label: 'Semana' }, { label: 'Meta', r: 1 }, { label: 'Ventas', r: 1 }, { label: '%', html: 1 }, ...CHECKS.map(([, l]) => ({ label: l, html: 1 }))], weeks)}
    <h4 style="margin:18px 0 8px">Insumos del mes</h4>
    ${notes.length ? table([{ label: 'Artículo' }, { label: 'Cant.', r: 1 }, { label: 'Monto', r: 1 }], notes.flatMap(n => n.items.map(i => [i.desc, intf(num(i.qty)), money(i.amount, 1)])), ['Total con tax', '', money(r2(notes.reduce((t, n) => t + n.total, 0)), 1)]) : '<p style="color:var(--muted);margin:0">Sin notas de insumos este mes.</p>'}
    <div class="acts"><button class="btn primary" data-x="c">Cerrar</button></div>`, mm => { mm.classList.add('wide'); $('[data-x=c]', mm).onclick = UI.close; });
}

function noteTotalsHtml(n) {
  return `<div class="rline"><span>Subtotal</span><span>${money(n.subtotal, 1)}</span></div>
    ${(n.discounts || []).map(d => `<div class="rline"><span>${esc(d.label || 'Descuento')}${d.type === 'pct' ? ' (' + d.value + '%)' : ''}</span><span>−${money(d.amount, 1)}</span></div>`).join('')}
    ${(n.discounts || []).length ? `<div class="rline"><span>Taxable</span><span>${money(n.taxable, 1)}</span></div>` : ''}
    <div class="rline"><span>Tax ${pct(n.taxRate != null ? n.taxRate : 0.07)}</span><span>${money(n.tax, 1)}</span></div><div class="rline total"><span>TOTAL Due</span><span>${money(n.total, 1)}</span></div>`;
}

function noteDetail(n) {
  const canEdit = n.source === 'app' && Store.writable(), ex = n.excel, diff = ex && ex.total != null && Math.abs(ex.total - n.total) > 0.005;
  UI.modal(`<h3>Invoice ${n.invoice ? '#' + esc(n.invoice) : ''}</h3><p style="color:var(--muted);margin:0 0 14px">${esc(n.artistName)} · ${esc(ymLabel(n.month))} · ${statusTag(n.status)}</p>
    ${table([{ label: 'Código' }, { label: 'Artículo' }, { label: 'Cant.', r: 1 }, { label: 'Precio', r: 1 }, { label: 'Monto', r: 1 }], n.items.map(i => [i.code || '—', i.desc, intf(num(i.qty)), money(i.unit, 1), money(i.amount, 1)]))}
    <div style="max-width:320px;margin:14px 0 0 auto">${noteTotalsHtml(n)}</div>
    ${n.comments ? `<p class="formula">${esc(n.comments)}</p>` : ''}
    ${n.source === 'excel' ? `<p class="formula">Importada de ${esc(n.excelRef)}. ${n.month ? 'Año 2025 asumido: la nota solo dice el mes.' : 'La nota no dice el mes; queda por confirmar.'}${diff ? ` En el Excel el total es ${money(ex.total, 1)} porque el tax se calculó sobre ${money(ex.taxable, 1)} en lugar del subtotal.` : ''}</p>` : ''}
    <div class="acts"><button class="btn" data-x="pdf">${ic('dl')}Invoice PDF</button>${canEdit ? '<button class="btn danger" data-x="del">Eliminar</button><button class="btn" data-x="ed">Editar</button>' : ''}<button class="btn primary" data-x="c">Cerrar</button></div>`, m => {
    $('[data-x=c]', m).onclick = UI.close;
    $('[data-x=pdf]', m).onclick = () => Pdf.invoice(n);
    if (canEdit) {
      $('[data-x=ed]', m).onclick = () => { UI.close(); noteEditor(n); };
      $('[data-x=del]', m).onclick = async () => { if (!await UI.confirm('Eliminar nota', `Se eliminará la nota de ${esc(n.artistName)} por ${money(n.total, 1)}. Si solo quieres anularla, cámbiala a Cancelada.`, 'Eliminar nota')) return; try { await Store.deleteNote(n.id); UI.toast('Nota eliminada'); } catch (e) { UI.toast('No se pudo eliminar', true); } };
    }
  });
}

Pdf.invoice = function (n) {
  const doc = Pdf.doc(false);
  if (!doc || !doc.autoTable) { UI.toast('El generador de PDF no cargó.', true); return; }
  const w = doc.internal.pageSize.getWidth(), ink = [58, 42, 46], muted = [110, 89, 96];
  const lx = typeof FM_LOGO_FULL !== 'undefined' ? 112 : 40; if (lx > 40) try { doc.addImage(FM_LOGO_FULL, 'PNG', 40, 34, 62, 50); } catch (e) {}
  doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(...ink); doc.text('Fluffy Lashes', lx, 56);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...muted);
  ['2693 Biscayne Blvd,', 'Miami, Fl. 33137', 'Phone: (561) 307 5577', 'www.fluffylashesco.com'].forEach((t, i) => doc.text(t, lx, 76 + i * 12));
  doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(...ink); doc.text('INVOICE', w - 40, 56, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  const date = n.date ? Dates.fmt(Dates.fromISO(n.date)) : Dates.fmt(Dates.today());
  [['DATE:', date], ['INVOICE #', n.invoice || '—'], ['Customer ID', String(n.customerId || (Store.config.artists.find(a => a.id === n.artistId) || {}).code || '—')], ['Mes', ymLabel(n.month)]]
    .forEach(([l, v], i) => { doc.setTextColor(...muted); doc.text(l, w - 160, 76 + i * 13); doc.setTextColor(...ink); doc.text(String(v), w - 40, 76 + i * 13, { align: 'right' }); });
  doc.setFillColor(244, 194, 194); doc.rect(40, 136, 220, 18, 'F'); doc.setFont('helvetica', 'bold'); doc.setTextColor(...ink); doc.text('BILL TO', 48, 148);
  doc.setFont('helvetica', 'normal'); doc.text(String(n.artistName || ''), 48, 168); doc.text('MIAMI', 48, 181);
  doc.autoTable({ startY: 200, head: [['COD', 'ITEM & DESCRIPTION', 'QTY', 'AMOUNT']], body: n.items.map(i => [i.code || '', i.desc, intf(num(i.qty)), fmt2.format(num(i.amount))]),
    theme: 'grid', margin: { left: 40, right: 40 }, styles: { font: 'helvetica', fontSize: 9.5, textColor: ink, lineColor: [239, 228, 223], lineWidth: 0.5 },
    headStyles: { fillColor: [244, 194, 194], textColor: ink }, columnStyles: { 2: { halign: 'right', cellWidth: 50 }, 3: { halign: 'right', cellWidth: 80 } } });

/* =========================================================
   PRODUCTOS — catálogo, inventario de bodega y de salón, movimientos y resumen.
   Stock is never stored: it is the sum of movements, minus what app notes (invoices)
   delivered to lashistas from the salon.
   ========================================================= */
const LOCS = { bodega: 'Bodega', salon: 'Salón' };
const MOVE_TYPES = ['Compra', 'Transferencia', 'Venta en salón', 'Ajuste'];
const NOTE_DEDUCTS = new Set(['Enviada', 'Pagada']); // a note takes stock out of the salon once it is issued

Object.assign(Store, {
  moves: [],
  product(code) { return this.config.products.find(p => p.code === code); },
  noteMoves() {
    return this.appNotes.filter(n => NOTE_DEDUCTS.has(n.status) && !n.fromDeliveries).flatMap(n => (n.items || []).filter(i => i.code).map(i => ({
      id: 'note-' + n.id + '-' + i.code, source: 'note', date: n.date || (n.month + '-01'), type: 'Nota a lashista', code: i.code, name: i.desc, from: 'salon', to: null,
      qty: num(i.qty), unitPrice: num(i.unit), notes: `Invoice #${n.invoice} · ${n.artistName}` })));
  },
  allMoves() { return this.moves.concat(this.noteMoves()).sort((a, b) => (b.date || '').localeCompare(a.date || '')); },
  stock() {
    const s = new Map(), get = c => { if (!s.has(c)) s.set(c, { bodega: 0, salon: 0 }); return s.get(c); };
    for (const m of this.allMoves()) {
      const x = get(m.code);
      if (m.type === 'Ajuste') x[m.location] += num(m.qty);
      else { if (m.from) x[m.from] -= num(m.qty); if (m.to) x[m.to] += num(m.qty); }
    }
    return s;
  },
  async saveMove(m) {
    if (!this.writable()) throw new Error('No tienes permiso para guardar cambios en esta vista.');
    await this.db.collection('inventoryMoves').doc().set({ ...m, createdAt: new Date().toISOString(), createdBy: await this.who() });
  },
  async deleteMove(id) { await this.db.doc('inventoryMoves/' + id).delete(); },
});
Store.connectHooks.push(db => db.collection('inventoryMoves').onSnapshot(snap => { Store.moves = snap.docs.map(d => ({ id: d.id, source: 'app', ...d.data() })); Store.invalidate(); }, () => {}));

function productSummary(from, to) {
  const inR = d => { const x = Dates.fromISO(d); return x != null && (from == null || x >= from) && (to == null || x <= to); };
  const moves = Store.moves.filter(m => inR(m.date));
  const salon = r2(moves.filter(m => m.type === 'Venta en salón').reduce((t, m) => t + m.qty * m.unitPrice, 0));
  const inv = r2(moves.filter(m => m.type === 'Compra').reduce((t, m) => t + m.qty * m.unitCost, 0));
  const notes = Store.appNotes.filter(n => NOTE_DEDUCTS.has(n.status) && inR(n.date || n.month + '-01'));
  const lash = r2(notes.reduce((t, n) => t + num(n.taxable), 0)), tax = r2(notes.reduce((t, n) => t + num(n.tax), 0));
  const due = r2(notes.filter(n => n.status === 'Enviada').reduce((t, n) => t + num(n.total), 0));
  return { salon, lash, venta: r2(salon + lash), inv, fondo: r2(salon + lash - inv), tax, due };
}

/* =========================================================
   GASTOS — subir una hoja de Excel (o CSV) para registrar muchos gastos a la vez.
   Nothing is saved until the preview is reviewed; invalid rows are never inserted.
   ========================================================= */
const EXP_HEADERS = {
  date: ['fecha', 'date', 'dia', 'día'],
  description: ['detalle', 'descripcion', 'descripción', 'concepto', 'description', 'nombre'],
  amount: ['valor', 'monto', 'importe', 'cantidad', 'amount', 'total', 'precio'],
  category: ['categoria', 'categoría', 'category', 'tipo'],
  comments: ['comentarios', 'comentario', 'notas', 'nota', 'comments', 'observaciones'],
};
const normH = s => String(s == null ? '' : s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z ]/g, '').trim();

const ExpenseImport = {
  parseDate(v) {
    if (v instanceof Date && !isNaN(v)) return Math.floor(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()) / 864e5);
    if (typeof v === 'number' && v > 20000 && v < 80000) return Math.round(v) - 25569; // Excel serial date
    const s = String(v == null ? '' : v).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return Dates.fromISO(`${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`);
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); // MM/DD/YYYY, como la hoja principal
    if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; if (+m[1] > 12) return null; return Dates.fromISO(`${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`); }
    return null;
  },
  parseAmount(v) { if (typeof v === 'number') return v; const s = String(v == null ? '' : v).replace(/[$,\s]/g, ''); return s === '' ? null : (isFinite(+s) ? +s : NaN); },
  read(file) {
    return new Promise((res, rej) => {
      if (!window.XLSX) return rej(new Error('El lector de Excel no cargó. Intenta de nuevo en un momento.'));
      const fr = new FileReader();
      fr.onload = () => { try { res(XLSX.read(new Uint8Array(fr.result), { type: 'array', cellDates: true })); } catch (e) { rej(new Error('No se pudo leer el archivo. ¿Es un Excel o CSV válido?')); } };
      fr.onerror = () => rej(new Error('No se pudo leer el archivo.'));
      fr.readAsArrayBuffer(file);
    });
  },
  analyze(wb, createCats) {
    const name = wb.SheetNames.find(n => normH(n) === 'gastos') || wb.SheetNames[0];
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null });
    let hr = -1, map = {};
    for (let i = 0; i < Math.min(15, aoa.length) && hr < 0; i++) {
      const m = {}; (aoa[i] || []).forEach((h, j) => { const n = normH(h); for (const [k, list] of Object.entries(EXP_HEADERS)) if (m[k] == null && list.includes(n)) m[k] = j; });
      if (m.date != null && m.amount != null) { hr = i; map = m; }
    }
    if (hr < 0) return { error: `No encontré las columnas Fecha y Monto (o VALOR) en la hoja "${name}". Descarga la plantilla para ver el formato.` };
    const cats = new Map(Store.config.categories.map(c => [c.toLowerCase(), c]));
    const existing = new Set(Store.expenses.map(e => `${e.day}|${r2(e.amount)}|${String(e.description).trim().toLowerCase()}`));
    const seen = new Set(), rows = [], newCats = new Set();
    aoa.slice(hr + 1).forEach((r, k) => {
      const get = key => map[key] == null ? null : r[map[key]];
      if (!r || r.every(v => v == null || String(v).trim() === '')) return;
      const rowNo = hr + 2 + k, out = { rowNo, raw: r, errors: [] };
      out.day = ExpenseImport.parseDate(get('date'));
      out.amount = ExpenseImport.parseAmount(get('amount'));
      out.description = String(get('description') == null ? '' : get('description')).trim();
      out.comments = String(get('comments') == null ? '' : get('comments')).trim();
      const rc = String(get('category') == null ? '' : get('category')).trim();
      if (out.day == null) out.errors.push('Fecha no válida');
      if (out.amount == null || isNaN(out.amount)) out.errors.push('Monto vacío o no numérico');
      else if (out.amount < 0) out.errors.push('Monto negativo (si es ingreso, como renta de cabina, va en Configuración → Rentas)');
      else if (out.amount === 0) out.errors.push('Monto en $0');
      if (!out.description) out.errors.push('Falta el detalle');
      if (!rc) out.category = cats.get('sin categoría') || 'Sin categoría';
      else if (cats.has(rc.toLowerCase())) out.category = cats.get(rc.toLowerCase());
      else if (createCats) { out.category = rc; newCats.add(rc); }
      else out.errors.push(`Categoría "${rc}" no existe`);
      if (!out.errors.length) {
        const key = `${out.day}|${r2(out.amount)}|${out.description.toLowerCase()}`;
        if (existing.has(key)) out.dup = 'Ya existe en Gastos'; else if (seen.has(key)) out.dup = 'Repetido en el archivo';
        seen.add(key);
      }
      out.status = out.errors.length ? 'error' : out.dup ? 'dup' : 'ok';
      rows.push(out);
    });
    return { sheet: name, rows, newCats: [...newCats], map };
  },
  template() {
    if (!window.XLSX) { UI.toast('El módulo de Excel no cargó.', true); return; }
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([['Fecha', 'Detalle', 'Monto', 'Categoría', 'Comentarios']]);
    ws['!cols'] = [{ wch: 12 }, { wch: 34 }, { wch: 12 }, { wch: 18 }, { wch: 30 }];
    XLSX.utils.book_append_sheet(wb, ws, 'Gastos');
    const help = [['Cómo llenar la hoja Gastos'], [], ['Columna', 'Qué escribir'], ['Fecha', 'Fecha del gasto. En formato fecha de Excel, o MM/DD/AAAA.'], ['Detalle', 'Qué se pagó.'], ['Monto', 'Número mayor a 0, sin signo negativo.'], ['Categoría', 'Una de la lista de abajo. Si la dejas vacía queda como "Sin categoría".'], ['Comentarios', 'Opcional.'], [], ['Ejemplo (no lo copies a la hoja Gastos)'], ['Fecha', 'Detalle', 'Monto', 'Categoría', 'Comentarios'], ['10/01/2026', 'compras de amazon', 45.9, 'Amazon', 'pinzas y cinta'], [], ['Categorías disponibles']].concat(Store.config.categories.map(c => [c]));
    const h = XLSX.utils.aoa_to_sheet(help); h['!cols'] = [{ wch: 26 }, { wch: 60 }, { wch: 10 }, { wch: 14 }, { wch: 20 }];
    XLSX.utils.book_append_sheet(wb, h, 'Instrucciones');
    Exporter.save('Plantilla_gastos.xlsx', new Blob([XLSX.write(wb, { type: 'array', bookType: 'xlsx' })]));
  },
  open() {
    let wb = null, fileName = '', res = null;
    UI.modal(`<h3>Subir gastos desde Excel</h3>
      <p style="color:var(--muted);margin:0 0 14px">Usa una hoja con las columnas Fecha, Detalle, Monto, Categoría y Comentarios. También acepta el formato de la hoja GASTOS del Excel original (VALOR, CATEGORIA).</p>
      <div class="chips" style="margin-bottom:12px"><label class="btn primary" style="cursor:pointer">${ic('dl')}Elegir archivo<input type="file" accept=".xlsx,.xls,.csv" data-file hidden></label><button class="btn" data-tpl>Descargar plantilla</button></div>
      <label class="check" style="margin-bottom:10px"><input type="checkbox" data-newcats> Crear categorías nuevas si no existen</label>
      <div data-preview></div>
      <div class="acts"><button class="btn" data-x="no">Cancelar</button><button class="btn primary" data-x="ok" disabled>Importar</button></div>`, m => {
      m.classList.add('wide');
      const prev = $('[data-preview]', m), ok = $('[data-x=ok]', m);
      const show = () => {
        if (!wb) return;
        res = ExpenseImport.analyze(wb, $('[data-newcats]', m).checked);
        if (res.error) { prev.innerHTML = `<div class="banner">${esc(res.error)}</div>`; ok.disabled = true; return; }
        const c = k => res.rows.filter(r => r.status === k).length, valid = c('ok'), total = res.rows.length;
        prev.innerHTML = `<div class="kpis imp"><div class="kpi"><div class="lab">Filas</div><div class="val">${intf(total)}</div></div><div class="kpi lead"><div class="lab">Válidas</div><div class="val">${intf(valid)}</div></div><div class="kpi"><div class="lab">Con error</div><div class="val ${c('error') ? 'neg' : ''}">${intf(c('error'))}</div></div><div class="kpi"><div class="lab">Duplicadas</div><div class="val">${intf(c('dup'))}</div></div></div>
          <p class="formula" style="margin-top:-20px">Archivo: ${esc(fileName)} · hoja "${esc(res.sheet)}" · total válido ${money(r2(res.rows.filter(r => r.status === 'ok').reduce((t, r) => t + r.amount, 0)), 1)}${res.newCats.length ? ` · categorías nuevas: ${esc(res.newCats.join(', '))}` : ''}. Las duplicadas y las que tienen error no se importan.</p>
          ${table([{ label: 'Fila', r: 1 }, { label: 'Fecha' }, { label: 'Detalle' }, { label: 'Monto', r: 1 }, { label: 'Categoría' }, { label: 'Estado', html: 1 }],
            res.rows.slice(0, 150).map(r => [r.rowNo, r.day != null ? Dates.fmt(r.day) : '—', r.description || '—', r.amount == null || isNaN(r.amount) ? '—' : money(r.amount, 1), r.category || '—',

/* =========================================================
   CLAVES Y BITÁCORA — editing or deleting an expense asks for a personal clave,
   and every change is written to auditLogs with who, when, before and after.
   Claves are stored as salted SHA-256 hashes. This identifies people; it is not
   bank-grade security (anyone with edit access to this page can reach the data).
   ========================================================= */
const Claves = {
  async hash(salt, clave) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + clave));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  },
  salt() { const a = new Uint8Array(12); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, '0')).join(''); },
  active() { return (Store.editors || []).filter(e => e.active !== false); },
  async find(clave) { for (const e of Claves.active()) if (e.hash === await Claves.hash(e.salt, clave)) return e; return null; },
  /* Second-layer prompt so the form underneath stays open. Resolves the editor or null. */
  ask(title, opts = {}) {
    return new Promise(res => {
      if (!Claves.active().length) {
        UI.toast('Primero crea las claves de edición en Configuración.', true); return res(null);
      }
      const host = document.createElement('div'); host.className = 'modal-bg layer2';
      host.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:400px"><h3>${esc(title)}</h3>
        <p style="color:var(--muted);margin:0 0 12px">${esc(opts.hint || 'Escribe tu clave. El cambio quedará registrado a tu nombre.')}</p>
        <label class="field">Clave<input type="password" inputmode="numeric" autocomplete="off" data-clave></label><p class="err" data-cerr style="color:var(--bad);font-size:13px;font-weight:600;min-height:18px"></p>
        <div class="acts"><button class="btn" data-x="no">Cancelar</button><button class="btn primary" data-x="ok">Confirmar</button></div></div>`;
      document.body.appendChild(host);
      const inp = $('[data-clave]', host), done = v => { host.remove(); res(v); };
      inp.focus();
      const go = async () => {
        const e = await Claves.find(inp.value.trim());
        if (!e) { $('[data-cerr]', host).textContent = 'Clave incorrecta.'; inp.select(); return; }
        if (opts.admin && e.role !== 'Admin') { $('[data-cerr]', host).textContent = 'Esta acción necesita una clave de administración.'; return; }
        done(e);
      };
      $('[data-x=ok]', host).onclick = go; inp.onkeydown = ev => { if (ev.key === 'Enter') go(); if (ev.key === 'Escape') done(null); };
      $('[data-x=no]', host).onclick = () => done(null);
    });
  },
  async saveList(list) { await Store.db.doc('security/editors').set({ list, updatedAt: new Date().toISOString() }); },
};

const Audit = {
  diff(before, after, fields) {
    return fields.filter(([k]) => String(before ? before[k] ?? '' : '') !== String(after ? after[k] ?? '' : '')).map(([k, l]) => ({ field: l, from: before ? before[k] ?? '' : '', to: after ? after[k] ?? '' : '' }));
  },
  async log(entry) {
    if (Store.dbState !== 'on') return;
    await Store.db.collection('auditLogs').doc().set({ ...entry, byUserId: await Store.who(), at: new Date().toISOString() });
  },
  forEntity(id) { return (Store.auditLogs || []).filter(a => a.entityId === id).sort((a, b) => b.at.localeCompare(a.at)); },
  line(a) {
    const when = new Date(a.at).toLocaleString('es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    const what = a.action === 'UPDATE' ? (a.changes || []).map(c => `${c.field}: ${c.from === '' ? '—' : c.from} → ${c.to === '' ? '—' : c.to}`).join(' · ') || 'Sin cambios de valor'
      : a.action === 'DELETE' ? (a.entity === 'SALE' ? 'Eliminó el cobro' : 'Eliminó el gasto') : a.action === 'CREATE' ? (a.entity === 'SALE' ? 'Registró el cobro' : 'Creó el gasto') : (a.detail || a.action);
    return { when, who: a.byName || 'Sin nombre', what };
  },
};
const EXP_FIELDS = [['date', 'Fecha'], ['description', 'Detalle'], ['amount', 'Monto'], ['category', 'Categoría'], ['comments', 'Comentarios']];

Store.editors = []; Store.auditLogs = [];
Store.connectHooks.push(db => {

  db.collection('auditLogs').onSnapshot(s => { Store.auditLogs = s.docs.map(d => ({ id: d.id, ...d.data() })); Store.invalidate(); }, () => {});
});

  editorModal(e ? 'Editar gasto' : 'Nuevo gasto', [
    { name: 'date', label: 'Fecha', type: 'date', validate: v => Dates.fromISO(v) != null ? '' : 'Escribe una fecha.' },

const RECEP_ROUTES = ['recepcion', 'nueva', 'dia', 'depositos', 'insumos'];

const Mode = {

  set(on) { Mode._rec = on; try { on ? localStorage.setItem('fm-mode', 'recepcion') : localStorage.removeItem('fm-mode'); } catch (e) {} },
