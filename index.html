/* ---------- store ---------- */
Object.assign(Store, {
  deposits: [], requests: [], dayNotes: [],
  async saveDeposit(data, id) {
    if (!this.writable()) throw new Error('No tienes permiso para guardar en esta vista.');
    const now = new Date().toISOString(), prev = id ? this.deposits.find(d => d.id === id) : null;
    const doc = { ...(prev ? prev._raw : {}), ...data, updatedAt: now, updatedByName: Mode.who() };
    if (!prev) Object.assign(doc, { createdAt: now, createdByName: Mode.who(), outcome: '', history: [] });
    doc.history = (doc.history || []).concat(data._event ? [{ at: now, by: Mode.who(), what: data._event }] : []);
    delete doc._event;
    const ref = id ? this.db.doc('deposits/' + id) : this.db.collection('deposits').doc();
    await ref.set(doc); Store.upsertLocal('deposits', ref.id, doc, d => ({ ...d, day: Dates.fromISO(d.date) })); return ref.id;
  },
  upsertLocal(key, id, doc, extra) {
    const row = { id, ...doc, _raw: doc }, arr = this[key].filter(x => x.id !== id);
    arr.push(extra ? extra(row) : row); this[key] = arr; this.invalidate();
  },
  async saveRequest(data, id) {
    if (!this.writable()) throw new Error('No tienes permiso para guardar en esta vista.');
    const now = new Date().toISOString(), prev = id ? this.requests.find(r => r.id === id) : null;
    const doc = { ...(prev ? prev._raw : {}), ...data, updatedAt: now };
    if (!prev) Object.assign(doc, { createdAt: now, createdByName: Mode.who(), status: data.status || 'Pendiente' });
    const ref = id ? this.db.doc('supplyRequests/' + id) : this.db.collection('supplyRequests').doc();
    await ref.set(doc); Store.upsertLocal('requests', ref.id, doc); return ref.id;
  },
  requestMoves() {
    return this.requests.filter(r => r.deliveredAt).flatMap(r => r.items.filter(i => i.state === 'Entregado' && i.code).map(i => ({
      id: 'req-' + r.id + '-' + i.code, source: 'request', date: r.deliveredAt.slice(0, 10), type: 'Entrega a lashista', code: i.code, name: i.name, from: 'salon', to: null,
      qty: num(i.qty), notes: `${r.artistName} · entregó ${r.deliveredByName || ''}` })));
  },
});
const _allMoves = Store.allMoves.bind(Store);
Store.allMoves = function () { return _allMoves().concat(this.requestMoves()).sort((a, b) => (b.date || '').localeCompare(a.date || '')); };
Store.connectHooks.push(db => {
  const wrap = d => ({ id: d.id, ...d.data(), _raw: d.data() });
  db.collection('deposits').onSnapshot(s => { Store.deposits = s.docs.map(wrap).map(d => ({ ...d, day: Dates.fromISO(d.date) })); Store.invalidate(); }, () => {});
  db.collection('supplyRequests').onSnapshot(s => { Store.requests = s.docs.map(wrap); Store.invalidate(); }, () => {});
  db.collection('dayNotes').onSnapshot(s => { Store.dayNotes = s.docs.map(wrap); Store.invalidate(); }, () => {});
});

/* Sales: link / release the client's deposit. */
const _saveSale = Store.saveSale.bind(Store), _deleteSale = Store.deleteSale.bind(Store);
const releaseDeposit = (id, why) => { const d = Store.deposits.find(x => x.id === id); return d ? Store.saveDeposit({ outcome: '', saleId: '', _event: why }, id) : null; };
Store.saveSale = async function (form, id) {
  const prev = id ? this.appSales.find(s => s.id === id) : null, dep = form.depositId ? this.deposits.find(d => d.id === form.depositId) : null;
  const saleId = await _saveSale({ ...form, depositAmount: dep ? dep.amount : 0, depositMethod: dep ? dep.method : '', cashierName: Mode.who() }, id);
  if (prev && prev.depositId && prev.depositId !== form.depositId) await releaseDeposit(prev.depositId, 'Se quitó de la venta');
  if (dep && dep.saleId !== saleId) await this.saveDeposit({ outcome: 'Aplicado', saleId, appliedAt: new Date().toISOString(), _event: `Aplicado a la venta de ${form.first || 'la clienta'}` }, dep.id);
  return saleId;
};
Store.deleteSale = async function (id) {
  const s = this.appSales.find(x => x.id === id);
  await _deleteSale(id);
  if (s && s.depositId) await releaseDeposit(s.depositId, 'Se eliminó la venta; el depósito vuelve a estar disponible');
};

Store.savePackage = async function (data, id) {
  if (!this.writable()) throw new Error('No tienes permiso para guardar en esta vista.');
  const now = new Date().toISOString(), prev = id ? this.packages.find(p => p.id === id) : null;
  const doc = { ...(prev ? prev._raw : {}), ...data, updatedAt: now, updatedByName: Mode.who() };
  if (!prev) Object.assign(doc, { createdAt: now, createdByName: Mode.who(), status: 'Activo', uses: [] });
  const ref = id ? this.db.doc('packages/' + id) : this.db.collection('packages').doc();
  await ref.set(doc); Store.upsertLocal('packages', ref.id, doc, x => ({ ...x, day: Dates.fromISO(x.date) })); return ref.id;
};

const Pkg = {
  used: p => (p.uses || []).length,
  left: p => num(p.sessions) - Pkg.used(p),
  // Session n (1-based): even split; the last session takes the rounding remainder so the sum equals what was paid.
  share(total, sessions, n) { const each = r2(num(total) / num(sessions)); return n < num(sessions) ? each : r2(num(total) - each * (num(sessions) - 1)); },
  session(p, n) {
    const paid = Pkg.share(p.total, p.sessions, n), tip = Pkg.share(p.tipTotal || 0, p.sessions, n), reg = num(p.regularPrice);
    return { paid, tip, price: Math.max(reg, paid), discount: r2(Math.max(0, reg - paid)) };
  },
  balance: p => p.status === 'Activo' ? r2(Array.from({ length: Pkg.left(p) }, (_, i) => Pkg.share(p.total, p.sessions, Pkg.used(p) + i + 1)).reduce((t, x) => t + x, 0)) : 0,
  client: p => title(((p.first || '') + ' ' + (p.last || '')).trim()),
  active: () => Store.packages.filter(p => p.status === 'Activo' && Pkg.left(p) > 0),
};

function applyPackage(form, p) {
  const n = Pkg.used(p) + 1, s = Pkg.session(p, n);
  Object.assign(form, { packageId: p.id, packageSession: n, serviceId: p.serviceId, price: s.price, discount: s.discount || '', tip: s.tip || '', method: PKG_METHOD, first: form.first || p.first || '', last: form.last || p.last || '', depositId: '' });
}

  let f = form;
  if (p && p.commissionBase === 'normal') {
    const a = this.config.artists.find(x => x.id === form.artistId), rate = prev && prev.artistKey === form.artistId ? prev.rate : (a ? a.rate : 0);
    f = { ...form, manualOn: true, manualCommission: r2(rate * num(p.regularPrice)), comments: [form.comments, `Paquete: comisión sobre precio normal ${money(p.regularPrice, 1)}`].filter(Boolean).join(' · ') };
  }
  const saleId = await _saveSale4.call(this, f, id);
  if (p && !(p.uses || []).some(u => u.saleId === saleId)) {
    const a = this.config.artists.find(x => x.id === form.artistId), uses = (p.uses || []).concat({ saleId, date: form.date, artistName: a ? a.name : '', n: form.packageSession, byName: Mode.who() });
    await this.savePackage({ uses, status: uses.length >= num(p.sessions) ? 'Completado' : 'Activo' }, p.id);

};

/* =========================================================
   VENTAS — subir ventas desde Excel (formato de la HOJA PRINCIPAL o una hoja simple).
   Se elige un rango de fechas; nada se guarda sin revisar la vista previa.
   ========================================================= */
const SALE_HEADERS = {
  date: ['fecha', 'fecha mmddyyyy', 'date'],
  artist: ['column', 'lashista', 'asociada', 'name', 'nombre lashista', 'artista'],
  service: ['servicio', 'service'],
  commission: ['comision', 'comision lashista', 'commission'],
  price: ['precio', 'price', 'costo'],
  tip: ['tip', 'tips', 'propina'],
  discount: ['descuento', 'discount'],
  first: ['clientenombre', 'cliente nombre', 'nombre cliente', 'nombre', 'cliente'],
  last: ['clienteapellido', 'cliente apellido', 'apellido cliente', 'apellido'],
  comments: ['comentarios', 'comentario', 'notas', 'comments'],
  method: ['metodo de pago', 'metodo', 'pago', 'payment method'],
};
const normS = s => String(s == null ? '' : s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();

const SaleImport = {
  findSheet(wb) {
    const named = wb.SheetNames.filter(n => /hoja principal/i.test(n)).sort().reverse();
    return named[0] || wb.SheetNames[0];
  },
  analyze(wb, sheet, from, to) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { header: 1, raw: true, defval: null });
    let hr = -1, map = {};
    for (let i = 0; i < Math.min(15, aoa.length) && hr < 0; i++) {
      const m = {};
      (aoa[i] || []).forEach((h, j) => { const n = normS(h); for (const [k, list] of Object.entries(SALE_HEADERS)) if (m[k] == null && list.some(x => n === x || (k === 'date' && n.startsWith('fecha')) || (k === 'artist' && /^column \d+$/.test(n) && j === 1))) m[k] = j; });
      if (m.date != null && m.service != null && m.price != null) { hr = i; map = m; }
    }
    if (hr < 0) return { error: `No encontré las columnas Fecha, Servicio y Precio en la hoja "${sheet}".` };
    if (map.artist == null) map.artist = 1;
    const artists = Store.config.artists, services = Store.config.services;
    const findA = n => { const k = String(n || '').trim().toLowerCase(); return k && artists.find(a => a.name.toLowerCase() === k || (a.code && a.code.toLowerCase() === k)); };
    const findS = n => { const k = String(n || '').trim().toLowerCase(); return k && services.find(s => s.name.trim().toLowerCase() === k); };
    const key = (day, aid, svc, price, tip, f, l) => [day, aid, String(svc).trim().toLowerCase(), r2(price), r2(tip), String(f || '').trim().toLowerCase(), String(l || '').trim().toLowerCase()].join('|');
    const existing = new Set(Store.sales.map(s => key(s.day, s.artistKey, s.service, s.price, s.tip, s.first, s.last)));
    const seen = new Set(), rows = []; let outside = 0;
    aoa.slice(hr + 1).forEach((r, k) => {
      const g = c => map[c] == null ? null : r[map[c]];
      if (!r || [g('date'), g('artist'), g('service'), g('price')].every(v => v == null || String(v).trim() === '')) return;
      const day = ExpenseImport.parseDate(g('date'));
      if (day != null && (day < from || day > to)) { outside++; return; }
      const o = { rowNo: hr + 2 + k, day, errors: [], warn: [] };
      const a = findA(g('artist')), s = findS(g('service'));
      o.artistName = String(g('artist') || '').trim(); o.serviceName = String(g('service') || '').trim();
      o.price = ExpenseImport.parseAmount(g('price')); o.discount = ExpenseImport.parseAmount(g('discount')) || 0; o.tip = ExpenseImport.parseAmount(g('tip')) || 0;
      o.first = String(g('first') == null ? '' : g('first')).trim(); o.last = String(g('last') == null ? '' : g('last')).trim();
      o.comments = String(g('comments') == null ? '' : g('comments')).trim(); o.method = String(g('method') == null ? '' : g('method')).trim();
      const exc = ExpenseImport.parseAmount(g('commission'));
      if (day == null) o.errors.push('Fecha no válida');
      if (!a) o.errors.push(o.artistName ? `Lashista "${o.artistName}" no existe` : 'Falta la lashista');
      if (!s) o.errors.push(o.serviceName ? `Servicio "${o.serviceName}" no existe` : 'Falta el servicio');
      if (o.price == null || isNaN(o.price) || o.price < 0) o.errors.push('Precio vacío o no válido');
      if (isNaN(o.discount) || o.discount < 0 || o.discount > (o.price || 0)) o.errors.push('Descuento no válido');
      if (isNaN(o.tip) || o.tip < 0) o.errors.push('Tip no válido');
      if (a) { o.artistId = a.id; o.artistName = a.name; o.calc = r2(a.rate * ((o.price || 0) - (o.discount || 0))); }
      if (s) { o.serviceId = s.id; o.serviceName = s.name; }
      if (a && exc != null && !isNaN(exc) && Math.abs(r2(exc) - o.calc) > 0.005) { o.manual = r2(exc); o.warn.push(`Comisión del Excel ${money(exc, 1)} (la fórmula da ${money(o.calc, 1)})`); }
      if (!o.errors.length) {
        const kk = key(day, o.artistId, o.serviceName, o.price, o.tip, o.first, o.last);
        if (existing.has(kk)) o.dup = 'Ya existe'; else if (seen.has(kk)) o.warn.push('Repetida en el archivo; revisa que sea real');
        seen.add(kk);
      }
      o.status = o.errors.length ? 'error' : o.dup ? 'dup' : 'ok';
      rows.push(o);
    });
    return { sheet, rows, outside };
  },
  open() {
    let wb = null, fileName = '', res = null;
    const t = Dates.today(), ws = Dates.fluffyWeekStart(t);
    const st = { from: ws - 7, to: ws - 1 }; // por defecto, la semana Fluffy anterior (viernes a jueves)
    UI.modal(`<h3>Subir ventas desde Excel</h3>
      <p style="color:var(--muted);margin:0 0 14px">Acepta tu archivo FLUFFY MASTER (hoja HOJA PRINCIPAL) o una hoja con Fecha, Lashista, Servicio, Precio, Descuento, Tip, Cliente nombre, Cliente apellido y Comentarios. Solo se suben las ventas dentro de las fechas que elijas.</p>
      <div class="chips" style="margin-bottom:12px;align-items:flex-end">
        <label class="btn primary" style="cursor:pointer">${ic('dl')}Elegir archivo<input type="file" accept=".xlsx,.xls,.csv" data-sfile hidden></label>
        <label class="field">Desde<input type="date" data-sfrom value="${Dates.toISO(st.from)}"></label><label class="field">Hasta<input type="date" data-sto value="${Dates.toISO(st.to)}"></label>
        <label class="field" data-ssheetwrap style="display:none">Hoja<select data-ssheet></select></label></div>
      <div data-spreview></div>
      <div class="acts"><button class="btn" data-x="no">Cancelar</button><button class="btn primary" data-x="ok" disabled>Importar</button></div>`, m => {
      m.classList.add('wide');
      const prev = $('[data-spreview]', m), ok = $('[data-x=ok]', m), sel = $('[data-ssheet]', m);
      const show = () => {
        if (!wb) return;
        const from = Dates.fromISO($('[data-sfrom]', m).value), to = Dates.fromISO($('[data-sto]', m).value);
        if (from == null || to == null || from > to) { prev.innerHTML = '<div class="banner">Revisa las fechas.</div>'; ok.disabled = true; return; }
        res = SaleImport.analyze(wb, sel.value, from, to);
        if (res.error) { prev.innerHTML = `<div class="banner">${esc(res.error)}</div>`; ok.disabled = true; return; }
        const c = k => res.rows.filter(r => r.status === k).length, good = res.rows.filter(r => r.status === 'ok');
        prev.innerHTML = `<div class="kpis imp"><div class="kpi"><div class="lab">Filas en el rango</div><div class="val">${intf(res.rows.length)}</div></div><div class="kpi lead"><div class="lab">Listas</div><div class="val">${intf(good.length)}</div></div><div class="kpi"><div class="lab">Con error</div><div class="val ${c('error') ? 'neg' : ''}">${intf(c('error'))}</div></div><div class="kpi"><div class="lab">Ya existen</div><div class="val">${intf(c('dup'))}</div></div></div>
          <p class="formula" style="margin-top:-20px">${esc(fileName)} · hoja "${esc(res.sheet)}" · ventas listas ${money(r2(good.reduce((t, r) => t + r.price, 0)), 1)} + tips ${money(r2(good.reduce((t, r) => t + r.tip, 0)), 1)} · ${intf(res.outside)} filas fuera de las fechas no se tocan.</p>
          ${table([{ label: 'Fila', r: 1 }, { label: 'Fecha' }, { label: 'Lashista' }, { label: 'Servicio' }, { label: 'Clienta' }, { label: 'Precio', r: 1 }, { label: 'Tip', r: 1 }, { label: 'Estado', html: 1 }],
            res.rows.slice(0, 200).map(r => [r.rowNo, r.day != null ? Dates.fmt(r.day, { day: '2-digit', month: 'short' }) : '—', r.artistName || '—', r.serviceName || '—', title((r.first + ' ' + r.last).trim()) || '—', r.price == null || isNaN(r.price) ? '—' : money(r.price, 1), money(r.tip || 0, 1),
              r.status === 'error' ? `<span class="tag" style="color:var(--bad);border-color:var(--bad);white-space:normal">${esc(r.errors.join(' · '))}</span>` : r.status === 'dup' ? '<span class="tag warn">Ya existe</span>' : `<span class="tag app">Lista</span>${r.warn.length ? ` <span class="tag warn" style="white-space:normal">${esc(r.warn.join(' · '))}</span>` : ''}`]), null,
            { emptyTitle: 'No hay ventas en esas fechas', empty: 'Cambia el rango o revisa el archivo.' })}
          ${res.rows.length > 200 ? `<p class="formula">Mostrando 200 de ${intf(res.rows.length)}.</p>` : ''}
          ${c('error') ? '<button class="btn sm" data-serrs style="margin-top:10px">Descargar filas con error (CSV)</button>' : ''}`;
        ok.disabled = !good.length || !Store.writable(); ok.textContent = good.length ? `Importar ${intf(good.length)} ventas` : 'Importar';
        const eb = $('[data-serrs]', prev); if (eb) eb.onclick = () => Exporter.run('csv', 'Ventas_con_error', [['Fila', 'Fecha', 'Lashista', 'Servicio', 'Precio', 'Motivo']].concat(res.rows.filter(r => r.status === 'error').map(r => [r.rowNo, r.day != null ? Dates.toISO(r.day) : '', r.artistName, r.serviceName, r.price, r.errors.join(' · ')])));
      };
      $('[data-sfile]', m).onchange = async e => {
        const f = e.target.files[0]; if (!f) return; fileName = f.name; prev.innerHTML = '<div class="loading">Leyendo archivo…</div>';
        try { wb = await ExpenseImport.read(f); sel.innerHTML = wb.SheetNames.map(n => `<option ${n === SaleImport.findSheet(wb) ? 'selected' : ''}>${esc(n)}</option>`).join(''); $('[data-ssheetwrap]', m).style.display = ''; show(); }
        catch (er) { prev.innerHTML = `<div class="banner">${esc(er.message)}</div>`; }
      };
      $('[data-sfrom]', m).onchange = show; $('[data-sto]', m).onchange = show; sel.onchange = show;
      $('[data-x=no]', m).onclick = UI.close;
      ok.onclick = async () => {
        const good = res.rows.filter(r => r.status === 'ok'); ok.disabled = true; let done = 0;
        try {
          for (const r of good) {
            await Store.saveSale({ date: Dates.toISO(r.day), artistId: r.artistId, serviceId: r.serviceId, price: r.price, discount: r.discount, tip: r.tip, method: r.method, first: r.first, last: r.last,
              comments: r.comments, manualOn: r.manual != null, manualCommission: r.manual != null ? r.manual : '' }, null);
            done++; if (done % 10 === 0) ok.textContent = `Importando ${done}/${good.length}…`;
          }
          if (typeof Audit !== 'undefined') await Audit.log({ entity: 'SALE', entityId: 'import-' + Date.now(), entityLabel: fileName, action: 'IMPORT', detail: `Subió ${done} ventas desde Excel (${Dates.fmt(Dates.fromISO($('[data-sfrom]', m).value))} – ${Dates.fmt(Dates.fromISO($('[data-sto]', m).value))})`, byName: Mode.who() });
          UI.close(); UI.toast(`${intf(done)} ventas importadas`);
        } catch (e) { ok.disabled = false; ok.textContent = 'Reintentar'; UI.toast(`Se detuvo en ${done} de ${good.length}: ${e.message || e.code}. Si reintentas, las ya guardadas saldrán como "Ya existe".`, true); }
      };
    });
  },
};

const _vHtml = Views.ventas.html, _vMount = Views.ventas.mount;
Views.ventas.html = function () {
  return _vHtml.call(this).replace('<div class="chips"><button class="btn primary" data-go="nueva">', `<div class="chips"><button class="btn" data-simport ${Store.writable() && !Mode.reception ? '' : 'disabled'}>${ic('dl')}Subir Excel</button><button class="btn primary" data-go="nueva">`);
};
Views.ventas.mount = function (root) { _vMount.call(this, root); const b = $('[data-simport]', root); if (b) b.onclick = () => SaleImport.open(); };

/* Gastos: también por rango de fechas, para subir solo lo nuevo de tu hoja GASTOS. */
ExpenseImport._analyze = ExpenseImport.analyze;
ExpenseImport.analyze = function (wb, createCats) {
  const r = ExpenseImport._analyze(wb, createCats), m = $('.modal');
  const f = m && $('[data-efrom]', m) ? Dates.fromISO($('[data-efrom]', m).value) : null, t = m && $('[data-eto]', m) ? Dates.fromISO($('[data-eto]', m).value) : null;
  if (r.error || f == null || t == null) return r;
  const keep = r.rows.filter(x => x.day == null || (x.day >= f && x.day <= t));
  r.outside = r.rows.length - keep.length; r.rows = keep;
  return r;
};
ExpenseImport._open = ExpenseImport.open;
ExpenseImport.open = function () {
  ExpenseImport._open();
  const m = $('.modal'); if (!m) return;
  const t = Dates.today();
  $('[data-newcats]', m).closest('label').insertAdjacentHTML('beforebegin', `<div class="chips" style="margin-bottom:10px"><label class="field">Desde<input type="date" data-efrom value="${Dates.toISO(Dates.monthStart(Dates.parts(t).y, Dates.parts(t).m))}"></label><label class="field">Hasta<input type="date" data-eto value="${Dates.toISO(t)}"></label></div>`);
  ['[data-efrom]', '[data-eto]'].forEach(s => $(s, m).addEventListener('change', () => $('[data-newcats]', m).dispatchEvent(new Event('change'))));
};

/* =========================================================
   VARIOS SERVICIOS EN UN MISMO COBRO — cuando a la clienta se le hizo algo extra
   (o un servicio distinto al agendado). Cada servicio se guarda como su propia venta,
   igual que en la HOJA PRINCIPAL (una fila por servicio), con su lashista y su comisión.
   ========================================================= */
const _nvHtmlX = Views.nueva.html, _nvMountX = Views.nueva.mount, _nvReceiptX = Views.nueva.receipt;
const extraLine = (x, k) => `<div class="xline" data-xl="${k}">
  <select class="inp" data-x2="serviceId" aria-label="Servicio adicional">${serviceOptions(x.serviceId, 0, 0)}</select>
  <select class="inp" data-x2="artistId" aria-label="Lashista">${artistOptions(x.artistId, 0, 0)}</select>
  <input class="inp num" type="number" min="0" step="0.01" data-x2="price" value="${esc(x.price)}" placeholder="Precio" aria-label="Precio">
  <input class="inp num" type="number" min="0" step="0.01" data-x2="discount" value="${esc(x.discount)}" placeholder="Desc." aria-label="Descuento">
  <button type="button" class="btn sm" data-x2="rm" aria-label="Quitar servicio">×</button></div>`;
Views.nueva.html = function () {
  const h = _nvHtmlX.call(this);
  if (UI.params.edit) return h;
  const f = this.form; f.extras = f.extras || [];
  const block = `<div class="full xbox"><div class="xhead"><b>Otros servicios en este cobro</b><span class="mutedc">Si se agregó un servicio, o una lashista hizo una parte.</span></div>
    <div data-xlines>${f.extras.map(extraLine).join('')}</div><button type="button" class="btn sm" data-xadd>${ic('plus')}Agregar otro servicio</button></div>`;
  return h.replace('<label class="field full">Comentarios', block + '<label class="field full">Comentarios');
};
Views.nueva.receipt = function () {
  let h = _nvReceiptX.call(this);
  const f = this.form, xs = (f.extras || []).filter(x => x.serviceId);
  if (!xs.length) return h;
  const svc = id => Store.config.services.find(s => s.id === id) || {}, art = id => Store.config.artists.find(a => a.id === id) || {};
  const net = x => r2(num(x.price) - num(x.discount)), extra = r2(xs.reduce((t, x) => t + net(x), 0));
  const main = r2(num(f.price) - num(f.discount) + num(f.tip));
  const lines = xs.map(x => `<div class="rline"><span>+ ${esc(svc(x.serviceId).name || '')}${x.artistId && x.artistId !== f.artistId ? ' · ' + esc(art(x.artistId).name || '') : ''}</span><span>${money(net(x), 1)}</span></div>`).join('');
  h = h.replace(/<div class="rline total big"><span>Total cobrado<\/span><span>[^<]*<\/span><\/div>/, lines + `<div class="rline total big"><span>Total cobrado</span><span>${money(r2(main + extra), 1)}</span></div>`);
  h = h.replace(/(<span>Por cobrar hoy<\/span><span>)([^<]*)/, (m0, a, v) => a + money(r2(num(String(v).replace(/[$,]/g, '')) + extra), 1));
  if (!Mode.reception) { const com = r2(xs.reduce((t, x) => t + num(art(x.artistId).rate) * net(x), 0)); h = h.replace('<p class="formula">', `<div class="rline"><span>Comisión de los servicios adicionales</span><span>${money(com, 1)}</span></div><p class="formula">`); }
  return h;
};
Views.nueva.mount = function (root) {
  _nvMountX.call(this, root);
  if (UI.params.edit) return;
  const f = this.form, form = $('[data-form]', root); if (!form) return;
  const repaint = () => { const rec = $('[data-receipt]', root); if (rec) rec.innerHTML = this.receipt(); };
  const draw = () => { $('[data-xlines]', root).innerHTML = f.extras.map(extraLine).join(''); repaint(); };
  $('[data-xadd]', root).onclick = () => { f.extras.push({ serviceId: '', artistId: f.artistId || '', price: '', discount: '' }); UI.formDirty = true; draw(); };
  const lines = $('[data-xlines]', root);
  const onX = e => {
    const l = e.target.closest('[data-xl]'), k = e.target.dataset.x2; if (!l || !k || k === 'rm') return;
    const x = f.extras[+l.dataset.xl]; x[k] = e.target.value; UI.formDirty = true;
    if (k === 'serviceId') { const s = Store.config.services.find(y => y.id === x.serviceId); if (s) { x.price = s.price; $('[data-x2=price]', l).value = s.price; } }
    repaint();
  };
  lines.addEventListener('input', onX); lines.addEventListener('change', onX);
  lines.addEventListener('click', e => { if (e.target.closest('[data-x2=rm]')) { f.extras.splice(+e.target.closest('[data-xl]').dataset.xl, 1); draw(); } });
  // The extras go through the same validation before the main save.
  const orig = form.onsubmit;
  form.onsubmit = async e => {
    e.preventDefault();
    const bad = (f.extras || []).find(x => x.serviceId && (!x.artistId || x.price === '' || num(x.price) < 0 || num(x.discount) < 0 || num(x.discount) > num(x.price)));
    if (bad) { UI.toast('Revisa los servicios adicionales: lashista, precio y descuento.', true); return; }
    f.extras = (f.extras || []).filter(x => x.serviceId);
    return orig(e);
  };
};

const _saveSaleX = Store.saveSale;
Store.saveSale = async function (form, id) {
  const extras = !id && !form._isExtra ? (form.extras || []).filter(x => x.serviceId) : [];
  const saleId = await _saveSaleX.call(this, { ...form, extras: undefined }, id);
  if (extras.length) {
    const ids = [];
    for (const x of extras) {
      ids.push(await _saveSaleX.call(this, { date: form.date, artistId: x.artistId, serviceId: x.serviceId, price: x.price, discount: x.discount || 0, tip: 0, method: form.method === 'Paquete prepagado' ? '' : form.method,
        first: form.first, last: form.last, comments: 'Servicio adicional en el mismo cobro', payGroup: (form.payments || []).length > 1 ? saleId : '', manualOn: false, manualCommission: '', _isExtra: true }, null));
    }
    if (form._appt) { const ap = this.appointments.find(a => a.id === form._appt); if (ap) await this.saveAppointment({ extraSaleIds: (ap.extraSaleIds || []).concat(ids) }, ap.id); }
  }
  if (form._appt && !id) {
    const ap = this.appointments.find(a => a.id === form._appt);
    if (ap && form.artistId && form.artistId !== ap.artistId) { const ar = this.config.artists.find(x => x.id === form.artistId); if (ar) await this.saveAppointment({ scheduledArtistName: ap.scheduledArtistName || ap.artistName, artistId: ar.id, artistName: ar.name }, ap.id); }
    if (ap && form.serviceId && form.serviceId !== ap.serviceId) { const s = this.config.services.find(x => x.id === form.serviceId); if (s) await this.saveAppointment({ scheduledServiceName: ap.scheduledServiceName || ap.serviceName, serviceId: s.id, serviceName: s.name, price: s.price }, ap.id); }
  }
  return saleId;
};

/* =========================================================
   RESUMEN DE VENTAS — día, semana Fluffy, mes o rango: servicios, productos y pagos
   de lashistas, con lo que entró por cada método de pago. Se descarga en PDF o Excel.
   Los pagos de notas de insumos de las lashistas cuentan como dinero del día en que se pagan.
   ========================================================= */
Store.notePayments = [];
Store.connectHooks.push(db => db.collection('notePayments').onSnapshot(s => { Store.notePayments = s.docs.map(d => ({ id: d.id, ...d.data(), day: Dates.fromISO(d.data().date) })); Store._notesCache = null; Store.invalidate(); }, () => {}));
Store.saveNotePayment = async function (data) {
  if (!this.writable()) throw new Error('No tienes permiso para guardar en esta vista.');
  const doc = { ...data, createdAt: new Date().toISOString(), byName: Mode.who() }, ref = this.db.collection('notePayments').doc();
  await ref.set(doc); this.notePayments = this.notePayments.filter(p => p.id !== ref.id).concat({ id: ref.id, ...doc, day: Dates.fromISO(doc.date) }); this._notesCache = null; this.invalidate();
};
const paidOf = n => r2(Store.notePayments.filter(p => p.noteId === n.id).reduce((t, p) => t + num(p.amount), 0));
/* Una nota con pagos que cubren el total queda Pagada, aunque recepción no pueda editar la nota. */
const _notesDesc = Object.getOwnPropertyDescriptor(Store, 'notes');
Object.defineProperty(Store, 'notes', { configurable: true, get() {
  return _notesDesc.get.call(this).map(n => { if (n.source !== 'app') return n; const paid = paidOf(n); return { ...n, paid, pending: r2(Math.max(0, n.total - paid)), status: n.status !== 'Cancelada' && paid >= n.total - 0.005 && paid > 0 ? 'Pagada' : n.status }; });
} });

function notePaymentForm(preNoteId) {
  const open = Store.notes.filter(n => n.source === 'app' && n.status === 'Enviada' && n.pending > 0.005);
  const methods = [...new Set(Store.config.methods.concat(DEPOSIT_METHODS))].filter(m => m !== 'Depósito');
  if (!open.length) { UI.toast('No hay notas de insumos pendientes de pago.'); return; }

      <label class="field">Monto<input type="number" min="0" step="0.01" data-np="amount"></label><label class="field">Fecha<input type="date" data-np="date" value="${Dates.toISO(Dates.today())}"></label>
      <label class="field">Método de pago<select data-np="method">${methods.map(m => `<option>${esc(m)}</option>`).join('')}</select></label><label class="field">TXN:<input data-np="txn" placeholder="Número de transacción" autocomplete="off"></label></div>
    <p class="err" data-nperr style="color:var(--bad);font-size:13px;font-weight:600"></p>
    <div class="acts"><button class="btn" data-x="no">Cancelar</button><button class="btn primary" data-x="ok">Registrar pago</button></div>`, m => {

/* ---------- cálculo del resumen ---------- */
const Summary = {
  build(from, to) {
    const inR = d => d != null && d >= from && d <= to;
    const sales = Store.sales.filter(s => inR(s.day)), t = Logic.totals(sales);
    const prepaid = sales.filter(s => s.method === 'Paquete prepagado');
    const bySvc = Logic.groupBy(sales, s => s.service, s => s.price).map(x => ({ ...x, netas: r2(sales.filter(s => s.service === x.key).reduce((a, s) => a + s.price - s.discount, 0)) })).sort((a, b) => b.count - a.count);
    const byArt = Logic.calculatePayroll(sales, from, to);
    const pkgs = (Store.packages || []).filter(p => inR(p.day)).map(p => ({ pays: p.payments || [], client: title(((p.first || '') + ' ' + (p.last || '')).trim()), what: `${p.serviceName} × ${p.sessions}`, amount: r2(num(p.total) + num(p.tipTotal)), method: p.method, txn: p.txn || '' }));
    const prods = (Store.moves || []).filter(m => m.type === 'Venta en salón' && inR(Dates.fromISO(m.date))).map(m => ({ date: Dates.fromISO(m.date), name: m.name || m.code, qty: num(m.qty), amount: r2(num(m.qty) * num(m.unitPrice)), method: m.method || 'Sin registrar', txn: m.txn || '', client: m.client || '', pays: m.payGroup ? (m.payLead ? m.payments || [] : []) : null }));
    const pays = Store.notePayments.filter(p => inR(p.day)).map(p => ({ date: p.day, artist: p.artistName, invoice: p.invoice, amount: num(p.amount), method: p.method, txn: p.txn || '' }));
    const parts = [];
    sales.forEach(s => { if (s.method === 'Paquete prepagado' || s.payGroup) return; const tot = r2(s.price - s.discount + s.tip), dep = Math.min(s.depositAmount || 0, tot);
      if (dep) parts.push({ m: (s.depositMethod || 'Sin registrar'), k: 'Depósitos aplicados', v: dep });
      if ((s.payments || []).length > 1) { s.payments.forEach(p => parts.push({ m: p.method, k: 'Servicios', v: r2(num(p.amount)) })); return; } if (tot - dep) parts.push({ m: s.method || 'Sin registrar', k: 'Servicios', v: r2(tot - dep) }); });
    pkgs.forEach(p => (p.pays && p.pays.length > 1 ? p.pays.forEach(q => parts.push({ m: q.method, k: 'Paquetes', v: num(q.amount) })) : parts.push({ m: p.method, k: 'Paquetes', v: p.amount })));
    prods.forEach(p => (p.pays ? p.pays.forEach(q => parts.push({ m: q.method, k: 'Productos', v: num(q.amount) })) : parts.push({ m: p.method, k: 'Productos', v: p.amount })));
    pays.forEach(p => parts.push({ m: p.method, k: 'Pagos de lashistas', v: p.amount }));
    const methods = Logic.groupBy(parts, x => x.m, x => x.v).map(x => ({ ...x, detail: Logic.groupBy(parts.filter(p => p.m === x.key), p => p.k, p => p.v).map(d => `${d.key} ${money(d.value)}`).join(' · ') }));
    const svcCash = r2(parts.filter(p => p.k === 'Servicios' || p.k === 'Depósitos aplicados').reduce((a, p) => a + p.v, 0));
    const tot = { servicios: t.netas, tips: t.tips, count: t.count, prepaid: r2(prepaid.reduce((a, s) => a + s.price - s.discount + s.tip, 0)), paquetes: r2(pkgs.reduce((a, p) => a + p.amount, 0)),
      productos: r2(prods.reduce((a, p) => a + p.amount, 0)), lashistas: r2(pays.reduce((a, p) => a + p.amount, 0)), svcCash };
    tot.recibido = r2(parts.reduce((a, p) => a + p.v, 0));
    tot.ventas = t.ventas; tot.descuentos = t.descuentos;
    // Total del día: lo vendido (servicios − descuentos + tips + productos + pagos de lashistas). Igual en Panel de hoy, Hoja del día y Resumen.
    tot.totalDia = r2(t.netas + t.tips + tot.productos + tot.lashistas);
    return { from, to, sales, t, tot, bySvc, byArt, pkgs, prods, pays, methods };
  },
  label(from, to) { return from === to ? Dates.fmt(from, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : `${Dates.fmt(from)} – ${Dates.fmt(to)}`; },
};

Summary.download = function (kind, d) {
  const label = Summary.label(d.from, d.to), file = `Resumen_ventas_${Dates.toISO(d.from)}${d.from === d.to ? '' : '_a_' + Dates.toISO(d.to)}`, rec = Mode.reception;
  const resumen = [['Concepto', 'Monto'], ['Ventas de servicios', d.tot.ventas], ['Descuentos', d.tot.descuentos], ['Tips', d.tot.tips], ['Productos en salón', d.tot.productos], ['Pagos de lashistas', d.tot.lashistas], ['Total del periodo (servicios − descuentos + tips + productos)', d.tot.totalDia], ['Paquetes vendidos', d.tot.paquetes], ['Sesiones de paquetes ya pagadas (no suman al dinero)', d.tot.prepaid], ['Dinero recibido', d.tot.recibido]];
  const metodos = [['Método', 'Monto', 'Detalle']].concat(d.methods.map(x => [x.key, x.value, x.detail]));
  const lash = [['Lashista', 'Servicios', 'Ventas', 'Tips', ...(rec ? [] : ['Comisión'])]].concat(d.byArt.map(a => [a.name, a.count, a.ventas, a.tips, ...(rec ? [] : [a.comision])]));
  const svc = [['Servicio', 'Cantidad', 'Ventas', 'Ventas netas']].concat(d.bySvc.map(x => [x.key, x.count, x.value, x.netas]));
  const prod = [['Fecha', 'Producto', 'Cantidad', 'Monto', 'Método', 'TXN', 'Cliente']].concat(d.prods.map(p => [Dates.toISO(p.date), p.name, p.qty, p.amount, p.method, p.txn, p.client]));
  const pays = [['Fecha', 'Lashista', 'Invoice', 'Monto', 'Método', 'TXN']].concat(d.pays.map(p => [Dates.toISO(p.date), p.artist, p.invoice, p.amount, p.method, p.txn]));
  const pk = [['Clienta', 'Paquete', 'Monto', 'Método', 'TXN']].concat(d.pkgs.map(p => [p.client, p.what, p.amount, p.method, p.txn]));
  const det = [['Fecha', 'Lashista', 'Servicio', 'Clienta', 'Precio', 'Descuento', 'Tip', 'Método', 'TXN', 'Depósito']].concat(d.sales.slice().sort((a, b) => a.day - b.day).map(s => [Dates.toISO(s.day), s.artistName, s.service, client(s), s.price, s.discount, s.tip, s.method || '', s.txn || '', s.depositAmount || 0]));
  if (kind === 'xlsx') {
    if (!window.XLSX) return UI.toast('El módulo de Excel no cargó.', true);
    const wb = XLSX.utils.book_new(), add = (name, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([[`Fluffy Lashes · Resumen de ventas · ${label}`], []].concat(rows)), name);
    add('Resumen', resumen); add('Métodos de pago', metodos); add('Por lashista', lash); add('Por servicio', svc); add('Productos', prod); add('Pagos lashistas', pays); add('Paquetes', pk); add('Detalle servicios', det);
    return Exporter.save(file + '.xlsx', new Blob([XLSX.write(wb, { type: 'array', bookType: 'xlsx' })]));
  }
  const doc = Pdf.doc(false); if (!doc || !doc.autoTable) return UI.toast('El generador de PDF no cargó.', true);
  Pdf.header(doc, 'Resumen de ventas', label);
  let y = 104; const fm = v => typeof v === 'number' ? fmt2.format(v) : String(v == null ? '' : v);
  const sec = (title, rows, moneyCols) => {
    if (rows.length < 2) return;
    if (y > doc.internal.pageSize.getHeight() - 120) { doc.addPage(); y = 50; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(58, 42, 46); doc.text(title, 40, y); y += 6;
    const cs = {}; moneyCols.forEach(i => { cs[i] = { halign: 'right' }; });
    doc.autoTable({ startY: y, head: [rows[0]], body: rows.slice(1).map(r => r.map((v, i) => moneyCols.includes(i) ? fm(v) : (v == null ? '' : String(v)))), theme: 'grid', margin: { left: 40, right: 40 },
      styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 4, textColor: [58, 42, 46], lineColor: [239, 228, 223], lineWidth: 0.5 }, headStyles: { fillColor: [244, 194, 194], textColor: [58, 42, 46] }, columnStyles: cs });
    y = doc.lastAutoTable.finalY + 22;
  };
  sec('Resumen', resumen, [1]); sec('Por método de pago', metodos, [1]); sec('Por lashista', lash, rec ? [2, 3] : [2, 3, 4]); sec('Por servicio', svc, [2, 3]);
  sec('Productos vendidos en salón', prod.map(r => r.slice(0, 6)), [3]); sec('Pagos de lashistas', pays, [3]); sec('Paquetes vendidos', pk, [2]);
  Pdf.save(doc, file);
};

  html() {

      <div class="sale-layout"><form class="formgrid" novalidate data-pform>

        <label class="field full">Tipo de cliente<div class="segmented small" data-btype>${['Público', 'Estudiante'].map(t => `<button type="button" class="${(st.buyerType || 'Público') === t ? 'on' : ''}" data-bt="${t}">${t}</button>`).join('')}</div></label>
        <div class="full"><div class="phead"><span>Producto</span><span>Cant.</span><span>Precio</span><span>Monto</span><span></span></div><div data-plines>${st.lines.map(line).join('')}</div>
          <button type="button" class="btn sm" data-padd style="margin-top:8px">${ic('plus')}Agregar producto</button></div>
        <label class="field">Método de pago<select name="method"><option value="">Elige método</option>${payMethods().map(m => `<option ${st.method === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></label>
        <label class="field">TXN:<input name="txn" value="${esc(st.txn)}" placeholder="Número de transacción" autocomplete="off"></label>
        <p class="err full" data-perr style="color:var(--bad);font-size:13px;font-weight:600;margin:0"></p>
        <div class="full chips"><button class="btn primary" type="submit" ${Store.writable() ? '' : 'disabled'}>Guardar venta de producto</button><button class="btn" type="button" data-preset>Limpiar</button></div>
      </form><aside class="receipt" data-preceipt>${this.receipt()}</aside></div>`;
  },
  receipt() {
    const st = this.st, lines = st.lines.filter(l => l.code), name = c => (Store.product(c) || {}).name || c, tot = r2(lines.reduce((t, l) => t + num(l.qty) * num(l.price), 0));
    return `<h3>Resumen</h3>${lines.length ? lines.map(l => `<div class="rline"><span>${esc(name(l.code))} × ${intf(num(l.qty))}</span><span>${money(r2(num(l.qty) * num(l.price)), 1)}</span></div>`).join('') : '<p class="mutedc">Elige los productos.</p>'}
      <div class="rline total big"><span>Total a cobrar</span><span>${money(tot, 1)}</span></div><p class="formula">Sale del inventario del salón y suma a la venta del día.</p>`;
  },
  mount(root) {
    const st = this.st, form = $('[data-pform]', root), err = $('[data-perr]', root);
    const repaint = () => { $('[data-preceipt]', root).innerHTML = this.receipt(); $$('[data-pl]', root).forEach(el => { const l = st.lines[+el.dataset.pl]; $('.amt', el).textContent = money(r2(num(l.qty) * num(l.price)), 1); }); };
    form.addEventListener('input', e => { const n = e.target.name; if (n && n in st) { st[n] = e.target.value; UI.formDirty = true; } });
    const lines = $('[data-plines]', root);
    lines.addEventListener('change', e => { const el = e.target.closest('[data-pl]'), k = e.target.dataset.p; if (!el || !k || k === 'rm') return; const l = st.lines[+el.dataset.pl]; l[k] = e.target.value; UI.formDirty = true;
      if (k === 'code') { const p = Store.product(l.code); l.price = p ? (p.priceSalon != null ? p.priceSalon : '') : ''; UI.render(); return; } repaint(); });
    lines.addEventListener('input', e => { const el = e.target.closest('[data-pl]'), k = e.target.dataset.p; if (!el || (k !== 'qty' && k !== 'price')) return; st.lines[+el.dataset.pl][k] = e.target.value; repaint(); });
    lines.addEventListener('click', e => { if (e.target.closest('[data-p=rm]')) { st.lines.splice(+e.target.closest('[data-pl]').dataset.pl, 1); if (!st.lines.length) st.lines.push({ code: '', qty: 1, price: '' }); UI.render(); } });
    $('[data-padd]', root).onclick = () => { st.lines.push({ code: '', qty: 1, price: '' }); UI.render(); };
    $$('[data-bt]', root).forEach(b => b.onclick = () => { st.buyerType = b.dataset.bt; $$('[data-bt]', root).forEach(x => x.classList.toggle('on', x === b)); });
    $('[data-preset]', root).onclick = () => { this.st = this.blank(); UI.formDirty = false; UI.render(); };
    form.onsubmit = async e => {
      e.preventDefault(); err.textContent = '';
      const ls = st.lines.filter(l => l.code), stock = Store.stock();
      if (!ls.length) return (err.textContent = 'Elige al menos un producto.');
      if (ls.some(l => !(num(l.qty) > 0) || !Number.isInteger(num(l.qty)))) return (err.textContent = 'Las cantidades deben ser números enteros mayores a 0.');
      if (ls.some(l => l.price === '' || num(l.price) < 0)) return (err.textContent = 'Escribe el precio de cada producto.');
      if (!st.method) return (err.textContent = 'Elige el método de pago.');
      if (!Dates.fromISO(st.date)) return (err.textContent = 'Escribe la fecha.');

    };
  },
};

        <label class="field">Monto<input type="number" min="0" step="0.01" name="amount" value="${esc(st.amount)}"></label><label class="field">Fecha<input type="date" name="date" value="${esc(st.date)}"></label>

/* =========================================================
   PRODUCTOS → VENTAS por rango de fechas y tipo de cliente:
   Público y Estudiantes (venta en salón) y Salón (notas de insumos a lashistas).
   PRODUCTOS → CONTEO DE INVENTARIO para cargar o corregir existencias de todos los productos a la vez.
   ========================================================= */
const BUYER_TYPES = ['Público', 'Estudiante', 'Salón (lashistas)'];
S.pv = { kind: 'mes', day: Dates.today(), ws: Dates.fluffyWeekStart(Dates.today()), ym: Dates.ym(Dates.today()), from: Dates.today() - 29, to: Dates.today(), type: '' };
const ProdSales = {
  range() { const r = S.pv; if (r.kind === 'dia') return [r.day, r.day]; if (r.kind === 'semana') return [r.ws, r.ws + 6]; if (r.kind === 'rango') return [r.from, r.to]; const [y, m] = r.ym.split('-').map(Number); return [Dates.monthStart(y, m - 1), Dates.monthEnd(y, m - 1)]; },
  rows(from, to) {
    const inR = d => d != null && d >= from && d <= to, out = [];
    (Store.moves || []).filter(m => m.type === 'Venta en salón' && inR(Dates.fromISO(m.date))).forEach(m => out.push({ day: Dates.fromISO(m.date), type: m.buyerType === 'Estudiante' ? 'Estudiante' : 'Público', code: m.code, name: m.name || m.code, qty: num(m.qty), amount: r2(num(m.qty) * num(m.unitPrice)), who: m.client || '', method: m.method || '', txn: m.txn || '' }));
    Store.notes.filter(n => n.source === 'app' && (n.status === 'Enviada' || n.status === 'Pagada') && inR(Dates.fromISO(n.date || (n.month + '-01')))).forEach(n => {
      const f = n.subtotal ? n.taxable / n.subtotal : 1; // reparte los descuentos de la nota entre sus artículos
      n.items.forEach(i => out.push({ day: Dates.fromISO(n.date || (n.month + '-01')), type: 'Salón (lashistas)', code: i.code || '—', name: i.desc, qty: num(i.qty), amount: r2(num(i.amount) * f), who: `${n.artistName} · #${n.invoice}`, method: n.status === 'Pagada' ? 'Pagada' : 'Por cobrar', txn: '' }));
    });
    return out.sort((a, b) => a.day - b.day);
  },
  html() {
    const r = S.pv, [from, to] = this.range(), all = this.rows(from, to), rows = all.filter(x => !r.type || x.type === r.type); this._rows = rows; this._label = from === to ? Dates.fmt(from) : `${Dates.fmt(from)} – ${Dates.fmt(to)}`;
    const tot = t => r2(all.filter(x => x.type === t).reduce((a, x) => a + x.amount, 0)), units = r2(rows.reduce((a, x) => a + x.qty, 0));
    const by = new Map(); rows.forEach(x => { const o = by.get(x.code + '|' + x.name) || { code: x.code, name: x.name, q: {}, a: {}, qty: 0, amount: 0 }; o.q[x.type] = (o.q[x.type] || 0) + x.qty; o.a[x.type] = r2((o.a[x.type] || 0) + x.amount); o.qty += x.qty; o.amount = r2(o.amount + x.amount); by.set(x.code + '|' + x.name, o); });
    this._by = [...by.values()].sort((a, b) => b.amount - a.amount);
    const nav = r.kind === 'dia' ? `<button class="btn sm" data-pvs="-1">${ic('left')}</button><input type="date" class="inp" style="width:auto" data-pvday value="${Dates.toISO(r.day)}"><button class="btn sm" data-pvs="1">${ic('right')}</button>`
      : r.kind === 'semana' ? `<button class="btn sm" data-pvs="-1">${ic('left')}</button><span class="w">${weekLabel(r.ws)}</span><button class="btn sm" data-pvs="1">${ic('right')}</button>`
      : r.kind === 'mes' ? `<button class="btn sm" data-pvs="-1">${ic('left')}</button><span class="w">${esc(ymLabel(r.ym))}</span><button class="btn sm" data-pvs="1">${ic('right')}</button>`
      : `<input type="date" class="inp" style="width:auto" data-pvfrom value="${Dates.toISO(r.from)}"><span>a</span><input type="date" class="inp" style="width:auto" data-pvto value="${Dates.toISO(r.to)}">`;
    const kpi = (l, v, s, lead) => `<div class="kpi ${lead ? 'lead' : ''}"><div class="lab">${l}</div><div class="val">${v}</div><div class="sub">${s}</div></div>`;
    const types = r.type ? [r.type] : BUYER_TYPES;
    return `<div class="filters no-print" style="align-items:center;justify-content:space-between">
        <div class="chips">${[['dia', 'Día'], ['semana', 'Semana'], ['mes', 'Mes'], ['rango', 'Rango']].map(([k, l]) => `<button class="chip ${r.kind === k ? 'on' : ''}" data-pvk="${k}">${l}</button>`).join('')}<div class="weeknav">${nav}</div></div>
        <div class="chips"><button class="btn sm" data-pvdl="xlsx">${ic('dl')}Excel</button><button class="btn sm pink" data-pvdl="pdf">${ic('dl')}PDF</button></div></div>
      <div class="chips no-print" style="margin:-6px 0 16px">${[['', 'Todos']].concat(BUYER_TYPES.map(t => [t, t])).map(([k, l]) => `<button class="chip ${r.type === k ? 'on' : ''}" data-pvt="${esc(k)}">${esc(l)}</button>`).join('')}</div>
      <section class="kpis">${kpi('Público', money(tot('Público')), 'clientas del salón')}${kpi('Estudiantes', money(tot('Estudiante')), 'academia')}${kpi('Salón (lashistas)', money(tot('Salón (lashistas)')), 'notas de insumos, sin tax')}
        ${kpi('Total', money(r2(tot('Público') + tot('Estudiante') + tot('Salón (lashistas)'))), esc(this._label), 1)}${kpi('Unidades', intf(units), r.type ? esc(r.type) : 'todos los tipos')}${kpi('Productos distintos', intf(this._by.length), '')}</section>
      <section class="panel"><h2>Por producto</h2>
        ${table([{ label: 'Código' }, { label: 'Producto' }, ...types.flatMap(t => [{ label: `${t} · cant.`, r: 1 }, { label: `${t} · $`, r: 1 }]), { label: 'Total', r: 1 }],
          this._by.map(o => [o.code, o.name, ...types.flatMap(t => [o.q[t] ? intf(o.q[t]) : '—', o.a[t] ? money(o.a[t], 1) : '—']), money(o.amount, 1)]), null, { emptyTitle: 'Sin ventas de producto', empty: 'Cambia el periodo o el tipo.' })}</section>
      <section class="panel"><h2>Detalle</h2>
        ${table([{ label: 'Fecha' }, { label: 'Tipo' }, { label: 'Producto' }, { label: 'Cant.', r: 1 }, { label: 'Monto', r: 1 }, { label: 'Cliente / lashista' }, { label: 'Método' }, { label: 'TXN' }],
          rows.slice(-300).reverse().map(x => [Dates.fmt(x.day, { day: '2-digit', month: 'short' }), x.type, x.name, intf(x.qty), money(x.amount, 1), x.who || '—', x.method || '—', x.txn || '—']), null, { emptyTitle: 'Sin movimientos', empty: '' })}</section>
      <p class="formula">Público y Estudiantes salen de “Cobrar → Producto” (y “Venta en salón”). Salón (lashistas) son las notas de insumos enviadas o pagadas, por la fecha de la nota y ya con descuentos, sin tax. Todas descuentan del inventario del salón.</p>`;
  },
  mount(root) {
    const r = S.pv;
    $$('[data-pvk]', root).forEach(b => b.onclick = () => { r.kind = b.dataset.pvk; UI.render(); });

/* Si se corrige un cobro (por ejemplo, la lashista), la cita ligada se actualiza igual. */
const _saveSaleSync = Store.saveSale;
Store.saveSale = async function (form, id) {
  const sid = await _saveSaleSync.call(this, form, id);
  if (id) {
    const ap = this.appointments.find(a => a.saleId === sid), s = this.appSales.find(x => x.id === sid);
    if (ap && s) {
      const patch = {};
      if (s.artistKey !== ap.artistId) { patch.artistId = s.artistKey; patch.artistName = s.artistName; if (!ap.scheduledArtistName) patch.scheduledArtistName = ap.artistName; }
      if (s.serviceId && s.serviceId !== ap.serviceId) { patch.serviceId = s.serviceId; patch.serviceName = s.service; patch.price = s.price; if (!ap.scheduledServiceName) patch.scheduledServiceName = ap.serviceName; }
      const sched = patch.scheduledArtistName || ap.scheduledArtistName; if (patch.artistName && sched === patch.artistName) patch.scheduledArtistName = '';
      const schedS = patch.scheduledServiceName || ap.scheduledServiceName; if (patch.serviceName && schedS === patch.serviceName) patch.scheduledServiceName = '';
      if (Object.keys(patch).length) try { await this.saveAppointment({ ...patch, history: (ap.history || []).concat({ at: new Date().toISOString(), by: Mode.who(), what: 'Se corrigió el cobro: ' + [patch.artistName && 'lashista ' + patch.artistName, patch.serviceName && 'servicio ' + patch.serviceName].filter(Boolean).join(', ') }) }, ap.id); } catch (e) {}
    }
  }
  return sid;
};

    .sort((a, b) => a.day - b.day || String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
}
const hhmm = iso => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }); };
Views.agenda.html = function () {

/* =========================================================
   VENTAS → Subir Excel ahora COMPARA el Excel con lo que ya está en la app para las fechas
   elegidas: qué coincide, qué está distinto (y lo corrige), qué falta (y lo agrega) y qué
   está solo en la app (para revisar o borrar). El Excel se toma como el dato correcto.
   ========================================================= */
const nameKey2 = (f, l) => String((f || '') + (l || '')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]/g, '');
const firstTok = f => String(f || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().split(/[\s.]+/)[0] || '';
const SaleCompare = {
  run(res, from, to) {
    const app = Store.sales.filter(s => s.day >= from && s.day <= to), used = new Set(), out = [];
    const ex = res.rows.filter(r => r.status !== 'error');
    const pass = (r, cond) => { const s = app.find(x => !used.has(x.id) && cond(x)); if (s) used.add(s.id); return s; };
    const svcEq = (s, r) => String(s.service).trim().toLowerCase() === String(r.serviceName).trim().toLowerCase();
    const rows = ex.map(r => ({ r, nk: nameKey2(r.first, r.last), ft: firstTok(r.first) }));
    const tries = [
      ['Coincide', (s, x) => s.day === x.r.day && s.artistKey === x.r.artistId && svcEq(s, x.r) && Math.abs(s.price - x.r.price) < .01 && Math.abs(s.tip - x.r.tip) < .01 && Math.abs(s.discount - x.r.discount) < .01 && nameKey2(s.first, s.last) === x.nk],
      ['Diferente', (s, x) => s.day === x.r.day && x.nk && nameKey2(s.first, s.last) === x.nk && (svcEq(s, x.r) || s.artistKey === x.r.artistId)],
      ['Diferente', (s, x) => s.day === x.r.day && x.nk && nameKey2(s.first, s.last) === x.nk],
      ['Diferente', (s, x) => s.day === x.r.day && x.ft && firstTok(s.first) === x.ft && (s.artistKey === x.r.artistId || svcEq(s, x.r))],
      ['Diferente', (s, x) => s.day === x.r.day && !nameKey2(s.first, s.last) && s.artistKey === x.r.artistId && svcEq(s, x.r)],
      ['Diferente', (s, x) => s.day === x.r.day && s.artistKey === x.r.artistId && svcEq(s, x.r) && Math.abs(s.price - x.r.price) < .01],
    ];
    const match = new Map();
    for (const [st, cond] of tries) rows.forEach(x => { if (match.has(x)) return; const s = pass(x.r, s2 => cond(s2, x)); if (s) match.set(x, [st, s]); });
    rows.forEach(x => {
      const m = match.get(x), r = x.r;
      if (!m) { out.push({ status: 'Falta', r, act: true }); return; }
      const [st, s] = m, d = [];
      if (s.artistKey !== r.artistId) d.push(`Lashista: ${s.artistName} → ${r.artistName}`);
      if (!svcEq(s, r)) d.push(`Servicio: ${s.service} → ${r.serviceName}`);
      if (Math.abs(s.price - r.price) > .005) d.push(`Precio: ${money(s.price, 1)} → ${money(r.price, 1)}`);
      if (Math.abs(s.discount - r.discount) > .005) d.push(`Descuento: ${money(s.discount, 1)} → ${money(r.discount, 1)}`);
      if (Math.abs(s.tip - r.tip) > .005) d.push(`Tip: ${money(s.tip, 1)} → ${money(r.tip, 1)}`);
      if (nameKey2(s.first, s.last) !== x.nk) d.push(`Clienta: ${client(s)} → ${title((r.first + ' ' + r.last).trim()) || '—'}`);
      const comX = r.manual != null ? r.manual : r.calc;
      if (comX != null && Math.abs(s.commission - comX) > .005) d.push(`Comisión: ${money(s.commission, 1)} → ${money(comX, 1)}`);
      const status = st === 'Coincide' || !d.length ? 'Coincide' : 'Diferente';
      out.push({ status, r, s, diffs: d, act: status === 'Diferente' && s.source === 'app', locked: s.source !== 'app' });
    });
    app.filter(s => !used.has(s.id)).forEach(s => out.push({ status: 'Solo en la app', s, act: false, locked: s.source !== 'app' }));
    res.rows.filter(r => r.status === 'error').forEach(r => out.push({ status: 'Con error', r, act: false }));
    const ord = ['Diferente', 'Falta', 'Solo en la app', 'Con error', 'Coincide'];
    return out.sort((a, b) => ord.indexOf(a.status) - ord.indexOf(b.status) || ((a.r || a.s).day - (b.r || b.s).day));
  },
  formFrom(r, s) {
    return { date: Dates.toISO(r.day), artistId: r.artistId, serviceId: r.serviceId, price: r.price, discount: r.discount || '', tip: r.tip || '', method: s ? s.method || '' : r.method, txn: s ? s.txn || '' : '',
      first: r.first, last: r.last, comments: r.comments || (s ? s.comments || '' : ''), manualOn: r.manual != null, manualCommission: r.manual != null ? r.manual : '',
      packageId: s ? s.packageId || '' : '', packageSession: s ? s.packageSession || 0 : 0, depositId: s ? s.depositId || '' : '' };
  },
};

/* =========================================================
   REVISIÓN DE CAPTURA — qué tan bien capturó recepción comparado con el Excel:
   cobros correctos, corregidos (y qué se corrigió) y los que faltaron.
   Sale de la bitácora: cada corrección hecha al comparar con el Excel queda con el “antes”.
   ========================================================= */
const Revision = {
  windows() { // cada comparación con Excel aplicada: sus cambios se guardaron en los ~30 min anteriores
    return (Store.auditLogs || []).filter(a => a.entity === 'SALE' && a.action === 'IMPORT' && /Comparó con Excel/.test(a.detail || ''))
      .map(a => ({ end: new Date(a.at).getTime() + 60000, start: new Date(a.at).getTime() - 30 * 60000, user: a.byUserId, name: a.byName, at: a.at }));
  },
  inWin(iso, user, wins) { const t = new Date(iso).getTime(); return !!user && wins.some(w => t >= w.start && t <= w.end && user === w.user); },
  build(from, to) {
    const wins = this.windows();
    const sales = Store.sales.filter(s => s.source === 'app' && s.day >= from && s.day <= to);
    const added = new Set(sales.filter(s => s.origin === 'excel' || (s.createdAt && this.inWin(s.createdAt, s.createdBy, wins))).map(s => s.id));
    const fixes = new Map();
    (Store.auditLogs || []).filter(a => a.entity === 'SALE' && a.action === 'UPDATE' && (a.reason === 'Corregido con Excel' || this.inWin(a.at, a.byUserId, wins)))
      .forEach(a => { const l = fixes.get(a.entityId) || []; l.push(a); fixes.set(a.entityId, l); });
    const deleted = (Store.auditLogs || []).filter(a => a.entity === 'SALE' && a.action === 'DELETE' && this.inWin(a.at, a.byUserId, wins) && a.before && (() => { const d = Dates.fromISO(a.before.date); return d >= from && d <= to; })());
    const captured = sales.filter(s => !added.has(s.id));
    const per = new Map(), types = new Map();
    captured.forEach(s => { const k = s.cashierName || 'Sin registrar', o = per.get(k) || { name: k, n: 0, fixed: 0 }; o.n++; if (fixes.has(s.id)) o.fixed++; per.set(k, o); });
    captured.forEach(s => (fixes.get(s.id) || []).forEach(a => (a.changes || []).forEach(c => types.set(c.field, (types.get(c.field) || 0) + 1))));

/* =========================================================

   en este cobro": cada uno queda como su propia venta, con la comisión de quien lo hizo.

const ADDON_HINTS = ['bottom', 'removal', 'lamination', 'wax', 'threading', 'lip', 'tint', 'henna', 'sideburn', 'chin', 'cheek', 'nose'];
const isAddonSvc = s => ADDON_HINTS.some(k => s.name.toLowerCase().includes(k));
const AddOns = {
  options(sel) {
    const act = Store.config.services.filter(s => s.active !== false), top = act.filter(isAddonSvc), rest = act.filter(s => !isAddonSvc(s));
    const o = s => `<option value="${s.id}" ${sel === s.id ? 'selected' : ''}>${esc(s.name)} · ${money(s.price)}</option>`;
    return `<option value="">Elige complemento</option><optgroup label="Complementos frecuentes">${top.map(o).join('')}</optgroup><optgroup label="Otros servicios">${rest.map(o).join('')}</optgroup>`;
  },
  line(x, k) {
    return `<div class="xline adline" data-ad="${k}"><select class="inp" data-adk="serviceId" aria-label="Complemento">${AddOns.options(x.serviceId)}</select>
      <select class="inp" data-adk="artistId" aria-label="Lashista">${artistOptions(x.artistId, 0, 0).replace('Elige lashista', 'Misma lashista')}</select>
      <input class="inp num" type="number" min="0" step="0.01" data-adk="price" value="${esc(x.price != null ? x.price : '')}" placeholder="Precio" aria-label="Precio">
      <button type="button" class="btn sm" data-adk="rm" aria-label="Quitar">×</button></div>`;
  },
  mountForm(m, list, mainArtist) {
    const box = $('[data-addons]', m); if (!box) return;
    const draw = () => { box.innerHTML = list.map(AddOns.line).join(''); };
    draw();
    $('[data-addaddon]', m).onclick = () => { list.push({ serviceId: '', artistId: '', price: '' }); draw(); };
    box.addEventListener('change', e => { const l = e.target.closest('[data-ad]'), k = e.target.dataset.adk; if (!l || !k || k === 'rm') return; const x = list[+l.dataset.ad]; x[k] = e.target.value;
      if (k === 'serviceId') { const s = Store.config.services.find(y => y.id === x.serviceId); if (s) { x.price = s.price; $('[data-adk=price]', l).value = s.price; } } });
    box.addEventListener('input', e => { const l = e.target.closest('[data-ad]'); if (l && e.target.dataset.adk === 'price') list[+l.dataset.ad].price = e.target.value; });
    box.addEventListener('click', e => { if (e.target.closest('[data-adk=rm]')) { list.splice(+e.target.closest('[data-ad]').dataset.ad, 1); draw(); } });
  },
  validate(list) { return list.some(x => x.serviceId && (x.price === '' || num(x.price) < 0)) ? 'Revisa el precio de los complementos.' : ''; },
  clean(list) {
    return list.filter(x => x.serviceId).map(x => { const s = Store.config.services.find(y => y.id === x.serviceId) || {}, a = Store.config.artists.find(y => y.id === x.artistId);
      return { serviceId: x.serviceId, serviceName: s.name || '', price: r2(x.price), artistId: a ? a.id : '', artistName: a ? a.name : '' }; });
  },
  total: a => r2((a.addons || []).reduce((t, x) => t + num(x.price), 0)),
  text: a => (a.addons || []).map(x => x.serviceName + (x.artistName && x.artistName !== a.artistName ? ` (${x.artistName})` : '')).join(', '),
};

      <div class="segmented small" data-fact style="margin:14px 0 10px">${[['add', '+ Agregar stock'], ['move', 'Pasar entre bodega y salón'], ['count', 'Ajustar conteo']].map(([k, l], i) => `<button type="button" class="${i ? '' : 'on'}" data-fa="${k}">${l}</button>`).join('')}</div>

    hist: moves.length ? `<div class="tablewrap" style="max-height:46vh;overflow:auto"><table><thead><tr><th>Fecha</th><th>Movimiento</th><th class="r">Cant.</th><th>Detalle</th></tr></thead><tbody>${moves.map(m => `<tr><td>${esc(Dates.fmt(Dates.fromISO(m.date), { day: '2-digit', month: 'short', year: '2-digit' }))}</td><td>${esc(m.type)}</td><td class="r">${m.type === 'Ajuste' ? (m.qty > 0 ? '+' : '') + intf(m.qty) : (m.to && !m.from ? '+' : m.from && !m.to ? '−' : '') + intf(m.qty)}</td><td style="white-space:normal;font-size:12.5px">${esc([m.type === 'Transferencia' ? `${m.from} → ${m.to}` : m.to ? 'a ' + m.to : m.from ? 'de ' + m.from : m.location ? m.location + ' · contado ' + m.counted : '', m.client, m.notes, m.byName].filter(Boolean).join(' · '))}</td></tr>`).join('')}</tbody></table></div>` : '<p class="mutedc">Sin movimientos todavía.</p>',
  };
  UI.modal(`<div class="fhead"><div><h3 style="margin:0">${esc(p.name)}</h3><p class="mutedc" style="margin:4px 0 0">${esc(p.code)} · ${esc(p.category || 'Sin categoría')}${p.active === false ? ' · inactivo' : ''}</p></div></div>
    <div class="tabs" role="tablist" style="margin:14px 0 16px">${tabs.map(([k, l]) => `<button role="tab" class="${tab === k ? 'on' : ''}" data-ftab="${k}">${l}</button>`).join('')}</div>
    ${body[tab]}
    <div class="acts"><button class="btn" data-x="c">Cerrar</button>${tab === 'stock' && Store.writable() ? '<button class="btn primary" data-x="ok">Guardar</button>' : ''}${tab === 'data' && canData ? '<button class="btn primary" data-x="ok">Guardar cambios</button>' : ''}</div>`, m => {
    m.classList.add('wide');
    $('[data-x=c]', m).onclick = UI.close;
    $$('[data-ftab]', m).forEach(b => b.onclick = () => { UI.close(); productFicha(p, b.dataset.ftab); });
    const err = t => { const e = $('[data-ferr]', m); if (e) e.textContent = t; };
    const admin = async what => { const e = await Claves.ask('Clave de administración', { admin: true, hint: what + ' Escribe tu clave de administración.' }); return e; };
    if (tab === 'stock') {
      let act = 'add';
      const form = $('[data-fform]', m);
      const draw = () => {
        form.innerHTML = act === 'add' ? `<label class="field">Cantidad que llegó<input type="number" min="1" step="1" data-ff="qty" value="1"></label><label class="field">¿A dónde entra?<select data-ff="to"><option value="bodega">Bodega</option><option value="salon">Salón</option></select></label>
            <label class="field">Costo por pieza (opcional)<input type="number" min="0" step="0.01" data-ff="unitCost" value="${p.cost == null ? '' : p.cost}"></label><label class="field">Proveedor / nota (opcional)<input data-ff="notes"></label>`
          : act === 'move' ? `<label class="field">Cantidad<input type="number" min="1" step="1" data-ff="qty" value="1"></label><label class="field">Dirección<select data-ff="dir"><option value="bs">De bodega a salón</option><option value="sb">De salón a bodega</option></select></label><label class="field full">Nota (opcional)<input data-ff="notes"></label>`
          : `<label class="field">¿Dónde contaste?<select data-ff="location"><option value="salon">Salón (hay ${intf(st.salon)})</option><option value="bodega">Bodega (hay ${intf(st.bodega)})</option></select></label><label class="field">Lo que contaste<input type="number" min="0" step="1" data-ff="counted"></label><label class="field full">Nota (opcional)<input data-ff="notes" placeholder="Ej. conteo mensual"></label>`;
      };
      draw();
      $$('[data-fa]', m).forEach(b => b.onclick = () => { act = b.dataset.fa; $$('[data-fa]', m).forEach(x => x.classList.toggle('on', x === b)); err(''); draw(); });
      const ok = $('[data-x=ok]', m); if (ok) ok.onclick = async () => {
        const v = k => { const el = $(`[data-ff="${k}"]`, m); return el ? el.value.trim() : ''; }, today = Dates.toISO(Dates.today());
        let move;
        if (act === 'count') { const c = num(v('counted')); if (v('counted') === '' || c < 0 || !Number.isInteger(c)) return err('Escribe lo que contaste (número entero).'); const loc = v('location'); if (c === st[loc]) return err('Es igual a lo que ya hay; no hay nada que ajustar.'); move = { type: 'Ajuste', code: p.code, name: p.name, date: today, location: loc, counted: c, qty: c - st[loc], notes: v('notes') || 'Ajuste desde la ficha' }; }
        else { const q = num(v('qty')); if (!(q > 0) || !Number.isInteger(q)) return err('La cantidad debe ser un número entero mayor a 0.');
          if (act === 'add') move = { type: 'Compra', code: p.code, name: p.name, date: today, qty: q, from: null, to: v('to'), unitCost: v('unitCost') === '' ? null : r2(v('unitCost')), notes: v('notes') };
          else { const [from, to] = v('dir') === 'bs' ? ['bodega', 'salon'] : ['salon', 'bodega']; if (q > st[from] && !m._ok) { m._ok = true; return err(`En ${from === 'bodega' ? 'bodega' : 'salón'} solo hay ${st[from]}. Toca Guardar otra vez si de todos modos quieres moverlo.`); } move = { type: 'Transferencia', code: p.code, name: p.name, date: today, qty: q, from, to, notes: v('notes') }; } }
        const e = await admin(act === 'add' ? 'Vas a agregar stock.' : act === 'move' ? 'Vas a mover stock.' : 'Vas a ajustar la existencia.'); if (!e) return;
        try { await Store.saveMove({ ...move, byName: e.name }); UI.toast('Inventario actualizado'); UI.close(); productFicha(Store.config.products.find(x => x.id === p.id) || p, 'stock'); }
        catch (er) { err('No se pudo guardar: ' + (er.message || er.code)); }
      };
    }
    if (tab === 'data' && canData) $('[data-x=ok]', m).onclick = async () => {
      const v = k => $(`[data-fd="${k}"]`, m), val = k => v(k).value.trim(), nOrNull = k => val(k) === '' ? null : r2(val(k));
      if (!val('name')) return err('Escribe el nombre.');
      for (const k of ['priceSalon', 'priceArtist', 'cost', 'min']) if (val(k) !== '' && (isNaN(Number(val(k))) || Number(val(k)) < 0)) return err('Revisa los números: no pueden ser negativos.');
      const rec = { ...p, name: val('name'), category: val('category'), priceSalon: nOrNull('priceSalon'), priceArtist: nOrNull('priceArtist'), cost: nOrNull('cost'), min: val('min') === '' ? null : Math.round(num(val('min'))), active: v('active').checked };
      const diffs = [['name', 'Nombre'], ['category', 'Categoría'], ['priceSalon', 'Precio público'], ['priceArtist', 'Precio lashista'], ['cost', 'Costo'], ['min', 'Mínimo'], ['active', 'Activo']].filter(([k]) => String(p[k] == null ? '' : p[k]) !== String(rec[k] == null ? '' : rec[k]));
      if (!diffs.length) return err('No hay cambios.');

        await Store.saveConfig({ products: Store.config.products.map(x => x.id === p.id ? rec : x) });
        if (typeof Audit !== 'undefined') try { await Audit.log({ entity: 'PRODUCT', entityId: p.id, entityLabel: p.code + ' · ' + rec.name, action: 'UPDATE', changes: diffs.map(([k, l]) => ({ field: l, from: String(p[k] == null ? '—' : p[k]), to: String(rec[k] == null ? '—' : rec[k]) })), byName: e.name }); } catch (x) {}
        UI.toast('Producto actualizado'); UI.close(); productFicha(rec, 'data');
      } catch (er) { err('No se pudo guardar: ' + (er.message || er.code)); }
    };
  });
}

/* =========================================================
   Administración puede ELIMINAR una cita (y, si quiere, su cobro), no solo cancelarla.
   Queda registrado en la bitácora.
   ========================================================= */
const isAdminUser = () => typeof FM !== 'undefined' && FM.member ? FM.member.role === 'admin' : !Mode.reception;
Store.deleteAppointment = async function (id) {
  if (!this.writable()) throw new Error('No tienes permiso para borrar.');
  await this.db.doc('appointments/' + id).delete();
  this.appointments = this.appointments.filter(a => a.id !== id); this.invalidate();
};
const _apptDetailDel = apptDetail;
apptDetail = function (a) {
  _apptDetailDel(a);
  const m = $('.modal'); if (!m || !isAdminUser() || !Store.writable()) return;
  const acts = $('.acts', m); if (!acts) return;
  acts.insertAdjacentHTML('afterbegin', `<button class="btn danger" data-x="delappt">Eliminar</button>`);
  $('[data-x=delappt]', m).onclick = () => { UI.close(); deleteApptModal(a); };
};
function deleteApptModal(a) {
  const sales = [a.saleId].concat(a.extraSaleIds || []).map(id => Store.sales.find(s => s.id === id)).filter(s => s && s.source === 'app');
  const d = a.depositId ? Store.deposits.find(x => x.id === a.depositId) : null;
  UI.modal(`<h3>Eliminar la cita de ${esc(apptClient(a))}</h3>
    <p style="color:var(--muted);margin:0 0 12px">${esc(Dates.fmt(a.day, { weekday: 'long', day: 'numeric', month: 'long' }))}${a.time ? ' · ' + esc(a.time) : ''} · ${esc(a.artistName)} · ${esc(a.serviceName)}. Se borra de la agenda; no se puede deshacer.</p>
    ${sales.length ? `<label class="check"><input type="checkbox" data-delsales> También eliminar su cobro (${sales.map(s => `${esc(s.service)} ${money(r2(s.price - s.discount + s.tip), 1)}`).join(' + ')})</label><p class="formula">Si no lo marcas, el cobro se queda en ventas y en el payroll como “cobro sin cita”.</p>` : ''}
    ${d && !d.outcome ? `<p class="formula">El depósito de ${money(d.amount)} (${esc(d.method)}) queda disponible en Depósitos.</p>` : ''}
    <div class="acts"><button class="btn" data-x="no">Cancelar</button><button class="btn danger" data-x="ok">Eliminar</button></div>`, m => {
    $('[data-x=no]', m).onclick = UI.close;
    $('[data-x=ok]', m).onclick = async () => {
      const alsoSales = !!($('[data-delsales]', m) || {}).checked, b = $('[data-x=ok]', m); b.disabled = true;
      try {
        await Store.deleteAppointment(a.id);   // primero la cita, para que borrar el cobro no la reviva
        if (alsoSales) for (const s of sales) await Store.deleteSale(s.id);
        if (d && !d.outcome && d.appointmentId === a.id) await Store.saveDeposit({ appointmentId: '', _event: 'Se eliminó la cita' }, d.id);
        if (typeof Audit !== 'undefined') try { await Audit.log({ entity: 'APPT', entityId: a.id, entityLabel: `${apptClient(a)} · ${a.serviceName}`, action: 'DELETE', before: { date: a.date, time: a.time, artist: a.artistName, service: a.serviceName, status: a.status, salesDeleted: alsoSales ? sales.length : 0 }, byName: Mode.who() }); } catch (e) {}
        UI.close(); UI.toast(alsoSales && sales.length ? 'Cita y cobro eliminados' : 'Cita eliminada');
      } catch (e) { b.disabled = false; UI.toast('No se pudo eliminar: ' + (e.message || e.code), true); }
    };
  });
}

/* =========================================================
   INSUMOS con más detalle:
   - Nueva solicitud: fecha, existencia en salón y estado por artículo (Pendiente / Entregado / Sin stock).
   - Toda solicitud se puede abrir para ver y corregir (mientras no esté en una nota enviada).
   - Cobro del mes por lashista: detalle de lo entregado, estado de su nota (Borrador, Enviada, Pagada),
     generar la nota, agregarle lo nuevo y abrirla para poner descuentos.
   ========================================================= */
const ITEM_STATES = ['Pendiente', 'Entregado', 'Sin stock'];
const itemTag = s => s === 'Entregado' ? '<span class="tag app">Entregado</span>' : s === 'Sin stock' ? '<span class="tag" style="color:var(--bad);border-color:var(--bad)">Sin stock</span>' : '<span class="tag warn">Pendiente</span>';
const reqStatus = items => { const ent = items.filter(i => i.state === 'Entregado').length, ss = items.filter(i => i.state === 'Sin stock').length, pe = items.length - ent - ss;
  return pe ? (ent ? 'Parcial' : 'Pendiente') : ent === items.length ? 'Entregada' : ent ? 'Parcial' : 'Sin stock'; };
const reqTag = s => ({ Pendiente: '<span class="tag warn">Pendiente</span>', Entregada: '<span class="tag app">Entregada</span>', Parcial: '<span class="tag warn">Parcial</span>', 'Sin stock': '<span class="tag" style="color:var(--bad);border-color:var(--bad)">Sin stock</span>', Cancelada: '<span class="tag off">Cancelada</span>' })[s] || esc(s);
const noteOf = id => id ? Store.notes.find(n => n.id === id) : null;
const noteTag = n => !n ? '<span class="tag">Sin nota</span>' : n.status === 'Pagada' ? `<span class="tag app">Pagada · #${esc(n.invoice)}</span>` : n.status === 'Enviada' ? `<span class="tag warn">Enviada · #${esc(n.invoice)}${n.pending ? ' · debe ' + money(n.pending) : ''}</span>` : n.status === 'Cancelada' ? `<span class="tag off">Cancelada · #${esc(n.invoice)}</span>` : `<span class="tag">Borrador · #${esc(n.invoice)}</span>`;
const unitPrice = code => num((Store.product(code) || {}).priceArtist);

/* ---------- formulario de solicitud (nueva o editar) ---------- */
function requestEditor(r, deliver) {
  const billed = r && noteOf(r.billedNoteId), locked = billed && billed.status !== 'Borrador';
  const cat = Store.config.products.filter(p => p.active !== false).sort((a, b) => (a.category || 'zz').localeCompare(b.category || 'zz') || a.name.localeCompare(b.name)), stock = Store.stock();
  const st = { artistId: r ? r.artistId : '', date: r ? (r.requestDate || (r.createdAt || '').slice(0, 10)) : Dates.toISO(Dates.today()), note: r ? r.note || '' : '', items: r ? r.items.map(i => ({ ...i })) : [{ code: '', qty: 1, state: 'Pendiente' }] };
  if (deliver) st.items.forEach(i => { if (i.state === 'Pendiente') i.state = (stock.get(i.code) || { salon: 0 }).salon >= num(i.qty) ? 'Entregado' : 'Sin stock'; });
  const opts = sel => { let last = null; return '<option value="">Elige producto</option>' + cat.map(p => { const g = (p.category || 'Sin categoría') !== last ? `${last !== null ? '</optgroup>' : ''}<optgroup label="${esc(p.category || 'Sin categoría')}">` : ''; last = p.category || 'Sin categoría'; return g + `<option value="${esc(p.code)}" ${sel === p.code ? 'selected' : ''}>${esc(p.name)} · ${esc(p.code)}</option>`; }).join('') + '</optgroup>'; };
  const line = (it, k) => { const s = stock.get(it.code) || { salon: 0 };
    return `<div class="rqline" data-rl="${k}"><select class="inp" data-r="code" ${locked ? 'disabled' : ''}>${opts(it.code)}</select><input class="inp num" type="number" min="1" step="1" data-r="qty" value="${esc(it.qty)}" ${locked ? 'disabled' : ''} aria-label="Cantidad">
      <select class="inp" data-r="state" ${locked ? 'disabled' : ''} aria-label="Estado">${ITEM_STATES.map(x => `<option ${it.state === x ? 'selected' : ''}>${x}</option>`).join('')}</select><button class="btn sm" data-r="rm" ${locked ? 'disabled' : ''} aria-label="Quitar">×</button>
      ${it.code ? `<span class="rqinfo ${s.salon < num(it.qty) ? 'neg' : 'mutedc'}">En salón: ${intf(s.salon)} · ${money(unitPrice(it.code), 1)} c/u${it.state === 'Entregado' ? ' · subtotal ' + money(r2(unitPrice(it.code) * num(it.qty)), 1) : ''}</span>` : ''}</div>`; };

    <p style="color:var(--muted);margin:0 0 12px">${r ? `${reqTag(r.status)} ${r.source === 'link' ? '<span class="tag">Por link</span>' : ''} · registró ${esc(r.createdByName || '—')}${r.deliveredAt ? ' · entregó ' + esc(r.deliveredByName || '—') + ' el ' + new Date(r.deliveredAt).toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }) : ''}` : 'Marca cada artículo como Pendiente (por entregar), Entregado o Sin stock. Se cobra en la nota del mes solo lo entregado.'}</p>
    ${billed ? `<div class="banner">Está en la nota #${esc(billed.invoice)} (${esc(billed.status)}).${locked ? ' Ya no se puede cambiar aquí: corrige la nota.' : ' Si cambias algo, después usa “Actualizar nota” en Cobro del mes.'}</div>` : ''}
    <div class="formgrid"><label class="field">Lashista<select data-ra ${r ? 'disabled' : ''}>${artistOptions(st.artistId, 0, 0)}</select></label><label class="field">Fecha de solicitud<input type="date" data-rdate value="${esc(st.date)}" ${locked ? 'disabled' : ''}></label></div>
    <div class="rqhead"><span>Producto</span><span>Cant.</span><span>Estado</span><span></span></div><div data-rlines></div>
    ${locked ? '' : `<div class="chips" style="margin-top:8px"><button class="btn sm" data-radd>${ic('plus')}Agregar producto</button><button class="btn sm" data-rall>Marcar pendientes como entregados</button></div>`}
    <label class="field" style="margin-top:12px">Nota (opcional)<input data-rnote value="${esc(st.note)}" ${locked ? 'disabled' : ''}></label>
    <div class="rqtot" data-rtot></div><p class="err" data-rerr style="color:var(--bad);font-size:13px;font-weight:600"></p>
    <div class="acts">${r && !billed && Store.writable() ? '<button class="btn danger" data-x="del">Eliminar solicitud</button>' : ''}<button class="btn" data-x="no">${locked ? 'Cerrar' : 'Cancelar'}</button>${locked ? '' : `<button class="btn primary" data-x="ok">${deliver ? 'Confirmar entrega' : r ? 'Guardar cambios' : 'Guardar solicitud'}</button>`}</div>`, m => {

    draw();

    box.addEventListener('change', e => { const l = e.target.closest('[data-rl]'), k = e.target.dataset.r; if (!l || !k || k === 'rm') return; st.items[+l.dataset.rl][k] = e.target.value; draw(); });

   CAMPANITA de solicitudes de insumos.
   - Muestra cuántas solicitudes hay por entregar (menú lateral, barra del celular y Panel de hoy).
   - Cuando llega una nueva (por el link o capturada en otro dispositivo): suena un aviso,
     la campanita se mueve y aparece un mensaje con quién la pidió.
   ========================================================= */

const Notify = {
  seen: (() => { try { return new Set(JSON.parse(localStorage.getItem('fm-seen-req') || '[]')); } catch (e) { return new Set(); } })(),
  first: (() => { try { return localStorage.getItem('fm-seen-req') == null; } catch (e) { return false; } })(), t0: Date.now(), audio: null, ringUntil: 0,
  pending() { return Store.requests.filter(r => typeof hasPending === 'function' ? hasPending(r) : r.status === 'Pendiente').sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')); },
  save() { try { localStorage.setItem('fm-seen-req', JSON.stringify([...this.seen].slice(-400))); } catch (e) {} },
  unlock() { // los navegadores solo dejan sonar después de un toque en la página
    if (this.audio) return; try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.audio = new AC(); } catch (e) {}
  },
  ding() {
    const ac = this.audio; if (!ac) return; try { if (ac.state === 'suspended') ac.resume();
      [[880, 0], [1320, 0.16]].forEach(([f, t]) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(ac.destination);

  },
  check() {
    const pend = this.pending();
    // Primera vez en este dispositivo: lo que ya estaba pendiente no suena (solo se cuenta en la campanita).
    if (this.first && Date.now() - this.t0 < 6000) { pend.forEach(r => this.seen.add(r.id)); this.save(); return; }
    const fresh = pend.filter(r => !this.seen.has(r.id));
    if (!fresh.length) return;
    fresh.forEach(r => this.seen.add(r.id)); this.save();
    const r = fresh[0], n = r.items.length;
    this.ringUntil = Date.now() + 4000; this.ding();
