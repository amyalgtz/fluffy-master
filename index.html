/* =========================================================
   CLIENTAS QUE YA VINIERON — al escribir el nombre (en Nueva cita o en Cobrar) la app
   sugiere clientas anteriores, llena sus datos y muestra su historial: cuántas veces
   ha venido, la última visita, servicio, lashista, depósitos y no-shows.
   Sale de todas las ventas (incluido el histórico del Excel), citas y depósitos.
   ========================================================= */
const ckey = (f, l) => String((f || '') + ' ' + (l || '')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
const ClientDir = {
  _sig: '', _map: null,
  build() {
    const sig = Store.sales.length + '|' + Store.appointments.length + '|' + Store.deposits.length;
    if (this._map && sig === this._sig) return this._map;
    const map = new Map();
    const get = (f, l) => { const k = ckey(f, l); if (!k || k.length < 3) return null; let c = map.get(k); if (!c) { c = { key: k, first: '', last: '', phone: '', email: '', visits: new Set(), sales: [], appts: 0, noshow: 0, spent: 0, last: null, lastSale: null }; map.set(k, c); } if (f && (!c.first || f !== f.toLowerCase())) { c.first = String(f).trim(); c.last = String(l || '').trim(); } return c; };
    Store.sales.forEach(s => { const c = get(s.first, s.last); if (!c) return;
      if (s.service === 'DEPOSITO - NO SHOW') { c.noshow++; return; }
      c.visits.add(s.day); c.sales.push(s); c.spent += s.price - s.discount + s.tip; if (!c.lastSale || s.day > c.lastSale.day) c.lastSale = s; });
    Store.appointments.forEach(a => { const c = get(a.first, a.last); if (!c) return; c.appts++; if (a.status === 'No-show') c.noshow++; if (a.phone) c.phone = a.phone; if (a.email) c.email = a.email; });
    Store.deposits.forEach(d => { const c = get(d.first, d.last); if (c && d.phone && !c.phone) c.phone = d.phone; });
    map.forEach(c => { c.nvisits = c.visits.size; c.lastDay = c.lastSale ? c.lastSale.day : null; c.name = title((c.first + ' ' + c.last).trim()); });
    this._map = map; this._sig = sig; return map;
  },
  find(f, l) { return this.build().get(ckey(f, l)) || null; },
  search(q) {
    const k = ckey(q, ''); if (k.length < 2) return [];
    const toks = k.split(' ');
    return [...this.build().values()].filter(c => { const w = c.key.split(' '); return toks.every(t => w.some(x => x.startsWith(t))); })
      .sort((a, b) => (b.lastDay || 0) - (a.lastDay || 0) || b.nvisits - a.nvisits).slice(0, 7);
  },
  summary(c) {
    if (!c) return '';
    const ls = c.lastSale, ago = ls ? Dates.today() - ls.day : null;
    return `<div class="clientcard"><div><b>${esc(c.name)}</b> ya ha venido <b>${intf(c.nvisits)}</b> ${c.nvisits === 1 ? 'vez' : 'veces'}${ls ? ` · última visita <b>${esc(Dates.fmt(ls.day, { day: 'numeric', month: 'short', year: 'numeric' }))}</b>${ago != null && ago >= 0 ? ` (hace ${ago === 0 ? 'hoy' : ago < 60 ? ago + ' días' : Math.round(ago / 30) + ' meses'})` : ''}` : ''}</div>
      ${ls ? `<div class="mutedc">Último servicio: ${esc(ls.service)} con ${esc(ls.artistName)} · ${money(r2(ls.price - ls.discount + ls.tip), 1)}${ls.tip ? ` (tip ${money(ls.tip)})` : ''}</div>` : ''}
      <div class="mutedc">${c.phone ? 'Tel. ' + esc(c.phone) + ' · ' : ''}${c.email ? esc(c.email) + ' · ' : ''}Total gastado ${money(r2(c.spent))}${c.noshow ? ` · <span style="color:var(--bad);font-weight:700">${c.noshow} no-show${c.noshow > 1 ? 's' : ''}</span>` : ''}</div></div>`;
  },
  history(c) {
    if (!c || !c.sales.length) return '<p class="mutedc">Sin visitas anteriores.</p>';
    const l = c.sales.slice().sort((a, b) => b.day - a.day).slice(0, 12);
    return `<div class="tablewrap" style="max-height:40vh;overflow:auto"><table><thead><tr><th>Fecha</th><th>Servicio</th><th>Lashista</th><th class="r">Total</th></tr></thead><tbody>${l.map(s => `<tr><td>${esc(Dates.fmt(s.day, { day: '2-digit', month: 'short', year: '2-digit' }))}</td><td>${esc(s.service)}</td><td>${esc(s.artistName)}</td><td class="r">${money(r2(s.price - s.discount + s.tip), 1)}</td></tr>`).join('')}</tbody></table></div>${c.sales.length > 12 ? `<p class="formula">Mostrando las últimas 12 de ${c.sales.length} visitas.</p>` : ''}`;
  },
};
Store.onChange(() => { ClientDir._map = null; });

/* Sugerencias al escribir el nombre. opts: { first, last, phone, email, artist, service, after } (inputs) */
function attachClientLookup(box, opts) {
  const fi = opts.first, la = opts.last; if (!fi || !la) return;
  let list = null, items = [], info = null;
  const anchor = fi.closest('.formgrid') || fi.parentNode;
  const card = document.createElement('div'); card.className = 'full clientinfo'; (opts.after || la.closest('label')).insertAdjacentElement('afterend', card);
  const showCard = () => {
    const c = ClientDir.find(fi.value, la.value); info = c;
    card.innerHTML = c ? ClientDir.summary(c) + (opts.artist && c.lastSale ? `<div class="chips" style="margin-top:6px"><button type="button" class="btn sm" data-cl-same>Misma lashista y servicio que la última vez</button><button type="button" class="btn sm" data-cl-hist>Ver historial</button></div>` : `<div class="chips" style="margin-top:6px"><button type="button" class="btn sm" data-cl-hist>Ver historial</button></div>`) : (fi.value.trim().length >= 2 ? '<div class="clientcard new"><b>Clienta nueva</b> <span class="mutedc">· no hay visitas anteriores con ese nombre.</span></div>' : '');
    const same = $('[data-cl-same]', card); if (same) same.onclick = () => { const s = c.lastSale; if (opts.artist) { opts.artist.value = s.artistKey; opts.artist.dispatchEvent(new Event('change', { bubbles: true })); opts.artist.dispatchEvent(new Event('input', { bubbles: true })); } const sid = s.serviceId || (Store.config.services.find(x => x.name === s.service) || {}).id; if (opts.service && sid) { opts.service.value = sid; opts.service.dispatchEvent(new Event('change', { bubbles: true })); opts.service.dispatchEvent(new Event('input', { bubbles: true })); } UI.toast('Lashista y servicio de la última visita'); };
    const hist = $('[data-cl-hist]', card); if (hist) hist.onclick = () => { const p = document.createElement('div'); p.className = 'clienthist'; p.innerHTML = ClientDir.history(c); hist.replaceWith(p); };
  };
  const close = () => { if (list) { list.remove(); list = null; } };
  const pick = c => {
    fi.value = c.first ? title(c.first) : ''; la.value = c.last ? title(c.last) : '';
    if (opts.phone && c.phone && !opts.phone.value) opts.phone.value = c.phone;
    if (opts.email && c.email && !opts.email.value) opts.email.value = c.email;
    [fi, la, opts.phone, opts.email].forEach(el => { if (el) { el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); } });
    close(); showCard();
  };
  const open = src => {
    items = ClientDir.search(fi.value + ' ' + la.value); close();
    if (!items.length || (items.length === 1 && ckey(fi.value, la.value) === items[0].key)) { showCard(); return; }
    list = document.createElement('div'); list.className = 'clientsugg';
    list.innerHTML = `<div class="mutedc" style="padding:6px 12px;font-size:12px">Clientas que ya vinieron</div>` + items.map((c, i) => `<button type="button" data-ci="${i}"><b>${esc(c.name)}</b><span>${intf(c.nvisits)} visita${c.nvisits === 1 ? '' : 's'}${c.lastSale ? ' · última ' + esc(Dates.fmt(c.lastSale.day, { day: '2-digit', month: 'short', year: '2-digit' })) + ' · ' + esc(c.lastSale.service) : ''}${c.phone ? ' · ' + esc(c.phone) : ''}</span></button>`).join('');
    src.closest('label').appendChild(list);
    $$('[data-ci]', list).forEach(b => b.onmousedown = e => { e.preventDefault(); pick(items[+b.dataset.ci]); });
  };
  [fi, la].forEach(el => {
    el.setAttribute('autocomplete', 'off');
    el.addEventListener('input', () => { open(el); });
    el.addEventListener('blur', () => setTimeout(() => { close(); showCard(); }, 150));
    el.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  });
  if (fi.value) showCard();
}

/* =========================================================
   COBRAR → PAGO DIVIDIDO: una clienta paga con varias formas (por ejemplo, parte en Zelle
   y parte con tarjeta). Cada forma lleva su monto y su TXN, y la Hoja del día y el Resumen
   cuentan cada parte en su método.
   ========================================================= */
const payMethodsAll = () => [...new Set(Store.config.methods.concat(DEPOSIT_METHODS))].filter(m => m !== 'Depósito' && m !== 'Paquete prepagado');
const cobroDue = f => {
  const main = num(f.price) - num(f.discount) + num(f.tip), ex = (f.extras || []).filter(x => x.serviceId).reduce((t, x) => t + num(x.price) - num(x.discount), 0);
  const d = f.depositId === '__new' ? num((f.newDep || {}).amount) : f.depositId ? num((Store.deposits.find(x => x.id === f.depositId) || {}).amount) : 0;
  return r2(Math.max(0, main + ex - d));
};
const splitLine = (p, k) => `<div class="payline" data-pl2="${k}"><select class="inp" data-p2="method" aria-label="Forma de pago"><option value="">Forma de pago</option>${payMethodsAll().map(m => `<option ${p.method === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>
  <input class="inp num" type="number" min="0" step="0.01" data-p2="amount" value="${esc(p.amount)}" placeholder="Monto" aria-label="Monto"><input class="inp" data-p2="txn" value="${esc(p.txn || '')}" placeholder="TXN" aria-label="TXN" autocomplete="off"><button type="button" class="btn sm" data-p2="rm" aria-label="Quitar">×</button></div>`;
const _nvHtmlP = Views.nueva.html, _nvMountP = Views.nueva.mount, _nvReceiptP = Views.nueva.receipt;
Views.nueva.html = function () {
  const h = _nvHtmlP.call(this);
  if (S.cobro.tipo !== 'servicio' || !this.form || this.form.packageId) return h;
  const f = this.form;
  if (UI.params.edit && f.payments == null) { const s = Store.appSales.find(x => x.id === UI.params.edit); f.payments = s && (s.payments || []).length > 1 ? s.payments.map(p => ({ ...p })) : []; f.split = f.payments.length > 1; }
  const block = `<div class="full splitbox ${f.split ? 'on' : ''}" data-split>
    <div class="splitswitch"><span>¿Cómo pagó?</span><div class="segmented small"><button type="button" data-splitbtn data-mode="one" class="${f.split ? '' : 'on'}">Un solo método</button><button type="button" data-splitbtn data-mode="split" class="${f.split ? 'on' : ''}">Dividir pago</button></div></div>
    <div data-splitbody style="${f.split ? '' : 'display:none'}"><div class="payhead"><span>Forma de pago</span><span>Monto</span><span>TXN</span><span></span></div><div data-splitlines>${(f.payments || []).map(splitLine).join('')}</div>
      <div class="chips" style="margin-top:6px;align-items:center"><button type="button" class="btn sm" data-splitadd>${ic('plus')}Otra forma de pago</button><span class="splitleft" data-splitleft></span></div></div></div>`;
  return h.replace(/(<label class="field">TXN:<input name="txn"[^>]*><\/label>)/, '$1' + block);
};
Views.nueva.receipt = function () {
  let h = _nvReceiptP.call(this); const f = this.form;
  if (f && f.split && (f.payments || []).length) {
    const lines = f.payments.filter(p => p.method || num(p.amount)).map(p => `<div class="rline"><span>· ${esc(p.method || 'Sin forma')}</span><span>${money(num(p.amount), 1)}</span></div>`).join('');
    h = h.replace('<p class="formula">', `<div class="rline total"><span>Pago dividido</span><span>${money(r2(f.payments.reduce((t, p) => t + num(p.amount), 0)), 1)}</span></div>${lines}<p class="formula">`);
  }
  return h;
};
Views.nueva.mount = function (root) {
  _nvMountP.call(this, root);
  const form = $('[data-form]', root), box = $('[data-split]', root); if (!form || !box) return;
  const f = this.form;
  const repaint = () => { const rec = $('[data-receipt]', root); if (rec) rec.innerHTML = this.receipt(); };
  const left = () => { const el = $('[data-splitleft]', root); if (!el) return; const due = cobroDue(f), got = r2((f.payments || []).reduce((t, p) => t + num(p.amount), 0)), d = r2(due - got);
    el.innerHTML = Math.abs(d) < 0.01 ? `<span style="color:var(--ok);font-weight:700">✓ Cuadra con lo que se cobra hoy (${money(due, 1)})</span>` : d > 0 ? `Falta asignar <b>${money(d, 1)}</b> de ${money(due, 1)}` : `<span style="color:var(--bad)">Sobran <b>${money(-d, 1)}</b> (se cobra ${money(due, 1)})</span>`; };
  const draw = () => { $('[data-splitlines]', root).innerHTML = (f.payments || []).map(splitLine).join(''); left(); repaint(); };
  $$('[data-splitbtn]', root).forEach(b => b.onclick = () => {
    if ((b.dataset.mode === 'split') === !!f.split) return;
    f.split = !f.split;
    if (f.split && !(f.payments || []).length) { const due = cobroDue(f); f.payments = [{ method: 'Efectivo', amount: '', txn: '' }, { method: f.method && f.method !== 'Efectivo' ? f.method : '', amount: due, txn: f.txn || '', auto: true }]; }
    if (!f.split) { const first = (f.payments || [])[0]; if (first && first.method && payMethodsAll().includes(first.method)) { f.method = first.method; if (form.method) form.method.value = first.method; } f.payments = []; }
    UI.formDirty = true; UI.render();
  });
  if (!f.split) return;
  const lines = $('[data-splitlines]', root);
  const upd = e => { const l = e.target.closest('[data-pl2]'), k = e.target.dataset.p2; if (!l || !k || k === 'rm') return; const i = +l.dataset.pl2; f.payments[i][k] = e.target.value; UI.formDirty = true;
    if (k === 'amount') { f.payments[i].auto = false; if (f.payments.length === 2) { const j = 1 - i, o = f.payments[j]; if (o.auto !== false) { o.amount = r2(Math.max(0, cobroDue(f) - num(f.payments[i].amount))) || ''; const el = $(`[data-pl2="${j}"] [data-p2=amount]`, root); if (el) el.value = o.amount; } } }
    left(); repaint(); };
  lines.addEventListener('input', upd); lines.addEventListener('change', upd);
  lines.addEventListener('click', e => { if (e.target.closest('[data-p2=rm]')) { f.payments.splice(+e.target.closest('[data-pl2]').dataset.pl2, 1); draw(); } });
  $('[data-splitadd]', root).onclick = () => { f.payments.forEach(p => { p.auto = false; }); const due = cobroDue(f), got = f.payments.reduce((t, p) => t + num(p.amount), 0); f.payments.push({ method: '', amount: due - got > 0 ? r2(due - got) : '', txn: '' }); draw(); };
  form.addEventListener('input', e => { if (['price', 'discount', 'tip'].includes(e.target.name)) left(); });
  if (form.method) { form.method.closest('label').classList.add('muted-field'); form.method.disabled = true; }
  if (form.txn) { form.txn.closest('label').classList.add('muted-field'); form.txn.disabled = true; }
  left();
  const orig = form.onsubmit;
  form.onsubmit = async e => {
    e.preventDefault();
    const ps = (f.payments || []).filter(p => p.method || num(p.amount) > 0);
    if (ps.length < 2) { UI.toast('Para dividir el pago agrega al menos dos formas de pago, o toca “Pagar con una sola forma”.', true); return; }
    if (ps.some(p => !p.method)) { UI.toast('Elige la forma de pago de cada parte.', true); return; }
    if (ps.some(p => !(num(p.amount) > 0))) { UI.toast('Cada parte debe tener un monto mayor a 0.', true); return; }
    const due = cobroDue(f), got = r2(ps.reduce((t, p) => t + num(p.amount), 0));
    if (Math.abs(got - due) >= 0.01) { UI.toast(`Las partes suman ${money(got, 1)} y se cobra ${money(due, 1)}. Ajusta los montos.`, true); return; }
    f.payments = ps.map(p => ({ method: p.method, amount: r2(p.amount), txn: String(p.txn || '').trim() }));
    f.method = [...new Set(f.payments.map(p => p.method))].join(' + '); f.txn = f.payments.map(p => p.txn).filter(Boolean).join(' · ');
    return orig(e);
  };
};

/* =========================================================
   IMPRIMIR / DESCARGAR para recepción:
   - Agenda del día (o próximos 14 días) con cobros: para cotejar en Excel.
   - Productos e insumos del día: lo que salió del inventario (ventas a clientas,
     entregas a lashistas) y lo que entró, para capturarlo en Clover.
   ========================================================= */

/* =========================================================

   ========================================================= */
const SplitPay = {
  methods: () => payMethodsAll(),
  html(st) {
    return `<div class="full splitbox ${st.split ? 'on' : ''}" data-sp>
      <div class="splitswitch"><span>¿Cómo pagó?</span><div class="segmented small"><button type="button" data-spm="one" class="${st.split ? '' : 'on'}">Un solo método</button><button type="button" data-spm="split" class="${st.split ? 'on' : ''}">Dividir pago</button></div></div>
      <div data-spbody style="${st.split ? '' : 'display:none'}"><div class="payhead"><span>Forma de pago</span><span>Monto</span><span>TXN</span><span></span></div><div data-splines></div>
        <div class="chips" style="margin-top:6px;align-items:center"><button type="button" class="btn sm" data-spadd>${ic('plus')}Otra forma de pago</button><span class="splitleft" data-spleft></span></div></div></div>`;
  },
  line: (p, k) => `<div class="payline" data-spl="${k}"><select class="inp" data-spk="method" aria-label="Forma de pago"><option value="">Forma de pago</option>${SplitPay.methods().map(m => `<option ${p.method === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>
    <input class="inp num" type="number" min="0" step="0.01" data-spk="amount" value="${esc(p.amount)}" placeholder="Monto"><input class="inp" data-spk="txn" value="${esc(p.txn || '')}" placeholder="TXN" autocomplete="off"><button type="button" class="btn sm" data-spk="rm" aria-label="Quitar">×</button></div>`,
  start(st, due, current) { st.split = true; const d = r2(due()); st.payments = [{ method: 'Efectivo', amount: '', txn: '' }, { method: current && current !== 'Efectivo' ? current : '', amount: d || '', txn: '', auto: true }]; },
  // root: elemento que contiene el bloque; onToggle: cuando cambia entre un método / dividir; onChange: repintar totales
  mount(root, st, due, opts = {}) {
    const box = $('[data-sp]', root); if (!box) return;
    const lines = $('[data-splines]', box), left = $('[data-spleft]', box);
    const paintLeft = () => { const d = r2(due()), got = r2((st.payments || []).reduce((t, p) => t + num(p.amount), 0)), diff = r2(d - got);
      left.innerHTML = Math.abs(diff) < 0.01 ? `<span style="color:var(--ok);font-weight:700">✓ Cuadra (${money(d, 1)})</span>` : diff > 0 ? `Falta asignar <b>${money(diff, 1)}</b> de ${money(d, 1)}` : `<span style="color:var(--bad)">Sobran <b>${money(-diff, 1)}</b> (total ${money(d, 1)})</span>`; if (opts.onChange) opts.onChange(); };
    const draw = () => { lines.innerHTML = (st.payments || []).map(SplitPay.line).join(''); paintLeft(); };
    $$('[data-spm]', box).forEach(b => b.onclick = () => {
      const want = b.dataset.spm === 'split'; if (want === !!st.split) return;
      if (want) SplitPay.start(st, due, opts.current ? opts.current() : ''); else { st.split = false; st.payments = []; }
      box.classList.toggle('on', want); $$('[data-spm]', box).forEach(x => x.classList.toggle('on', x === b)); $('[data-spbody]', box).style.display = want ? '' : 'none';
      if (opts.onToggle) opts.onToggle(want); draw();
    });
    const upd = e => { const l = e.target.closest('[data-spl]'), k = e.target.dataset.spk; if (!l || !k || k === 'rm') return; const i = +l.dataset.spl, p = st.payments[i]; p[k] = e.target.value;
      if (k === 'amount') { p.auto = false; const others = st.payments.filter((x, j) => j !== i); if (st.payments.length === 2 && others[0].auto !== false) { others[0].amount = r2(Math.max(0, due() - num(p.amount))) || ''; const o = $(`[data-spl="${st.payments.indexOf(others[0])}"] [data-spk=amount]`, box); if (o) o.value = others[0].amount; } }
      paintLeft(); };
    lines.addEventListener('input', upd); lines.addEventListener('change', upd);
    lines.addEventListener('click', e => { if (e.target.closest('[data-spk=rm]')) { st.payments.splice(+e.target.closest('[data-spl]').dataset.spl, 1); draw(); } });
    $('[data-spadd]', box).onclick = () => { const got = st.payments.reduce((t, p) => t + num(p.amount), 0); st.payments.forEach(p => { p.auto = false; }); st.payments.push({ method: '', amount: r2(Math.max(0, due() - got)) || '', txn: '' }); draw(); };
    if (st.split) draw();
    SplitPay._paint = paintLeft;
  },
  check(st, due) {
    const ps = (st.payments || []).filter(p => p.method || num(p.amount) > 0);
    if (ps.length < 2) return { error: 'Para dividir el pago agrega al menos dos formas, o elige “Un solo método”.' };
    if (ps.some(p => !p.method)) return { error: 'Elige la forma de pago de cada parte.' };
    if (ps.some(p => !(num(p.amount) > 0))) return { error: 'Cada parte debe tener un monto mayor a 0.' };
    const d = r2(due()), got = r2(ps.reduce((t, p) => t + num(p.amount), 0));
    if (Math.abs(got - d) >= 0.01) return { error: `Las partes suman ${money(got, 1)} y el total es ${money(d, 1)}. Ajusta los montos.` };
    const payments = ps.map(p => ({ method: p.method, amount: r2(p.amount), txn: String(p.txn || '').trim() }));
    return { payments, method: [...new Set(payments.map(p => p.method))].join(' + '), txn: payments.map(p => p.txn).filter(Boolean).join(' · ') };
  },
};

      if (!n) return (err.textContent = 'Elige la nota.');
      if (num(st.amount) > n.pending + 0.005) return (err.textContent = `El pendiente de esta nota es ${money(n.pending, 1)}.`);
      const r = SplitPay.check(st, due); if (r.error) return (err.textContent = r.error);
      try { for (const p of r.payments) await Store.saveNotePayment({ noteId: n.id, invoice: n.invoice, artistId: n.artistId, artistName: n.artistName, amount: p.amount, date: st.date, method: p.method, txn: p.txn });
        this.st = { noteId: '', amount: '', date: st.date, method: '', txn: '' }; UI.toast(num(st.amount) >= n.pending - 0.005 ? 'Nota pagada' : 'Pago parcial registrado'); UI.render(); }
      catch (er) { err.textContent = 'No se pudo guardar: ' + (er.message || er.code); }
    };
  };
  // el botón "Pago de lashista" de la Hoja del día y del detalle de la nota abre esta misma pantalla
  notePaymentForm = noteId => { const n = noteId && Store.notes.find(x => x.id === noteId); LashPay.st = { noteId: noteId || '', amount: n ? n.pending : '', date: Dates.toISO(Dates.today()), method: '', txn: '' }; S.cobro.tipo = 'lashista'; UI.close && UI.close(); UI.go('nueva'); };
}

{

  return h.replace(/(<div class="tabs no-print" role="tablist">[\s\S]*?<\/div>)[\s\S]*$/, (m0, tabs) => tabs + body);
