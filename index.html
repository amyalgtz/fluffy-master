}

function productEditor(p) {
  editorModal(p ? 'Editar producto' : 'Agregar producto', [
    { name: 'code', label: 'Código', validate: v => !v.trim() ? 'Escribe el código.' : Store.config.products.some(x => x.code.toLowerCase() === v.trim().toLowerCase() && (!p || x.id !== p.id)) ? 'Ese código ya existe.' : '' },
    { name: 'name', label: 'Nombre del producto', validate: v => v.trim() ? '' : 'Escribe el nombre.' },
    { name: 'cost', label: 'Costo', type: 'number', step: '0.01', validate: v => v === '' || num(v) >= 0 ? '' : 'El costo no puede ser negativo.' },
    { name: 'priceArtist', label: 'Precio lashista', type: 'number', step: '0.01', validate: v => v !== '' && num(v) >= 0 ? '' : 'Escribe el precio para lashistas.' },
    { name: 'priceSalon', label: 'Precio salón (venta a clientas)', type: 'number', step: '0.01', validate: v => v === '' || num(v) >= 0 ? '' : 'El precio no puede ser negativo.' },
    { name: 'active', label: 'Estado', type: 'check', hint: 'Activo', full: 1 }],
    p ? { ...p, cost: p.cost == null ? '' : p.cost, priceSalon: p.priceSalon == null ? '' : p.priceSalon } : { active: true },
    async v => {
      const rec = { id: p ? p.id : 'p' + Date.now().toString(36), code: v.code.trim(), name: v.name.trim(), cost: v.cost === '' ? null : r2(v.cost), priceArtist: r2(v.priceArtist), priceSalon: v.priceSalon === '' ? null : r2(v.priceSalon), active: v.active };
      if (p && p.code !== rec.code && Store.allMoves().some(m => m.code === p.code)) throw new Error('Este producto ya tiene movimientos; no se puede cambiar su código.');
      await Store.saveConfig({ products: p ? Store.config.products.map(x => x.id === p.id ? rec : x) : Store.config.products.concat(rec) });
    });
}

function productSummary(from, to) {
  const inR = d => { const x = Dates.fromISO(d); return x != null && (from == null || x >= from) && (to == null || x <= to); };
  const moves = Store.moves.filter(m => inR(m.date));
  const salon = r2(moves.filter(m => m.type === 'Venta en salón').reduce((t, m) => t + m.qty * m.unitPrice, 0));
  const inv = r2(moves.filter(m => m.type === 'Compra').reduce((t, m) => t + m.qty * m.unitCost, 0));
  const notes = Store.appNotes.filter(n => NOTE_DEDUCTS.has(n.status) && inR(n.date || n.month + '-01'));
  const lash = r2(notes.reduce((t, n) => t + num(n.taxable), 0)), tax = r2(notes.reduce((t, n) => t + num(n.tax), 0));
  const due = r2(notes.filter(n => n.status === 'Enviada').reduce((t, n) => t + num(n.total), 0));
  return { salon, lash, venta: r2(salon + lash), inv, fondo: r2(salon + lash - inv), tax, due };
}

/* =========================================================
   GASTOS — subir una hoja de Excel (o CSV) para registrar muchos gastos a la vez.
   Nothing is saved until the preview is reviewed; invalid rows are never inserted.
   ========================================================= */
const EXP_HEADERS = {
  date: ['fecha', 'date', 'dia', 'día'],
  description: ['detalle', 'descripcion', 'descripción', 'concepto', 'description', 'nombre'],
  amount: ['valor', 'monto', 'importe', 'cantidad', 'amount', 'total', 'precio'],
  category: ['categoria', 'categoría', 'category', 'tipo'],
  comments: ['comentarios', 'comentario', 'notas', 'nota', 'comments', 'observaciones'],
};
const normH = s => String(s == null ? '' : s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z ]/g, '').trim();

const ExpenseImport = {
  parseDate(v) {
    if (v instanceof Date && !isNaN(v)) return Math.floor(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()) / 864e5);
    if (typeof v === 'number' && v > 20000 && v < 80000) return Math.round(v) - 25569; // Excel serial date
    const s = String(v == null ? '' : v).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return Dates.fromISO(`${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`);
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); // MM/DD/YYYY, como la hoja principal
    if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; if (+m[1] > 12) return null; return Dates.fromISO(`${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`); }
    return null;
  },
  parseAmount(v) { if (typeof v === 'number') return v; const s = String(v == null ? '' : v).replace(/[$,\s]/g, ''); return s === '' ? null : (isFinite(+s) ? +s : NaN); },
  read(file) {
    return new Promise((res, rej) => {
      if (!window.XLSX) return rej(new Error('El lector de Excel no cargó. Intenta de nuevo en un momento.'));
      const fr = new FileReader();
      fr.onload = () => { try { res(XLSX.read(new Uint8Array(fr.result), { type: 'array', cellDates: true })); } catch (e) { rej(new Error('No se pudo leer el archivo. ¿Es un Excel o CSV válido?')); } };
      fr.onerror = () => rej(new Error('No se pudo leer el archivo.'));
      fr.readAsArrayBuffer(file);
    });
  },
  analyze(wb, createCats) {
    const name = wb.SheetNames.find(n => normH(n) === 'gastos') || wb.SheetNames[0];
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null });
    let hr = -1, map = {};
    for (let i = 0; i < Math.min(15, aoa.length) && hr < 0; i++) {

      if (m.date != null && m.amount != null) { hr = i; map = m; }
    }
    if (hr < 0) return { error: `No encontré las columnas Fecha y Monto (o VALOR) en la hoja "${name}". Descarga la plantilla para ver el formato.` };
    const cats = new Map(Store.config.categories.map(c => [c.toLowerCase(), c]));
    const existing = new Set(Store.expenses.map(e => `${e.day}|${r2(e.amount)}|${String(e.description).trim().toLowerCase()}`));
    const seen = new Set(), rows = [], newCats = new Set();
    aoa.slice(hr + 1).forEach((r, k) => {
      const get = key => map[key] == null ? null : r[map[key]];
      if (!r || r.every(v => v == null || String(v).trim() === '')) return;
      const rowNo = hr + 2 + k, out = { rowNo, raw: r, errors: [] };
      out.day = ExpenseImport.parseDate(get('date'));
      out.amount = ExpenseImport.parseAmount(get('amount'));
      out.description = String(get('description') == null ? '' : get('description')).trim();
      out.comments = String(get('comments') == null ? '' : get('comments')).trim();
      const rc = String(get('category') == null ? '' : get('category')).trim();
      if (out.day == null) out.errors.push('Fecha no válida');
      if (out.amount == null || isNaN(out.amount)) out.errors.push('Monto vacío o no numérico');
      else if (out.amount < 0) out.errors.push('Monto negativo (si es ingreso, como renta de cabina, va en Configuración → Rentas)');
      else if (out.amount === 0) out.errors.push('Monto en $0');
      if (!out.description) out.errors.push('Falta el detalle');
      if (!rc) out.category = cats.get('sin categoría') || 'Sin categoría';
      else if (cats.has(rc.toLowerCase())) out.category = cats.get(rc.toLowerCase());
      else if (createCats) { out.category = rc; newCats.add(rc); }
      else out.errors.push(`Categoría "${rc}" no existe`);
      if (!out.errors.length) {
        const key = `${out.day}|${r2(out.amount)}|${out.description.toLowerCase()}`;
        if (existing.has(key)) out.dup = 'Ya existe en Gastos'; else if (seen.has(key)) out.dup = 'Repetido en el archivo';
        seen.add(key);
      }
      out.status = out.errors.length ? 'error' : out.dup ? 'dup' : 'ok';
      rows.push(out);

    return { sheet: name, rows, newCats: [...newCats], map };

/* =========================================================
   CLAVES Y BITÁCORA — editing or deleting an expense asks for a personal clave,
   and every change is written to auditLogs with who, when, before and after.
   Claves are stored as salted SHA-256 hashes. This identifies people; it is not
   bank-grade security (anyone with edit access to this page can reach the data).
   ========================================================= */
const Claves = {
  async hash(salt, clave) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + clave));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  },
  salt() { const a = new Uint8Array(12); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, '0')).join(''); },
  active() { return (Store.editors || []).filter(e => e.active !== false); },
  async find(clave) { for (const e of Claves.active()) if (e.hash === await Claves.hash(e.salt, clave)) return e; return null; },
  /* Second-layer prompt so the form underneath stays open. Resolves the editor or null. */
  ask(title, opts = {}) {
    return new Promise(res => {
      if (!Claves.active().length) {
        UI.toast('Primero crea las claves de edición en Configuración.', true); return res(null);
      }
      const host = document.createElement('div'); host.className = 'modal-bg layer2';
      host.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:400px"><h3>${esc(title)}</h3>
        <p style="color:var(--muted);margin:0 0 12px">${esc(opts.hint || 'Escribe tu clave. El cambio quedará registrado a tu nombre.')}</p>
        <label class="field">Clave<input type="password" inputmode="numeric" autocomplete="off" data-clave></label><p class="err" data-cerr style="color:var(--bad);font-size:13px;font-weight:600;min-height:18px"></p>
        <div class="acts"><button class="btn" data-x="no">Cancelar</button><button class="btn primary" data-x="ok">Confirmar</button></div></div>`;
      document.body.appendChild(host);
      const inp = $('[data-clave]', host), done = v => { host.remove(); res(v); };
      inp.focus();
      const go = async () => {
        const e = await Claves.find(inp.value.trim());
        if (!e) { $('[data-cerr]', host).textContent = 'Clave incorrecta.'; inp.select(); return; }
        if (opts.admin && e.role !== 'Admin') { $('[data-cerr]', host).textContent = 'Esta acción necesita una clave de administración.'; return; }
        done(e);
      };
      $('[data-x=ok]', host).onclick = go; inp.onkeydown = ev => { if (ev.key === 'Enter') go(); if (ev.key === 'Escape') done(null); };
      $('[data-x=no]', host).onclick = () => done(null);
    });
  },
  async saveList(list) { await Store.db.doc('security/editors').set({ list, updatedAt: new Date().toISOString() }); },
};

const Audit = {
  diff(before, after, fields) {
    return fields.filter(([k]) => String(before ? before[k] ?? '' : '') !== String(after ? after[k] ?? '' : '')).map(([k, l]) => ({ field: l, from: before ? before[k] ?? '' : '', to: after ? after[k] ?? '' : '' }));
  },
  async log(entry) {
    if (Store.dbState !== 'on') return;
    await Store.db.collection('auditLogs').doc().set({ ...entry, byUserId: await Store.who(), at: new Date().toISOString() });
  },
  forEntity(id) { return (Store.auditLogs || []).filter(a => a.entityId === id).sort((a, b) => b.at.localeCompare(a.at)); },
  line(a) {
    const when = new Date(a.at).toLocaleString('es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    const what = a.action === 'UPDATE' ? (a.changes || []).map(c => `${c.field}: ${c.from === '' ? '—' : c.from} → ${c.to === '' ? '—' : c.to}`).join(' · ') || 'Sin cambios de valor'
      : a.action === 'DELETE' ? 'Eliminó el gasto' : a.action === 'CREATE' ? 'Creó el gasto' : (a.detail || a.action);
    return { when, who: a.byName || 'Sin nombre', what };
  },
};
const EXP_FIELDS = [['date', 'Fecha'], ['description', 'Detalle'], ['amount', 'Monto'], ['category', 'Categoría'], ['comments', 'Comentarios']];

Store.editors = []; Store.auditLogs = [];
Store.connectHooks.push(db => {
  db.doc('security/editors').onSnapshot(s => { Store.editors = s.exists ? (s.data().list || []) : []; Store.invalidate(); }, () => {});
  db.collection('auditLogs').onSnapshot(s => { Store.auditLogs = s.docs.map(d => ({ id: d.id, ...d.data() })); Store.invalidate(); }, () => {});
});

const expAsDoc = e => e ? { date: Dates.toISO(e.day), description: e.description, amount: e.amount, category: e.category, comments: e.comments || '' } : null;
expenseModal = function (e) {
  const cats = Store.config.categories.includes(e ? e.category : '') || !e ? Store.config.categories : Store.config.categories.concat(e.category);
  editorModal(e ? 'Editar gasto' : 'Nuevo gasto', [
    { name: 'date', label: 'Fecha', type: 'date', validate: v => Dates.fromISO(v) != null ? '' : 'Escribe una fecha.' },
    { name: 'amount', label: 'Monto', type: 'number', step: '0.01', validate: v => v !== '' && num(v) > 0 ? '' : 'Escribe un monto mayor a 0.' },
    { name: 'description', label: 'Detalle', full: 1, validate: v => v.trim() ? '' : 'Describe el gasto.' },
    { name: 'category', label: 'Categoría', type: 'select', options: cats, full: 1 },
    { name: 'comments', label: 'Comentarios', full: 1 }],
    e ? expAsDoc(e) : { date: Dates.toISO(Dates.today()), category: cats[0] },
    async v => {
      let editor = null;
      if (e) {
        const ch = Audit.diff(expAsDoc(e), { ...v, amount: r2(v.amount) }, EXP_FIELDS);
        if (!ch.length) return;
        editor = await Claves.ask('Confirmar cambio', { hint: `Vas a cambiar: ${ch.map(c => c.field.toLowerCase()).join(', ')}. Escribe tu clave; el cambio quedará registrado a tu nombre.` });
        if (!editor) throw new Error('Cambio cancelado: falta la clave.');
        const r = await Store.saveExpense(v, e.id, editor);
        await Audit.log({ entity: 'EXPENSE', entityId: e.id, entityLabel: v.description, action: 'UPDATE', before: expAsDoc(e), after: { ...v, amount: r2(v.amount) }, changes: ch.map(c => ({ ...c, from: String(c.from), to: String(c.to) })), byName: editor.name, byEditorId: editor.id });
      } else {
        const r = await Store.saveExpense(v, null, null);
        await Audit.log({ entity: 'EXPENSE', entityId: r.id, entityLabel: v.description, action: 'CREATE', after: { ...v, amount: r2(v.amount) }, byName: '' });
      }
    });
};

      <label class="field">Clave nueva (4 a 8 dígitos)<input type="password" inputmode="numeric" data-p="c1"></label><label class="field">Repite la clave<input type="password" inputmode="numeric" data-p="c2"></label></div>

      <div class="acts"><button class="btn" data-x="no">Cancelar</button><button class="btn primary" data-x="ok">Guardar</button></div>`, m => {

/* =========================================================
   RECEPCIÓN — modo de pantalla para el front desk: cobrar, depósitos de clientas,
   cola de insumos de lashistas y notas del día. Cada acción queda a nombre de quien
   inició turno con su clave. Basado en el prototipo de recepción de Fluffy Co.
   ========================================================= */
const DEPOSIT_METHODS = ['Zelle', 'Cash App', 'Apple Cash', 'Venmo', 'PayPal', 'Tarjeta (Clover)', 'Efectivo', 'Otro'];
const RECEP_ROUTES = ['recepcion', 'nueva', 'dia', 'depositos', 'insumos'];

const Mode = {
  get reception() { try { return localStorage.getItem('fm-mode') === 'recepcion'; } catch (e) { return !!Mode._rec; } },
  set(on) { Mode._rec = on; try { on ? localStorage.setItem('fm-mode', 'recepcion') : localStorage.removeItem('fm-mode'); } catch (e) {} },
  operator: (() => { try { return JSON.parse(sessionStorage.getItem('fm-op')); } catch (e) { return null; } })(),
  setOperator(e) { Mode.operator = e ? { id: e.id, name: e.name, role: e.role } : null; try { e ? sessionStorage.setItem('fm-op', JSON.stringify(Mode.operator)) : sessionStorage.removeItem('fm-op'); } catch (_) {} },
  who() { return Mode.operator ? Mode.operator.name : 'Administración'; },
};

/* ---------- store ---------- */
Object.assign(Store, {
  deposits: [], requests: [], dayNotes: [],
  async saveDeposit(data, id) {
    if (!this.writable()) throw new Error('No tienes permiso para guardar en esta vista.');
    const now = new Date().toISOString(), prev = id ? this.deposits.find(d => d.id === id) : null;
    const doc = { ...(prev ? prev._raw : {}), ...data, updatedAt: now, updatedByName: Mode.who() };
    if (!prev) Object.assign(doc, { createdAt: now, createdByName: Mode.who(), outcome: '', history: [] });
    doc.history = (doc.history || []).concat(data._event ? [{ at: now, by: Mode.who(), what: data._event }] : []);
    delete doc._event;
    const ref = id ? this.db.doc('deposits/' + id) : this.db.collection('deposits').doc();
    await ref.set(doc); Store.upsertLocal('deposits', ref.id, doc, d => ({ ...d, day: Dates.fromISO(d.date) })); return ref.id;
  },
  upsertLocal(key, id, doc, extra) {
    const row = { id, ...doc, _raw: doc }, arr = this[key].filter(x => x.id !== id);
    arr.push(extra ? extra(row) : row); this[key] = arr; this.invalidate();
  },
  async saveRequest(data, id) {
    if (!this.writable()) throw new Error('No tienes permiso para guardar en esta vista.');
    const now = new Date().toISOString(), prev = id ? this.requests.find(r => r.id === id) : null;
    const doc = { ...(prev ? prev._raw : {}), ...data, updatedAt: now };
    if (!prev) Object.assign(doc, { createdAt: now, createdByName: Mode.who(), status: 'Pendiente' });
    const ref = id ? this.db.doc('supplyRequests/' + id) : this.db.collection('supplyRequests').doc();
    await ref.set(doc); Store.upsertLocal('requests', ref.id, doc); return ref.id;
  },
  requestMoves() {
    return this.requests.filter(r => r.deliveredAt).flatMap(r => r.items.filter(i => i.state === 'Entregado' && i.code).map(i => ({
      id: 'req-' + r.id + '-' + i.code, source: 'request', date: r.deliveredAt.slice(0, 10), type: 'Entrega a lashista', code: i.code, name: i.name, from: 'salon', to: null,
      qty: num(i.qty), notes: `${r.artistName} · entregó ${r.deliveredByName || ''}` })));
  },
});
const _allMoves = Store.allMoves.bind(Store);
Store.allMoves = function () { return _allMoves().concat(this.requestMoves()).sort((a, b) => (b.date || '').localeCompare(a.date || '')); };
Store.connectHooks.push(db => {
  const wrap = d => ({ id: d.id, ...d.data(), _raw: d.data() });
  db.collection('deposits').onSnapshot(s => { Store.deposits = s.docs.map(wrap).map(d => ({ ...d, day: Dates.fromISO(d.date) })); Store.invalidate(); }, () => {});
  db.collection('supplyRequests').onSnapshot(s => { Store.requests = s.docs.map(wrap); Store.invalidate(); }, () => {});
  db.collection('dayNotes').onSnapshot(s => { Store.dayNotes = s.docs.map(wrap); Store.invalidate(); }, () => {});
});

/* Sales: link / release the client's deposit. */
const _saveSale = Store.saveSale.bind(Store), _deleteSale = Store.deleteSale.bind(Store);
const releaseDeposit = (id, why) => { const d = Store.deposits.find(x => x.id === id); return d ? Store.saveDeposit({ outcome: '', saleId: '', _event: why }, id) : null; };
Store.saveSale = async function (form, id) {
  const prev = id ? this.appSales.find(s => s.id === id) : null, dep = form.depositId ? this.deposits.find(d => d.id === form.depositId) : null;
  const saleId = await _saveSale({ ...form, depositAmount: dep ? dep.amount : 0, depositMethod: dep ? dep.method : '', cashierName: Mode.operator ? Mode.operator.name : '' }, id);
  if (prev && prev.depositId && prev.depositId !== form.depositId) await releaseDeposit(prev.depositId, 'Se quitó de la venta');
  if (dep && dep.saleId !== saleId) await this.saveDeposit({ outcome: 'Aplicado', saleId, appliedAt: new Date().toISOString(), _event: `Aplicado a la venta de ${form.first || 'la clienta'}` }, dep.id);
  return saleId;
};
Store.deleteSale = async function (id) {
  const s = this.appSales.find(x => x.id === id);
  await _deleteSale(id);
  if (s && s.depositId) await releaseDeposit(s.depositId, 'Se eliminó la venta; el depósito vuelve a estar disponible');
};

/* =========================================================
   PAQUETES — sesiones pagadas por adelantado (combos).
   El pago entra el día que se vende el paquete; cada sesión se registra como venta
   el día que se usa (así la comisión y el tip llegan al payroll de quien la hizo),
   con método "Paquete prepagado" para no contarla dos veces en caja.
   ========================================================= */
const PKG_METHOD = 'Paquete prepagado';
Store.packages = [];
Store.connectHooks.push(db => db.collection('packages').onSnapshot(s => { Store.packages = s.docs.map(d => ({ id: d.id, ...d.data(), _raw: d.data(), day: Dates.fromISO(d.data().date) })); Store.invalidate(); }, () => {}));
Store.savePackage = async function (data, id) {
  if (!this.writable()) throw new Error('No tienes permiso para guardar en esta vista.');
  const now = new Date().toISOString(), prev = id ? this.packages.find(p => p.id === id) : null;
  const doc = { ...(prev ? prev._raw : {}), ...data, updatedAt: now, updatedByName: Mode.who() };
  if (!prev) Object.assign(doc, { createdAt: now, createdByName: Mode.who(), status: 'Activo', uses: [] });
  const ref = id ? this.db.doc('packages/' + id) : this.db.collection('packages').doc();
  await ref.set(doc); Store.upsertLocal('packages', ref.id, doc, x => ({ ...x, day: Dates.fromISO(x.date) })); return ref.id;
};

const Pkg = {
  used: p => (p.uses || []).length,
  left: p => num(p.sessions) - Pkg.used(p),
  // Session n (1-based): even split; the last session takes the rounding remainder so the sum equals what was paid.
  share(total, sessions, n) { const each = r2(num(total) / num(sessions)); return n < num(sessions) ? each : r2(num(total) - each * (num(sessions) - 1)); },
  session(p, n) {
    const paid = Pkg.share(p.total, p.sessions, n), tip = Pkg.share(p.tipTotal || 0, p.sessions, n), reg = num(p.regularPrice);
    return { paid, tip, price: Math.max(reg, paid), discount: r2(Math.max(0, reg - paid)) };
  },
  balance: p => p.status === 'Activo' ? r2(Array.from({ length: Pkg.left(p) }, (_, i) => Pkg.share(p.total, p.sessions, Pkg.used(p) + i + 1)).reduce((t, x) => t + x, 0)) : 0,
  client: p => title(((p.first || '') + ' ' + (p.last || '')).trim()),
  active: () => Store.packages.filter(p => p.status === 'Activo' && Pkg.left(p) > 0),
};

const SALE_HEADERS = {
  date: ['fecha', 'fecha mmddyyyy', 'date'],
  artist: ['column', 'lashista', 'asociada', 'name', 'nombre lashista', 'artista'],
  service: ['servicio', 'service'],

const normS = s => String(s == null ? '' : s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();

const SaleImport = {
  findSheet(wb) {
    const named = wb.SheetNames.filter(n => /hoja principal/i.test(n)).sort().reverse();
    return named[0] || wb.SheetNames[0];
  },
  analyze(wb, sheet, from, to) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { header: 1, raw: true, defval: null });
    let hr = -1, map = {};
    for (let i = 0; i < Math.min(15, aoa.length) && hr < 0; i++) {
      const m = {};
      (aoa[i] || []).forEach((h, j) => { const n = normS(h); for (const [k, list] of Object.entries(SALE_HEADERS)) if (m[k] == null && list.some(x => n === x || (k === 'date' && n.startsWith('fecha')) || (k === 'artist' && /^column \d+$/.test(n) && j === 1))) m[k] = j; });
      if (m.date != null && m.service != null && m.price != null) { hr = i; map = m; }
    }
    if (hr < 0) return { error: `No encontré las columnas Fecha, Servicio y Precio en la hoja "${sheet}".` };
    if (map.artist == null) map.artist = 1;
    const artists = Store.config.artists, services = Store.config.services;
    const findA = n => { const k = String(n || '').trim().toLowerCase(); return k && artists.find(a => a.name.toLowerCase() === k || (a.code && a.code.toLowerCase() === k)); };
    const findS = n => { const k = String(n || '').trim().toLowerCase(); return k && services.find(s => s.name.trim().toLowerCase() === k); };
    const key = (day, aid, svc, price, tip, f, l) => [day, aid, String(svc).trim().toLowerCase(), r2(price), r2(tip), String(f || '').trim().toLowerCase(), String(l || '').trim().toLowerCase()].join('|');
    const existing = new Set(Store.sales.map(s => key(s.day, s.artistKey, s.service, s.price, s.tip, s.first, s.last)));
    const seen = new Set(), rows = []; let outside = 0;
    aoa.slice(hr + 1).forEach((r, k) => {
      const g = c => map[c] == null ? null : r[map[c]];
      if (!r || [g('date'), g('artist'), g('service'), g('price')].every(v => v == null || String(v).trim() === '')) return;
      const day = ExpenseImport.parseDate(g('date'));
      if (day != null && (day < from || day > to)) { outside++; return; }
      const o = { rowNo: hr + 2 + k, day, errors: [], warn: [] };
      const a = findA(g('artist')), s = findS(g('service'));
      o.artistName = String(g('artist') || '').trim(); o.serviceName = String(g('service') || '').trim();
      o.price = ExpenseImport.parseAmount(g('price')); o.discount = ExpenseImport.parseAmount(g('discount')) || 0; o.tip = ExpenseImport.parseAmount(g('tip')) || 0;

      if (day == null) o.errors.push('Fecha no válida');

      if (!s) o.errors.push(o.serviceName ? `Servicio "${o.serviceName}" no existe` : 'Falta el servicio');
      if (o.price == null || isNaN(o.price) || o.price < 0) o.errors.push('Precio vacío o no válido');
      if (isNaN(o.discount) || o.discount < 0 || o.discount > (o.price || 0)) o.errors.push('Descuento no válido');
      if (isNaN(o.tip) || o.tip < 0) o.errors.push('Tip no válido');
      if (a) { o.artistId = a.id; o.artistName = a.name; o.calc = r2(a.rate * ((o.price || 0) - (o.discount || 0))); }
      if (s) { o.serviceId = s.id; o.serviceName = s.name; }
      if (a && exc != null && !isNaN(exc) && Math.abs(r2(exc) - o.calc) > 0.005) { o.manual = r2(exc); o.warn.push(`Comisión del Excel ${money(exc, 1)} (la fórmula da ${money(o.calc, 1)})`); }
      if (!o.errors.length) {
        const kk = key(day, o.artistId, o.serviceName, o.price, o.tip, o.first, o.last);

ExpenseImport._analyze = ExpenseImport.analyze;

  const r = ExpenseImport._analyze(wb, createCats), m = $('.modal');
  const f = m && $('[data-efrom]', m) ? Dates.fromISO($('[data-efrom]', m).value) : null, t = m && $('[data-eto]', m) ? Dates.fromISO($('[data-eto]', m).value) : null;
  if (r.error || f == null || t == null) return r;

};

const _nvHtmlX = Views.nueva.html, _nvMountX = Views.nueva.mount, _nvReceiptX = Views.nueva.receipt;
const extraLine = (x, k) => `<div class="xline" data-xl="${k}">

Views.nueva.html = function () {
  const h = _nvHtmlX.call(this);

  const f = this.form; f.extras = f.extras || [];
  const block = `<div class="full xbox"><div class="xhead"><b>Otros servicios en este cobro</b><span class="mutedc">Si se agregó un servicio, o una lashista hizo una parte.</span></div>
    <div data-xlines>${f.extras.map(extraLine).join('')}</div><button type="button" class="btn sm" data-xadd>${ic('plus')}Agregar otro servicio</button></div>`;
  return h.replace('<label class="field full">Comentarios', block + '<label class="field full">Comentarios');
};
Views.nueva.receipt = function () {
  let h = _nvReceiptX.call(this);
  const f = this.form, xs = (f.extras || []).filter(x => x.serviceId);
  if (!xs.length) return h;
  const svc = id => Store.config.services.find(s => s.id === id) || {}, art = id => Store.config.artists.find(a => a.id === id) || {};
  const net = x => r2(num(x.price) - num(x.discount)), extra = r2(xs.reduce((t, x) => t + net(x), 0));
  const main = r2(num(f.price) - num(f.discount) + num(f.tip));
  const lines = xs.map(x => `<div class="rline"><span>+ ${esc(svc(x.serviceId).name || '')}${x.artistId && x.artistId !== f.artistId ? ' · ' + esc(art(x.artistId).name || '') : ''}</span><span>${money(net(x), 1)}</span></div>`).join('');
  h = h.replace(/<div class="rline total big"><span>Total cobrado<\/span><span>[^<]*<\/span><\/div>/, lines + `<div class="rline total big"><span>Total cobrado</span><span>${money(r2(main + extra), 1)}</span></div>`);
  h = h.replace(/(<span>Por cobrar hoy<\/span><span>)([^<]*)/, (m0, a, v) => a + money(r2(num(String(v).replace(/[$,]/g, '')) + extra), 1));
  if (!Mode.reception) { const com = r2(xs.reduce((t, x) => t + num(art(x.artistId).rate) * net(x), 0)); h = h.replace('<p class="formula">', `<div class="rline"><span>Comisión de los servicios adicionales</span><span>${money(com, 1)}</span></div><p class="formula">`); }

};
Views.nueva.mount = function (root) {
  _nvMountX.call(this, root);

  const f = this.form, form = $('[data-form]', root); if (!form) return;
  const repaint = () => { const rec = $('[data-receipt]', root); if (rec) rec.innerHTML = this.receipt(); };
  const draw = () => { $('[data-xlines]', root).innerHTML = f.extras.map(extraLine).join(''); repaint(); };
  $('[data-xadd]', root).onclick = () => { f.extras.push({ serviceId: '', artistId: f.artistId || '', price: '', discount: '' }); UI.formDirty = true; draw(); };
  const lines = $('[data-xlines]', root);
  const onX = e => {
    const l = e.target.closest('[data-xl]'), k = e.target.dataset.x2; if (!l || !k || k === 'rm') return;
    const x = f.extras[+l.dataset.xl]; x[k] = e.target.value; UI.formDirty = true;

const _saveSaleX = Store.saveSale;
Store.saveSale = async function (form, id) {
  const extras = !id && !form._isExtra ? (form.extras || []).filter(x => x.serviceId) : [];
  const saleId = await _saveSaleX.call(this, { ...form, extras: undefined }, id);
  if (extras.length) {
    const ids = [];
    for (const x of extras) {
      ids.push(await _saveSaleX.call(this, { date: form.date, artistId: x.artistId, serviceId: x.serviceId, price: x.price, discount: x.discount || 0, tip: 0, method: form.method === 'Paquete prepagado' ? '' : form.method,
        first: form.first, last: form.last, comments: 'Servicio adicional en el mismo cobro', manualOn: false, manualCommission: '', _isExtra: true }, null));
    }
    if (form._appt) { const ap = this.appointments.find(a => a.id === form._appt); if (ap) await this.saveAppointment({ extraSaleIds: (ap.extraSaleIds || []).concat(ids) }, ap.id); }
  }
  if (form._appt && !id) {
    const ap = this.appointments.find(a => a.id === form._appt);
    if (ap && form.serviceId && form.serviceId !== ap.serviceId) { const s = this.config.services.find(x => x.id === form.serviceId); if (s) await this.saveAppointment({ scheduledServiceName: ap.scheduledServiceName || ap.serviceName, serviceId: s.id, serviceName: s.name, price: s.price }, ap.id); }
  }
  return saleId;
};

    if (u.active !== false && !await UI.confirm('Quitar acceso', `${esc(u.name)} ya no podrá entrar a Fluffy Master.`, 'Quitar acceso')) return;
    const { error } = await FM.sb.from('members').update({ active: u.active === false }).eq('email', u.email); if (error) return UI.toast(error.message, true); reload(); });
};

/* Con login personal, el turno y el nombre en cada registro salen del usuario conectado.
   En un iPad con una cuenta compartida, "Cambiar de turno" sigue pidiendo la clave de cada persona. */
Mode.who = function () { return Mode.operator ? Mode.operator.name : (FM.member ? FM.member.name : 'Administración'); };
const _renderWeb = UI.render;
UI.render = function () {
  if (Mode.reception && !Mode.operator && FM.member && !FM._askShift) Mode.setOperator({ id: 'm-' + FM.member.email, name: FM.member.name, role: FM.member.role });
  _renderWeb();
};
document.addEventListener('click', e => { if (e.target.closest('[data-rec-shift]')) FM._askShift = true; }, true);

/* Respaldo completo descargable (los proyectos gratuitos de Supabase no tienen respaldos automáticos). */
const _cfgHtmlB = Views.config.html, _cfgMountB = Views.config.mount;
Views.config.html = function () {
  const h = _cfgHtmlB.call(this);
  if (FM.member.role !== 'admin') return h;
  return h + `<section class="panel"><h2>Respaldo</h2><p class="hint">Descarga todo lo registrado en la app. Guárdalo en un lugar seguro (por ejemplo, Google Drive) al menos una vez por semana. Con este archivo y el histórico se puede volver a cargar todo en otro proyecto.</p>
    <div class="chips"><button class="btn primary" data-bk="datos">${ic('dl')}Respaldo de datos (JSON)</button><button class="btn" data-bk="excel">${ic('dl')}Ventas y gastos (Excel)</button><button class="btn" data-bk="hist">${ic('dl')}Histórico del Excel (JSON)</button></div></section>`;
};
Views.config.mount = function (root) {
  _cfgMountB.call(this, root);
  const stamp = Dates.toISO(Dates.today()), dl = async (name, data) => (await window.claude.use('downloads')).save({ filename: name, data });
  $$('[data-bk]', root).forEach(b => b.onclick = () => {
    const k = b.dataset.bk;
    if (k === 'datos') { const out = []; FM.cache.forEach((m, col) => { if (col !== 'historico') m.forEach((data, id) => out.push({ collection: col, id, data })); }); dl(`fluffy-master-respaldo-${stamp}.json`, JSON.stringify(out)); }
    if (k === 'hist') dl(`historico-${stamp}.json`, JSON.stringify({ DATA, PERF }));
    if (k === 'excel') {
      if (!window.XLSX) return UI.toast('El módulo de Excel no cargó.', true);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(salesRows(Store.sales.slice().sort((a, b) => a.day - b.day))), 'Ventas');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Fecha', 'Detalle', 'Monto', 'Categoría', 'Comentarios', 'Origen']].concat(Store.expenses.slice().sort((a, b) => a.day - b.day).map(e => [Dates.toISO(e.day), e.description, e.amount, e.category, e.comments, e.source === 'excel' ? e.id : 'App']))), 'Gastos');
      dl(`fluffy-master-ventas-gastos-${stamp}.xlsx`, new Blob([XLSX.write(wb, { type: 'array', bookType: 'xlsx' })]));
    }
  });
};

window.FM_BOOT = function () {
/* ---------- boot ---------- */
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.click')) e.target.click(); });
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); UI.go(g.dataset.go); return; }
  if (e.target.closest('[data-theme-toggle]')) {
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('fm-theme', r.dataset.theme); } catch (er) {}
  }
});
try { const t = localStorage.getItem('fm-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
Store.loadHistory();
let pending = null;
Store.onChange(() => {
  if (UI.route === 'nueva' && UI.formDirty) { UI.renderNav(); return; }
  if ($('#overlay').innerHTML) { UI.stale = true; UI.renderNav(); return; }
  clearTimeout(pending); pending = setTimeout(() => UI.render(), 30);
});
UI.render();
Store.connect();

};

</script>
</body>
</html>
