<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de lashistas · Fluffy Lashes</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<script src="vendor/supabase-2.117.1.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--blush:#FCF3F2;--pink:#F4C2C2;--pink-deep:#C9787E;--gold:#D4AF37;--ink:#3A2A2E;--muted:#6E5960;--line:#EFE4DF;--bad:#B3261E;--ok:#2E7D4F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1B1416;--card:#211A1C;--blush:#251C1F;--pink:#E3A9AC;--pink-deep:#E9A3A9;--gold:#D4AF37;--ink:#F6ECEC;--muted:#C2AFB3;--line:#3A2E31;--bad:#FF8A80;--ok:#7BD3A0;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,"Helvetica Neue",Arial,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:22px 18px 120px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.brand img{height:64px;width:auto}@media (prefers-color-scheme:dark){.brand img{filter:invert(1) brightness(1.1)}}
h1{font-size:26px;margin:0}.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:8px 0 4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--pink);border-color:var(--pink);color:#3A2A2E}
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:6px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}.item small{color:var(--muted);display:block;font-size:12px}
.item.sel{background:var(--blush)}
.step{display:flex;align-items:center;gap:8px}.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.step b{min-width:22px;text-align:center}
.cat{padding:8px 14px;background:var(--blush);font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:999px;padding:15px 18px;font:inherit;font-weight:700;font-size:16px;background:#3A2A2E;color:#fff;cursor:pointer;box-shadow:0 0 0 3px rgba(212,175,55,.35)}
@media (prefers-color-scheme:dark){.btn{background:var(--pink);color:#3A2A2E}}
.btn:disabled{opacity:.5;cursor:default}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.count{font-size:13px;color:var(--muted);min-width:90px}
.err{color:var(--bad);font-weight:700;font-size:14px;min-height:20px;margin:10px 0 0}
.done{text-align:center;padding:40px 0}.done .ok{font-size:54px;color:var(--ok)}
.sum{text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:18px 0}
.sum div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.sum div:last-child{border-bottom:0}
.empty{color:var(--muted);padding:16px 14px}
.goal{border:1.5px solid var(--gold);border-radius:16px;padding:14px 16px;margin-top:12px;background:var(--blush)}.goal.done{border-color:var(--ok)}.goal .gtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700}.goal .gtop b{font-size:20px}.goal .gtop small{font-size:13px;color:var(--muted);font-weight:600}
.gbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 8px}.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-deep),var(--gold))}.goal.done .gbar i{background:var(--ok)}.goal p{margin:0 0 4px;font-size:15px}.goal small{color:var(--muted);font-size:12px}
.redit{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.rq.editing{border-color:var(--gold);background:var(--blush)}.rq.editing select,.rq.editing input{margin-bottom:4px}
.mhead{display:flex;flex-direction:column;gap:2px;margin:6px 0 10px;padding:10px 12px;border-radius:14px;background:var(--blush)}.mtabs{margin:12px 0 6px}.mtabs button{flex:1}
.mk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}.mkb{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--card)}.mkb span{font-size:12.5px;color:var(--muted);font-weight:600}.mkb b{font-size:20px}.mkb small{font-size:12px;color:var(--muted)}
.mkb.big{grid-column:1/-1;border:2px solid var(--gold)}.mkb.big b{font-size:28px}.mkb.cash{border-color:#2E7D4F}.mkb.warn{border-color:#C0392B}.mkb.warn b{color:#C0392B}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.mbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:block}.mbar i{display:block;height:100%;background:var(--pink-deep);border-radius:99px}.mbar.wide{margin:6px 0 8px}
.mcard .mtop{display:flex;justify-content:space-between;gap:10px;font-size:15px}.mcard .msub{font-size:13px;color:var(--muted);margin-top:3px}.mday{margin:14px 0 6px;font-size:15px}.mday small{font-weight:600;color:var(--muted);text-transform:none}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11.5px;color:var(--muted)}.mgrid b{display:block;font-size:13.5px;color:var(--ink)}.mnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.mnav input{width:auto;flex:1;min-width:140px}
.tg.no{background:#FDECEA;color:#C0392B;border-color:#F3B8B1}
.compose{margin-top:22px;border:1.5px solid var(--gold);border-radius:16px;padding:12px 14px}.compose h2{margin-top:0}.compose textarea{resize:vertical}.okmsg{color:var(--ok);font-weight:700;margin:0 0 6px}
.linkb{border:0;background:none;color:var(--pink-deep);font:inherit;font-size:12.5px;font-weight:700;padding:6px 0 0;cursor:pointer;text-decoration:underline}.ntxt{margin:4px 0;font-size:14px}.nreply{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--blush);font-size:13.5px}
.weeknav2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 4px;font-size:14px}.weeknav2 .chip:disabled{opacity:.4}
.tabs{display:flex;border:1.5px solid var(--gold);border-radius:999px;padding:3px;gap:3px;margin:0 0 16px}.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:10px 6px;border-radius:999px;cursor:pointer}.tabs button.on{background:var(--pink);color:#3A2A2E}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.kp div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kp span{display:block;font-size:12px;color:var(--muted);font-weight:700}.kp b{font-size:22px}
.rq{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}.rq h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;gap:8px}.rq small{color:var(--muted);font-weight:400}
.rq li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}.rq ul{list-style:none;margin:0;padding:0}
.tg{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}.tg.ok{color:var(--ok);border-color:var(--ok)}.tg.no{color:var(--bad);border-color:var(--bad)}.tg.pe{color:#9A6B00;border-color:#C9A227}
h2{font-size:17px;margin:22px 0 4px}
</style>
</head>
<body>
<main id="app"><p class="sub">Cargando…</p></main>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const cfg = window.FM_CONFIG || {}, app = $('#app');
  if (!cfg.url || !cfg.anonKey || /TU-PROYECTO|PEGA/.test(cfg.url + cfg.anonKey)) { app.innerHTML = '<p class="err">Falta configurar el sistema.</p>'; return; }
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: false } });
  const S = { artists: [], products: [], qty: {}, cat: '', q: '', artist: '', pin: '', note: '', sending: false, tab: 'pedir', mine: null, loading: false, week: null, wofs: 0, notes: null, cref: '' };
  try { S.artist = localStorage.getItem('fm-req-artist') || ''; } catch (e) {}
  const total = () => Object.values(S.qty).reduce((t, n) => t + n, 0);
  const header = `<div class="brand"><img src="logo-mark.png" alt="Fluffy Lashes"><div><h1>Portal de lashistas</h1><p class="sub">Fluffy Lashes · pide insumos, revisa tus solicitudes y tu semana.</p></div></div>`;

  const tabs = () => `<div class="tabs"><button data-t="pedir" class="${S.tab === 'pedir' ? 'on' : ''}">Pedir insumos</button><button data-t="mis" class="${S.tab === 'mis' ? 'on' : ''}">Mis solicitudes</button><button data-t="semana" class="${S.tab === 'semana' ? 'on' : ''}">Mi semana</button>${isMgr() ? `<button data-t="mgr" class="${S.tab === 'mgr' ? 'on' : ''}">★ Manager</button>` : ''}</div>`;
  const bindTabs = () => document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); if ((S.tab === 'mis' && !S.mine) || (S.tab === 'semana' && !S.week)) { const k = S.tab === 'mis' ? '#see' : '#seew', x = $(k); if (x && S.artist && /^\d{4,8}$/.test(S.pin)) x.click(); } });
  const isMgr = () => !!(S.artists.find(a => a.id === S.artist) || {}).manager;
  // al elegir el nombre, aparece (o se quita) la pestaña de manager
  document.addEventListener('change', e => { if (!e.target || e.target.id !== 'art') return; if (!S.artist) S.artist = e.target.value; const t = document.querySelector('.tabs:not(.mtabs)'); if (!t) return; const had = !!t.querySelector('[data-t=mgr]'); if (had !== isMgr()) { t.outerHTML = tabs(); bindTabs(); } });
  /* ---------- vista de manager (solo lectura) ---------- */
  S.mgr = { t: 'dia', day: null, dep: null, pay: null, date: '', wofs: 0, busy: false, err: '' };
  const M$ = v => '$' + Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const hm = iso => iso ? new Date(iso).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }) : '';
  const dayLabel = (iso, today) => { const d = new Date(iso + 'T12:00:00'), t = new Date(today + 'T12:00:00'), n = Math.round((d - t) / 864e5); if (n === 0) return 'Hoy'; if (n === 1) return 'Mañana'; if (n === -1) return 'Ayer'; const x = d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'short' }); return x.charAt(0).toUpperCase() + x.slice(1); };
  async function mgrLoad(kind) {
    const G = S.mgr; G.busy = true; G.err = ''; renderMgr();
    const fn = { dia: 'fm_mgr_day', dep: 'fm_mgr_deposits', pay: 'fm_mgr_payroll' }[kind], args = { p_artist: S.artist, p_pin: S.pin };
    if (kind === 'dia' && G.date) args.p_date = G.date; if (kind === 'pay') args.p_offset = G.wofs;
    const { data, error } = await sb.rpc(fn, args);
    G.busy = false;
    if (error || !data || !data.ok) { G.err = (data && data.error) || (error && /function/i.test(error.message) ? 'Esta vista todavía no está activada. Avísale a administración.' : 'No se pudo cargar. Intenta de nuevo.'); G[kind === 'dia' ? 'day' : kind] = null; return renderMgr(); }
    G[kind === 'dia' ? 'day' : kind] = data; if (kind === 'dia') G.date = data.date; renderMgr();
  }
  function mgrDay(d) {
    const t = d.totals, total = Number(t.net) + Number(t.tips) + Number(t.products), meth = Object.entries(d.methods || {});
    const cash = meth.filter(([k]) => /^efectivo/i.test(k)).reduce((a, [, v]) => a + Number(v), 0), tx = meth.filter(([k]) => !/^efectivo/i.test(k) && !/sin método/i.test(k)), none = meth.filter(([k]) => /sin método/i.test(k)).reduce((a, [, v]) => a + Number(v), 0);
    const max = Math.max(1, ...tx.map(([, v]) => Number(v)));
    return `<div class="mnav"><button class="chip ${d.date !== d.today ? '' : 'on'}" data-md="${d.today}">Hoy</button><button class="chip" data-md="prev">← Día anterior</button>${d.date !== d.today ? '<button class="chip" data-md="next">Día siguiente →</button>' : ''}<input type="date" id="mdate" value="${esc(d.date)}" max="${esc(d.today)}"></div>
      <h2 style="margin-top:6px">${esc(dayLabel(d.date, d.today))} · ${esc(fdate(d.date))}</h2>
      <div class="mk"><div class="mkb big"><span>Total del día</span><b>${M$(total)}</b></div><div class="mkb"><span>Servicios</span><b>${t.count}</b></div><div class="mkb"><span>Ventas</span><b>${M$(t.net)}</b></div><div class="mkb"><span>Tips</span><b>${M$(t.tips)}</b></div>${Number(t.products) ? `<div class="mkb"><span>Productos</span><b>${M$(t.products)}</b></div>` : ''}</div>
      <h2>Cómo se pagó</h2><div class="mk"><div class="mkb cash"><span>💵 Efectivo (en caja)</span><b>${M$(cash)}</b></div><div class="mkb"><span>💳 Transacciones</span><b>${M$(tx.reduce((a, [, v]) => a + Number(v), 0))}</b></div>${none ? `<div class="mkb warn"><span>⚠︎ Sin método</span><b>${M$(none)}</b></div>` : ''}</div>
      ${tx.map(([k, v]) => `<div class="mrow"><span>${esc(k)}</span><span class="mbar"><i style="width:${Math.round(Number(v) / max * 100)}%"></i></span><b>${M$(v)}</b></div>`).join('')}
      <h2>Servicios del día (${t.count})</h2>${d.rows.length ? d.rows.map(r => `<div class="rq mcard"><div class="mtop"><b>${esc(r.service)}</b><b>${M$(Number(r.net) + Number(r.tip))}</b></div>
        <div class="msub">${esc(hm(r.at))} · ${esc(r.artist || '')} · ${esc(r.client || 'Sin nombre')}</div>
        <div class="msub">${M$(r.net)}${Number(r.tip) ? ` + tip ${M$(r.tip)}` : ''}${Number(r.deposit) ? ` · depósito ${M$(r.deposit)}` : ''} <span class="tg ${/sin método/i.test(r.method) ? 'no' : 'ok'}">${esc(r.method)}</span></div></div>`).join('') : '<p class="sub">Todavía no hay servicios cobrados este día.</p>'}
      ${(d.products || []).length ? `<h2>Productos vendidos</h2>${d.products.map(x => `<div class="mrow"><span>${esc(x.name)} × ${Number(x.qty)}</span><span class="tg ok">${esc(x.method)}</span><b>${M$(x.amount)}</b></div>`).join('')}` : ''}`;
  }
  function mgrDep(d) {
    const groups = {}; d.upcoming.forEach(a => (groups[a.date] = groups[a.date] || []).push(a));
    const st = x => /verific/i.test(x) ? '<span class="tg ok">Verificado</span>' : x ? `<span class="tg pe">${esc(x)}</span>` : '<span class="tg pe">Por verificar</span>';
    const sum = l => l.reduce((a, x) => a + Number(x.amount || 0), 0);
    return `<div class="mk"><div class="mkb big"><span>Recibidos hoy</span><b>${M$(sum(d.received))}</b><small>${d.received.length} depósito${d.received.length === 1 ? '' : 's'}</small></div><div class="mkb"><span>Citas con depósito (14 días)</span><b>${d.upcoming.length}</b><small>${M$(sum(d.upcoming))}</small></div></div>
      <h2>Recibidos hoy</h2>${d.received.length ? d.received.map(x => `<div class="rq mcard"><div class="mtop"><b>${esc(x.client || 'Sin nombre')}</b><b>${M$(x.amount)}</b></div><div class="msub">${esc(x.method || '')} ${st(x.status)}${x.outcome ? ` · ${esc(x.outcome)}` : ''}</div></div>`).join('') : '<p class="sub">Hoy no se ha registrado ningún depósito.</p>'}
      <h2>Próximas citas con depósito</h2>${Object.keys(groups).length ? Object.entries(groups).map(([day, l]) => `<h3 class="mday">${esc(dayLabel(day, d.today))}${dayLabel(day, d.today).length < 8 ? ' · ' + esc(fdate(day)) : ''} <small>${l.length} · ${M$(sum(l))}</small></h3>${l.map(a => `<div class="rq mcard"><div class="mtop"><b>${esc(a.time || '')} · ${esc(a.client || '')}</b><b>${M$(a.amount)}</b></div><div class="msub">${esc(a.artist || '')} · ${esc(a.service || '')}</div><div class="msub">${esc(a.method || '')} ${st(a.depStatus)}${a.status === 'Pagada' ? ' <span class="tg ok">Ya pagó</span>' : ''}</div></div>`).join('')}`).join('') : '<p class="sub">No hay citas con depósito en los próximos 14 días.</p>'}`;
  }
  function mgrPay(d) {
    const t = d.totals, max = Math.max(1, ...d.rows.map(r => Number(r.pay)));
    return `<div class="weeknav2"><button class="chip" data-mw="-1" ${S.mgr.wofs <= -8 ? 'disabled' : ''}>← Anterior</button><b>${esc(fdate(d.weekStart))} – ${esc(fdate(d.weekEnd))}</b><button class="chip" data-mw="1" ${S.mgr.wofs >= 0 ? 'disabled' : ''}>Siguiente →</button></div>
      <div class="mk"><div class="mkb big"><span>Total a pagar</span><b>${M$(t.pay)}</b><small>comisiones ${M$(t.commission)} + tips ${M$(t.tips)}</small></div><div class="mkb"><span>Servicios</span><b>${t.count}</b></div><div class="mkb"><span>Ventas netas</span><b>${M$(t.net)}</b></div></div>
      <h2>Por lashista</h2>${d.rows.length ? d.rows.map(r => `<div class="rq mcard"><div class="mtop"><b>${esc(r.name)}</b><b>${M$(r.pay)}</b></div><span class="mbar wide"><i style="width:${Math.round(Number(r.pay) / max * 100)}%"></i></span>
        <div class="mgrid"><span>Servicios<b>${r.count}</b></span><span>Ventas<b>${M$(r.net)}</b></span><span>Comisión<b>${M$(r.commission)}</b></span><span>Tips<b>${M$(r.tips)}</b></span></div></div>`).join('') : '<p class="sub">Todavía no hay servicios esta semana.</p>'}
      <p class="sub" style="margin-top:10px">Solo para consulta. Los cambios se hacen en la app de administración.</p>`;
  }
  function renderMgr() {
    const G = S.mgr, data = G.t === 'dia' ? G.day : G[G.t], mgrs = S.artists.filter(a => a.manager);
    app.innerHTML = header + tabs() + `<div class="mhead"><b>★ Vista de manager</b><span class="sub">Solo consulta: no se puede cambiar nada desde aquí.</span></div>
      ${data || G.busy ? '' : `<label for="art">Tu nombre</label><select id="art">${mgrs.map(a => `<option value="${esc(a.id)}" ${S.artist === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
        <label for="pin">Tu clave</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" value="${esc(S.pin)}" placeholder="6 a 8 números"><button class="btn" id="mgo" style="width:100%;margin-top:10px">Entrar</button>`}
      <div class="tabs mtabs">${[['dia', 'Hoja del día'], ['dep', 'Depósitos'], ['pay', 'Payroll']].map(([k, l]) => `<button data-mt="${k}" class="${G.t === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <p class="err" id="err">${esc(G.err)}</p>
      ${G.busy ? '<p class="sub">Cargando…</p>' : data ? (G.t === 'dia' ? mgrDay(data) : G.t === 'dep' ? mgrDep(data) : mgrPay(data)) : ''}
      ${data && !G.busy ? '<button class="chip" id="mref" style="margin-top:14px">↻ Actualizar</button>' : ''}`;
    bindTabs();
    const go = $('#mgo'); if (go) go.onclick = () => { S.artist = $('#art').value; S.pin = $('#pin').value.trim(); if (!/^\d{6,8}$/.test(S.pin)) { G.err = 'Escribe tu clave (6 a 8 números).'; return renderMgr(); } mgrLoad(G.t); };
    const pin = $('#pin'); if (pin) pin.oninput = () => { S.pin = pin.value.trim(); };
    document.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => { G.t = b.dataset.mt; const has = G.t === 'dia' ? G.day : G[G.t]; if (!has && /^\d{6,8}$/.test(S.pin)) mgrLoad(G.t); else renderMgr(); });

        ${d === 'Pendiente' ? '<p class="sub" style="text-align:center;margin-top:6px">Administración va a revisar tu semana. Cuando esté lista, tu detalle aparecerá aquí abajo.</p>' : ''}
        ${d === 'Enviado' ? detailList(w) : ''}
        <h2>Tus otras metas</h2>${CHECKS.map(([k, ic, lab, txt]) => `<div class="rq"><h3><span>${ic} ${lab}</span>${chk((w.checks || {})[k])}</h3><small>${txt}</small></div>`).join('')}`;
    }
    app.innerHTML = header + tabs() + `<label for="art">Tu nombre</label><select id="art"><option value="">Elige tu nombre</option>${S.artists.map(a => `<option value="${esc(a.id)}" ${S.artist === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <label for="pin">Tu clave</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" value="${esc(S.pin)}" placeholder="La que te dio administración">
      <p class="err" id="err"></p><button class="btn" id="seew" style="width:100%" ${S.loading ? 'disabled' : ''}>${S.loading ? 'Cargando…' : w ? 'Actualizar' : 'Ver mi semana'}</button>${body}`;
    $('#art').onchange = e => { S.artist = e.target.value; S.week = null; try { localStorage.setItem('fm-req-artist', S.artist); } catch (x) {} renderWeek(); };
    $('#pin').oninput = e => { S.pin = e.target.value.replace(/\D/g, ''); e.target.value = S.pin; };
    if (w) { const opts = [`Semana ${fdate(w.weekStart)} – ${fdate(w.weekEnd)}`].concat((w.rows || []).map(r => fdate(r.date) + ' · ' + r.service + ' · ' + (r.client || '')));
      document.querySelector('#app').insertAdjacentHTML('beforeend', composer('semana', opts, ['Falta una clienta o servicio', 'Tip incorrecto', 'Servicio o precio incorrecto', 'Comisión incorrecta', 'Otro']) + notesList('semana')); bindComposer('semana', renderWeek); }
    $('#seew').onclick = loadWeek; bindTabs();
    document.querySelectorAll('[data-wk]').forEach(b => b.onclick = () => { S.wofs = Math.min(0, S.wofs + Number(b.dataset.wk)); loadWeek(); });
    const rq = $('#reqdet'); if (rq) rq.onclick = async () => {
      rq.disabled = true; rq.textContent = 'Enviando…';
      const { data, error } = await sb.rpc('fm_request_week_detail', { p_artist: S.artist, p_pin: S.pin, p_offset: S.wofs });
      if (error || !data || !data.ok) { rq.disabled = false; rq.textContent = 'Solicitar detalle de la semana'; $('#err').textContent = (data && data.error) || 'No se pudo enviar. Intenta de nuevo.'; return; }
      S.week.detail = 'Pendiente'; renderWeek();
    };
  }

  async function send() {
    const err = t => { $('#err').textContent = t; };
    if (!S.artist) return err('Elige tu nombre.');
    if (!/^\d{4,8}$/.test(S.pin)) return err('Escribe tu clave (4 a 8 números).');
    if (!total()) return err('Elige al menos un producto.');
    S.sending = true; render();
    const items = Object.entries(S.qty).map(([code, qty]) => ({ code, qty }));
    const { data, error } = await sb.rpc('fm_submit_supply_request', { p_artist: S.artist, p_pin: S.pin, p_items: items, p_note: S.note });
    S.sending = false;
    if (error || !data || !data.ok) { render(); return err((data && data.error) || 'No se pudo enviar. Revisa tu conexión e intenta de nuevo.'); }
    const name = (S.artists.find(a => a.id === S.artist) || {}).name || '', sent = items.map(i => ({ ...i, name: (S.products.find(p => p.code === i.code) || {}).name || i.code }));
    S.qty = {}; S.note = '';
    app.innerHTML = header + `<div class="done"><div class="ok">✓</div><h1>Solicitud enviada</h1><p class="sub">${esc(name)} · ${new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
      <div class="sum">${sent.map(i => `<div><span>${esc(i.name)}</span><b>× ${i.qty}</b></div>`).join('')}</div>
      <p class="sub">Recepción ya la tiene en la app. Se cobra en tu nota del mes, solo lo que te entreguen.</p></div>
      <div class="bar"><div class="in"><button class="btn" id="mine">Ver mis solicitudes</button><button class="btn ghost" id="again">Hacer otra solicitud</button></div></div>`;
    $('#again').onclick = render; $('#mine').onclick = () => { S.tab = 'mis'; S.mine = null; render(); const b = $('#see'); if (b && S.artist && S.pin) b.click(); };
  }

  sb.rpc('fm_public_form').then(({ data, error }) => {
    if (error || !data) { app.innerHTML = header + '<p class="err">No se pudo cargar la lista de productos. Intenta más tarde.</p>'; return; }
    S.artists = data.artists || []; S.products = data.products || [];
    if (!S.artists.length) { app.innerHTML = header + '<p class="err">Todavía no hay lashistas con clave. Pide a administración que te asigne una.</p>'; return; }
    if (!S.artists.some(a => a.id === S.artist)) S.artist = '';
    render();
  });
})();
</script>
</body>
</html>
