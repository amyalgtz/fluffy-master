<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de lashistas · Fluffy Lashes</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<script src="vendor/supabase-2.117.1.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--blush:#FCF3F2;--pink:#F4C2C2;--pink-deep:#C9787E;--gold:#D4AF37;--ink:#3A2A2E;--muted:#6E5960;--line:#EFE4DF;--bad:#B3261E;--ok:#2E7D4F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1B1416;--card:#211A1C;--blush:#251C1F;--pink:#E3A9AC;--pink-deep:#E9A3A9;--gold:#D4AF37;--ink:#F6ECEC;--muted:#C2AFB3;--line:#3A2E31;--bad:#FF8A80;--ok:#7BD3A0;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,"Helvetica Neue",Arial,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:22px 18px 120px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.brand img{height:64px;width:auto}@media (prefers-color-scheme:dark){.brand img{filter:invert(1) brightness(1.1)}}
h1{font-size:26px;margin:0}.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:8px 0 4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--pink);border-color:var(--pink);color:#3A2A2E}
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:6px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}.item small{color:var(--muted);display:block;font-size:12px}
.item.sel{background:var(--blush)}
.step{display:flex;align-items:center;gap:8px}.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.step b{min-width:22px;text-align:center}
.cat{padding:8px 14px;background:var(--blush);font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:999px;padding:15px 18px;font:inherit;font-weight:700;font-size:16px;background:#3A2A2E;color:#fff;cursor:pointer;box-shadow:0 0 0 3px rgba(212,175,55,.35)}
@media (prefers-color-scheme:dark){.btn{background:var(--pink);color:#3A2A2E}}
.btn:disabled{opacity:.5;cursor:default}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.count{font-size:13px;color:var(--muted);min-width:90px}
.err{color:var(--bad);font-weight:700;font-size:14px;min-height:20px;margin:10px 0 0}
.done{text-align:center;padding:40px 0}.done .ok{font-size:54px;color:var(--ok)}
.sum{text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:18px 0}
.sum div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.sum div:last-child{border-bottom:0}
.empty{color:var(--muted);padding:16px 14px}
.goal{border:1.5px solid var(--gold);border-radius:16px;padding:14px 16px;margin-top:12px;background:var(--blush)}.goal.done{border-color:var(--ok)}.goal .gtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700}.goal .gtop b{font-size:20px}.goal .gtop small{font-size:13px;color:var(--muted);font-weight:600}
.gbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 8px}.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-deep),var(--gold))}.goal.done .gbar i{background:var(--ok)}.goal p{margin:0 0 4px;font-size:15px}.goal small{color:var(--muted);font-size:12px}
.weeknav2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 4px;font-size:14px}.weeknav2 .chip:disabled{opacity:.4}
.tabs{display:flex;border:1.5px solid var(--gold);border-radius:999px;padding:3px;gap:3px;margin:0 0 16px}.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:10px 6px;border-radius:999px;cursor:pointer}.tabs button.on{background:var(--pink);color:#3A2A2E}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.kp div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kp span{display:block;font-size:12px;color:var(--muted);font-weight:700}.kp b{font-size:22px}
.rq{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}.rq h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;gap:8px}.rq small{color:var(--muted);font-weight:400}
.rq li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}.rq ul{list-style:none;margin:0;padding:0}
.tg{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}.tg.ok{color:var(--ok);border-color:var(--ok)}.tg.no{color:var(--bad);border-color:var(--bad)}.tg.pe{color:#9A6B00;border-color:#C9A227}
h2{font-size:17px;margin:22px 0 4px}
</style>
</head>
<body>
<main id="app"><p class="sub">Cargando…</p></main>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const cfg = window.FM_CONFIG || {}, app = $('#app');
  if (!cfg.url || !cfg.anonKey || /TU-PROYECTO|PEGA/.test(cfg.url + cfg.anonKey)) { app.innerHTML = '<p class="err">Falta configurar el sistema.</p>'; return; }
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: false } });
  const S = { artists: [], products: [], qty: {}, cat: '', q: '', artist: '', pin: '', note: '', sending: false, tab: 'pedir', mine: null, loading: false, week: null, wofs: 0 };
  try { S.artist = localStorage.getItem('fm-req-artist') || ''; } catch (e) {}
  const total = () => Object.values(S.qty).reduce((t, n) => t + n, 0);
  const header = `<div class="brand"><img src="logo-mark.png" alt="Fluffy Lashes"><div><h1>Portal de lashistas</h1><p class="sub">Fluffy Lashes · pide insumos, revisa tus solicitudes y tu semana.</p></div></div>`;

  const tabs = () => `<div class="tabs"><button data-t="pedir" class="${S.tab === 'pedir' ? 'on' : ''}">Pedir insumos</button><button data-t="mis" class="${S.tab === 'mis' ? 'on' : ''}">Mis solicitudes</button><button data-t="semana" class="${S.tab === 'semana' ? 'on' : ''}">Mi semana</button></div>`;
  const bindTabs = () => document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); if ((S.tab === 'mis' && !S.mine) || (S.tab === 'semana' && !S.week)) { const k = S.tab === 'mis' ? '#see' : '#seew', x = $(k); if (x && S.artist && /^\d{4,8}$/.test(S.pin)) x.click(); } });
  function render() {
    if (S.tab === 'mis') return renderMine();
    if (S.tab === 'semana') return renderWeek();
    const cats = [...new Set(S.products.map(p => p.category))];
    const q = S.q.trim().toLowerCase();
    const list = S.products.filter(p => (!S.cat || p.category === S.cat) && (!q || (p.name + ' ' + p.code).toLowerCase().includes(q)));
    let last = null;
    const rows = list.map(p => { const head = !S.cat && p.category !== last ? `<div class="cat">${esc(p.category)}</div>` : ''; last = p.category; const n = S.qty[p.code] || 0;
      return head + `<div class="item ${n ? 'sel' : ''}"><div>${esc(p.name)}<small>${esc(p.code)}</small></div><div class="step"><button type="button" data-m="${esc(p.code)}" aria-label="Menos">−</button><b>${n}</b><button type="button" data-p="${esc(p.code)}" aria-label="Más">+</button></div></div>`; }).join('');
    app.innerHTML = header + tabs() + `
      <label for="art">Tu nombre</label><select id="art"><option value="">Elige tu nombre</option>${S.artists.map(a => `<option value="${esc(a.id)}" ${S.artist === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <label for="pin">Tu clave</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" value="${esc(S.pin)}" placeholder="La que te dio administración">
      <label>¿Qué necesitas?</label><input id="q" type="search" placeholder="Buscar producto" value="${esc(S.q)}">
      <div class="chips"><button class="chip ${!S.cat ? 'on' : ''}" data-c="">Todos</button>${cats.map(c => `<button class="chip ${S.cat === c ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <div class="list">${rows || '<div class="empty">No hay productos con ese nombre.</div>'}</div>
      <label for="note">Nota (opcional)</label><textarea id="note" rows="2" maxlength="300" placeholder="Ej. lo necesito para el viernes">${esc(S.note)}</textarea>
      <p class="err" id="err"></p>
      <div class="bar"><div class="in"><span class="count">${total() ? `${Object.keys(S.qty).length} productos · ${total()} piezas` : 'Nada elegido'}</span><button class="btn" id="send" ${total() && !S.sending ? '' : 'disabled'}>${S.sending ? 'Enviando…' : 'Enviar solicitud'}</button></div></div>`;
    $('#art').onchange = e => { S.artist = e.target.value; try { localStorage.setItem('fm-req-artist', S.artist); } catch (x) {} };
    $('#pin').oninput = e => { S.pin = e.target.value.replace(/\D/g, ''); e.target.value = S.pin; };
    $('#note').oninput = e => { S.note = e.target.value; };
    const qi = $('#q'); qi.oninput = () => { S.q = qi.value; render(); const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.cat = b.dataset.c; render(); });
    document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const c = b.dataset.p; S.qty[c] = Math.min(100, (S.qty[c] || 0) + 1); render(); });
    document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const c = b.dataset.m; if (S.qty[c] > 1) S.qty[c]--; else delete S.qty[c]; render(); });
    $('#send').onclick = send; bindTabs();
  }

  const dmy = iso => { if (!iso) return ''; const d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso); return d.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' }); };
  const tag = st => st === 'Entregado' ? '<span class="tg ok">Entregado</span>' : st === 'Sin stock' ? '<span class="tg no">Sin stock</span>' : '<span class="tg pe">Pendiente</span>';
  function renderMine() {
    const m = S.mine, ym = new Date().toISOString().slice(0, 7);
    let body = '';
    if (m) {
      const cur = m.requests.filter(r => (r.deliveredAt || r.requestDate || '').slice(0, 7) === ym);
      const ent = cur.flatMap(r => (r.items || []).filter(i => i.state === 'Entregado')), pend = m.requests.flatMap(r => (r.items || []).filter(i => !i.state || i.state === 'Pendiente'));
      const sub = ent.reduce((t, i) => t + Number(i.qty) * Number(m.prices[i.code] || 0), 0);
      body = `<div class="kp"><div><span>Entregado este mes</span><b>${ent.reduce((t, i) => t + Number(i.qty), 0)} pzas</b></div><div><span>Aprox. en tu nota del mes</span><b>$${sub.toFixed(2)}</b></div><div><span>Por entregar</span><b>${pend.reduce((t, i) => t + Number(i.qty), 0)} pzas</b></div><div><span>Solicitudes (75 días)</span><b>${m.requests.length}</b></div></div>
        <p class="sub">El monto es a precio lashista, antes de descuentos por metas y tax. La nota final la envía administración.</p>
        ${m.notes.length ? `<h2>Tus notas</h2>${m.notes.map(n => `<div class="rq"><h3><span>Nota #${esc(n.invoice)} · ${esc(n.month)}</span>${n.status === 'Pagada' ? '<span class="tg ok">Pagada</span>' : `<span class="tg pe">${esc(n.status)}</span>`}</h3>${Number(n.paid) ? `<small>Pagos registrados: $${Number(n.paid).toFixed(2)}</small>` : '<small>Sin pagos registrados</small>'}</div>`).join('')}` : ''}
        <h2>Tus solicitudes</h2>${m.requests.length ? m.requests.map(r => `<div class="rq"><h3><span>Solicitaste ${esc(dmy(r.requestDate))}</span><small>${r.deliveredAt ? 'Entregado ' + esc(dmy(r.deliveredAt)) : 'Aún sin entregar'}</small></h3><ul>${(r.items || []).map(i => `<li><span>${esc(i.name)} × ${Number(i.qty)}</span>${tag(i.state)}</li>`).join('')}</ul>${r.note ? `<small>Nota: ${esc(r.note)}</small>` : ''}</div>`).join('') : '<p class="sub">No tienes solicitudes en los últimos 75 días.</p>'}`;
    }
    app.innerHTML = header + tabs() + `<label for="art">Tu nombre</label><select id="art"><option value="">Elige tu nombre</option>${S.artists.map(a => `<option value="${esc(a.id)}" ${S.artist === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <label for="pin">Tu clave</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" value="${esc(S.pin)}" placeholder="La que te dio administración">
      <p class="err" id="err"></p><button class="btn" id="see" style="width:100%" ${S.loading ? 'disabled' : ''}>${S.loading ? 'Cargando…' : m ? 'Actualizar' : 'Ver mis solicitudes'}</button>${body}`;
    $('#art').onchange = e => { S.artist = e.target.value; S.mine = null; try { localStorage.setItem('fm-req-artist', S.artist); } catch (x) {} renderMine(); };
    $('#pin').oninput = e => { S.pin = e.target.value.replace(/\D/g, ''); e.target.value = S.pin; };
    bindTabs();
    $('#see').onclick = async () => {
      if (!S.artist) return ($('#err').textContent = 'Elige tu nombre.');
      if (!/^\d{4,8}$/.test(S.pin)) return ($('#err').textContent = 'Escribe tu clave (4 a 8 números).');
      S.loading = true; renderMine();
      const { data, error } = await sb.rpc('fm_my_requests', { p_artist: S.artist, p_pin: S.pin });
      S.loading = false;
      if (error || !data || !data.ok) { S.mine = null; renderMine(); $('#err').textContent = (data && data.error) || (error && /function/i.test(error.message) ? 'Esta opción todavía no está activada. Avísale a administración.' : 'No se pudo cargar. Intenta de nuevo.'); return; }
      S.mine = { requests: data.requests || [], prices: data.prices || {}, notes: data.notes || [] }; renderMine();
    };
  }

  const $$m = v => '$' + Number(v || 0).toFixed(2);
  const fdate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });
  async function loadWeek() {
    const err = t => { const e = $('#err'); if (e) e.textContent = t; };
    if (!S.artist) return err('Elige tu nombre.');
    if (!/^\d{4,8}$/.test(S.pin)) return err('Escribe tu clave (4 a 8 números).');
    S.loading = true; renderWeek();
    const { data, error } = await sb.rpc('fm_my_week', { p_artist: S.artist, p_pin: S.pin, p_offset: S.wofs });
    S.loading = false;
    if (error || !data || !data.ok) { S.week = null; renderWeek(); err((data && data.error) || (error && /function/i.test(error.message) ? 'Esta opción todavía no está activada. Avísale a administración.' : 'No se pudo cargar. Intenta de nuevo.')); return; }
    S.week = data; renderWeek();
  }
  const CHECKS = [['limpieza', '🧼', 'Limpieza', 'Mantén tu cabina limpia y ordenada al terminar cada servicio. También cuenta para tu meta.'],
    ['reviews', '⭐', 'Reviews', 'Recuerda pedirle review a tus clientas al terminar su servicio.'],
    ['fotos', '📸', 'Fotos y videos', 'Manda fotos y videos de tus trabajos para subir a redes.']];
  const chk = v => v === 'O' ? '<span class="tg ok">✓ Cumplido</span>' : v === 'X' ? '<span class="tg no">No cumplido</span>' : v === '?' ? '<span class="tg pe">Por revisar</span>' : '';
  function goalCard(w) {
    const meta = Number(w.goal || 0), neto = Number((w.totals || {}).sales || 0), past = S.wofs < 0;
    if (!meta) return '<div class="rq"><h3><span>🎯 Tu meta de la semana</span></h3><small>Todavía no tienes meta asignada esta semana.</small></div>';
    const falta = Math.round((meta - neto) * 100) / 100, pctv = Math.max(0, Math.min(100, neto / meta * 100)), fs = Number(w.fullSet || 180), rf = Number(w.refill || 100);
    let msg;
    if (falta <= 0) msg = past ? `🎉 ¡Lograste tu meta! Quedaste $${(-falta).toFixed(2)} arriba.` : `🎉 ¡Ya lograste tu meta! Vas $${(-falta).toFixed(2)} arriba. ¡Sigue así!`;
    else if (past) msg = `Te faltaron $${falta.toFixed(2)} para tu meta.`;
    else if (falta <= rf) msg = `¡Estás a <b>un refill</b> de lograr tu meta! Te faltan $${falta.toFixed(2)}.`;
    else if (falta <= fs) msg = `¡Estás a <b>un full set</b> de lograr tu meta! Te faltan $${falta.toFixed(2)}.`;
    else { const n = Math.ceil(falta / fs); msg = `Te faltan <b>$${falta.toFixed(2)}</b>: unos <b>${n} full sets</b> o ${Math.ceil(falta / rf)} refills.`; }
    return `<div class="goal ${falta <= 0 ? 'done' : ''}"><div class="gtop"><span>🎯 Tu meta ${past ? 'de esa semana' : 'de la semana'}</span><b>$${neto.toFixed(2)} <small>de $${meta.toFixed(2)}</small></b></div>
      <div class="gbar"><i style="width:${pctv.toFixed(1)}%"></i></div><p>${msg}</p><small>La meta es en venta neta (precio menos descuentos), de viernes a jueves.</small></div>`;
  }
  function renderWeek() {
    const w = S.week; let body = '';
    if (w) {
      const t = w.totals || {}, d = w.detail;
      body = `<div class="weeknav2"><button class="chip" data-wk="-1">← Anterior</button><b>${esc(fdate(w.weekStart))} – ${esc(fdate(w.weekEnd))}</b><button class="chip" data-wk="1" ${S.wofs >= 0 ? 'disabled' : ''}>Siguiente →</button></div>
        ${goalCard(w)}
        <div class="kp"><div><span>Servicios</span><b>${Number(t.count || 0)}</b></div><div><span>Ventas (neto)</span><b>${$$m(t.sales)}</b></div><div><span>Comisiones</span><b>${$$m(t.commission)}</b></div><div><span>Tips</span><b>${$$m(t.tips)}</b></div></div>
        <div class="rq" style="border-color:var(--gold)"><h3><span>Total a recibir</span><b>${$$m(Number(t.commission || 0) + Number(t.tips || 0))}</b></h3><small>Comisiones + tips de la semana (viernes a jueves). No incluye descuentos de tu nota de insumos ni ajustes de administración.</small></div>
        <button class="btn ghost" id="reqdet" style="width:100%;margin-top:12px" ${d === 'Pendiente' ? 'disabled' : ''}>${d === 'Pendiente' ? '✓ Ya pediste el detalle de esta semana' : d === 'Enviado' ? 'Volver a pedir el detalle de la semana' : 'Solicitar detalle de la semana'}</button>
        ${d === 'Enviado' ? '<p class="sub" style="text-align:center;margin-top:6px">Administración ya te envió tu detalle de esta semana.</p>' : d === 'Pendiente' ? '<p class="sub" style="text-align:center;margin-top:6px">Administración te enviará tu detalle con cada servicio.</p>' : ''}
        <h2>Tus otras metas</h2>${CHECKS.map(([k, ic, lab, txt]) => `<div class="rq"><h3><span>${ic} ${lab}</span>${chk((w.checks || {})[k])}</h3><small>${txt}</small></div>`).join('')}`;
    }
    app.innerHTML = header + tabs() + `<label for="art">Tu nombre</label><select id="art"><option value="">Elige tu nombre</option>${S.artists.map(a => `<option value="${esc(a.id)}" ${S.artist === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <label for="pin">Tu clave</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" value="${esc(S.pin)}" placeholder="La que te dio administración">
      <p class="err" id="err"></p><button class="btn" id="seew" style="width:100%" ${S.loading ? 'disabled' : ''}>${S.loading ? 'Cargando…' : w ? 'Actualizar' : 'Ver mi semana'}</button>${body}`;
    $('#art').onchange = e => { S.artist = e.target.value; S.week = null; try { localStorage.setItem('fm-req-artist', S.artist); } catch (x) {} renderWeek(); };
    $('#pin').oninput = e => { S.pin = e.target.value.replace(/\D/g, ''); e.target.value = S.pin; };
    $('#seew').onclick = loadWeek; bindTabs();
    document.querySelectorAll('[data-wk]').forEach(b => b.onclick = () => { S.wofs = Math.min(0, S.wofs + Number(b.dataset.wk)); loadWeek(); });
    const rq = $('#reqdet'); if (rq) rq.onclick = async () => {
      rq.disabled = true; rq.textContent = 'Enviando…';
      const { data, error } = await sb.rpc('fm_request_week_detail', { p_artist: S.artist, p_pin: S.pin, p_offset: S.wofs });
      if (error || !data || !data.ok) { rq.disabled = false; rq.textContent = 'Solicitar detalle de la semana'; $('#err').textContent = (data && data.error) || 'No se pudo enviar. Intenta de nuevo.'; return; }
      S.week.detail = 'Pendiente'; renderWeek();
    };
  }

  async function send() {
    const err = t => { $('#err').textContent = t; };
    if (!S.artist) return err('Elige tu nombre.');
    if (!/^\d{4,8}$/.test(S.pin)) return err('Escribe tu clave (4 a 8 números).');
    if (!total()) return err('Elige al menos un producto.');
    S.sending = true; render();
    const items = Object.entries(S.qty).map(([code, qty]) => ({ code, qty }));
    const { data, error } = await sb.rpc('fm_submit_supply_request', { p_artist: S.artist, p_pin: S.pin, p_items: items, p_note: S.note });
    S.sending = false;
    if (error || !data || !data.ok) { render(); return err((data && data.error) || 'No se pudo enviar. Revisa tu conexión e intenta de nuevo.'); }
    const name = (S.artists.find(a => a.id === S.artist) || {}).name || '', sent = items.map(i => ({ ...i, name: (S.products.find(p => p.code === i.code) || {}).name || i.code }));
    S.qty = {}; S.note = '';
    app.innerHTML = header + `<div class="done"><div class="ok">✓</div><h1>Solicitud enviada</h1><p class="sub">${esc(name)} · ${new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
      <div class="sum">${sent.map(i => `<div><span>${esc(i.name)}</span><b>× ${i.qty}</b></div>`).join('')}</div>
      <p class="sub">Recepción ya la tiene en la app. Se cobra en tu nota del mes, solo lo que te entreguen.</p></div>
      <div class="bar"><div class="in"><button class="btn" id="mine">Ver mis solicitudes</button><button class="btn ghost" id="again">Hacer otra solicitud</button></div></div>`;
    $('#again').onclick = render; $('#mine').onclick = () => { S.tab = 'mis'; S.mine = null; render(); const b = $('#see'); if (b && S.artist && S.pin) b.click(); };
  }

  sb.rpc('fm_public_form').then(({ data, error }) => {
    if (error || !data) { app.innerHTML = header + '<p class="err">No se pudo cargar la lista de productos. Intenta más tarde.</p>'; return; }
    S.artists = data.artists || []; S.products = data.products || [];
    if (!S.artists.length) { app.innerHTML = header + '<p class="err">Todavía no hay lashistas con clave. Pide a administración que te asigne una.</p>'; return; }
    if (!S.artists.some(a => a.id === S.artist)) S.artist = '';
    render();
  });
})();
</script>
</body>
</html>
