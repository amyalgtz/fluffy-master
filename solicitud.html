.pt-li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.pt-li:first-of-type{border-top:0}.pt-box>h3+.pt-li{border-top:1px solid var(--line)}.pt-li .grow{flex:1;min-width:0;line-height:1.35}.pt-li small{color:var(--soft);font-size:12px}.pt-li b.okt{color:var(--sage)}.pt-li b.wt{color:var(--warn)}.pt-li.dim{opacity:.75}.pt-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pt-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.pt-row:first-child{border-top:0}.pt-row b{text-align:right}
.pt-total{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;margin:0 0 8px;background:var(--blush);box-shadow:var(--glow)}.pt-total .pt-ic{width:38px;height:38px}.pt-total span{font-size:13px;color:var(--ink)}.pt-total b{display:block;font-family:var(--serif);font-size:28px;font-weight:500;color:var(--mauve);line-height:1.15}
.pt-note{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:9px 12px;background:var(--blush);color:var(--soft);font-size:12px;line-height:1.45}.pt-note p{margin:0}
@media (prefers-reduced-motion:no-preference){.sheet .pane{animation:mwup .2s ease-out}@keyframes mwup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* áreas táctiles amplias sin cambiar el aspecto */
.chip,.pill,.seg button,.wk button,.step button,.add{position:relative}.chip::after,.pill::after,.seg button::after,.wk button::after,.step button::after,.add::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
/* áreas táctiles de 44 px reales: se amplía la zona que responde al toque, no lo que se ve */
.chips{margin:3px -14px 1px;padding:5px 14px}.chip::after{top:-5px;bottom:-5px}
.step button::after{left:-2px;right:-2px}
.top .ib,.top .av{position:relative}.top .ib::after,.top .av::after,.tgl-fl::after{content:"";position:absolute;inset:-2px}
.search{height:44px}
.sheet .li{align-items:center}

.top img,.login .logo{filter:brightness(1.9) saturate(.85)}html[data-theme="day"] .top img,html[data-theme="day"] .login .logo{filter:none}
</style>
</head>
<body>
<main id="app"><p class="loading">Cargando…</p></main>
<div id="nav"></div>
<script>
(function () {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const cfg = window.FM_CONFIG || {}, app = $('#app'), navEl = $('#nav');
  if (!cfg.url || !cfg.anonKey || /TU-PROYECTO|PEGA/.test(cfg.url + cfg.anonKey)) { app.innerHTML = '<p class="err">Falta configurar el sistema.</p>'; return; }
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: false } });

  /* ---------- estado ---------- */
  const S = { artists: [], products: [], artist: '', pin: '', in: false, view: 'pedir', yo: 'pedir',
    qty: {}, cat: '', q: '', note: '', sending: false, sent: null,
    mine: null, edit: null, week: null, wofs: 0, notes: [],
    day: null, today: null, date: '', dep: null, pay: null, pofs: 0, myWeek0: null, allSvc: false, busy: {} };
  try { S.artist = localStorage.getItem('fm-req-artist') || ''; } catch (e) {}
  const me = () => S.artists.find(a => a.id === S.artist) || {};
  const isMgr = () => !!me().manager;
  const initials = n => { const w = String(n || '').replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g, ' ').trim().split(/\s+/).filter(Boolean); return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '·').slice(0, 2)).toUpperCase(); };
  const first = n => { const x = String(n || '').replace(/(ag|ii)$/i, ''); return x.charAt(0).toUpperCase() + x.slice(1).toLowerCase(); };
  const total = () => Object.values(S.qty).reduce((t, n) => t + n, 0);

  /* ---------- formato ---------- */
  const M = (v, dec = true) => '$' + Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 });
  const D = iso => new Date(String(iso).slice(0, 10) + 'T12:00:00');
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const fdate = iso => cap(D(iso).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }));
  const fshort = iso => D(iso).toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });
  const wdm = (iso, month) => { const d = D(iso); return `${d.toLocaleDateString('es-MX', { weekday: 'long' })} ${d.getDate()}${month ? ' de ' + d.toLocaleDateString('es-MX', { month: 'long' }) : ''}`; };
  const fday = iso => D(iso).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
  const hm = iso => iso ? new Date(iso).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }) : '';
  const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
  const rel = (iso, today) => { const n = Math.round((D(iso) - D(today)) / 864e5); return n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : n === -1 ? 'Ayer' : fdate(iso); };
  const hello = () => { const h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'; };
  const rpcErr = (data, error) => (data && data.error) || (error && /function|schema cache/i.test(error.message || '') ? 'Esta opción todavía no está activada. Avísale a administración.' : 'No se pudo cargar. Revisa tu internet e intenta de nuevo.');

  /* ---------- colores por forma de pago ---------- */
  const famOf = k => /efectivo/i.test(k) ? 'Efectivo' : /sin m[eé]todo|sin registrar/i.test(k) ? 'Sin forma de pago' : /tarjeta|clover|stripe/i.test(k) ? 'Tarjeta' : /zelle/i.test(k) ? 'Zelle' : 'Otros';
  const FAM = { Tarjeta: 'var(--mauve)', Zelle: 'var(--goldline)', Efectivo: 'var(--sage)', Otros: 'var(--other)', 'Sin forma de pago': 'var(--nomethod)' };
  const families = meth => { const f = {}; Object.entries(meth || {}).forEach(([k, v]) => { const n = famOf(k); f[n] = (f[n] || 0) + Number(v); }); return ['Tarjeta', 'Zelle', 'Efectivo', 'Otros', 'Sin forma de pago'].filter(n => f[n] > 0).map(n => [n, Math.round(f[n] * 100) / 100]); };

  /* ---------- íconos ---------- */
  const IC = {
    hoy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 18 6 11M12 18l-3-8M12 18V9M12 18l3-8M12 18l6-7"/></svg>',
    caja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6.5" width="18" height="12" rx="3"/><circle cx="12" cy="12.5" r="2.6"/></svg>',
    dep: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M4 10.5h16M8.5 3v4M15.5 3v4"/></svg>',
    pay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 19v-7M12 19V5M19 19v-10"/></svg>',
    yo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.6-4 4.2-5.5 7.5-5.5s5.9 1.5 7.5 5.5"/></svg>',
    search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="color:var(--soft)"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>',
    chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
    pedir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 11.5H7L6 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>',
    mis: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="4" width="14" height="16.5" rx="3"/><path d="M9 9h6M9 13h6M9 16.5h3"/></svg>',
    sem: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/></svg>',
  };

  /* ---------- abanico (el motivo del logo) ---------- */
  function fan(parts, opts) {
    const o = Object.assign({ n: 52, r0: 104, r1: 156, fill: null }, opts), W = 340, cx = W / 2, cy = 168, tot = parts.reduce((t, p) => t + p[1], 0) || 1;
    let cols = [];
    if (o.fill != null) cols = Array.from({ length: o.n }, (_, i) => (i + .5) / o.n <= o.fill ? 'var(--mauve)' : 'var(--line)');
    else { parts.forEach(([name, v]) => { const c = Math.max(v > 0 ? 1 : 0, Math.round(v / tot * o.n)); for (let i = 0; i < c; i++) cols.push(FAM[name]); }); cols = cols.slice(0, o.n); while (cols.length < o.n) cols.push(cols[cols.length - 1] || 'var(--line)'); }
    const lines = cols.map((c, i) => { const a = Math.PI - (i + .5) * Math.PI / o.n, l = o.r1 - (i % 2 ? 6 : 0); return `<line x1="${(cx + o.r0 * Math.cos(a)).toFixed(1)}" y1="${(cy - o.r0 * Math.sin(a)).toFixed(1)}" x2="${(cx + l * Math.cos(a)).toFixed(1)}" y2="${(cy - l * Math.sin(a)).toFixed(1)}" stroke="${c}" stroke-width="2.3" stroke-linecap="round"/>`; }).join('');
    return `<svg viewBox="0 0 ${W} 176" aria-hidden="true">${lines}<path d="M${cx - o.r0 + 4} ${cy} A${o.r0 - 4} ${o.r0 - 4} 0 0 1 ${cx + o.r0 - 4} ${cy}" fill="none" stroke="var(--goldline)" stroke-width="1" opacity=".55"/></svg>`;
  }

  /* ---------- armazón ---------- */
  /* ---------- modo día / noche (se guarda en este dispositivo) ---------- */
  const curTheme = () => document.documentElement.getAttribute('data-theme') === 'day' ? 'day' : 'night';
  const themeIcon = () => curTheme() === 'night' ? IC.sun : IC.moon;
  const themeLabel = () => curTheme() === 'night' ? 'Cambiar a modo día' : 'Cambiar a modo noche';
  const themeBtn = c => `<button class="ib ${c || ''}" data-theme-btn aria-label="${themeLabel()}" title="${themeLabel()}">${themeIcon()}</button>`;
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('fm-portal-theme', t); } catch (e) {}
    const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.setAttribute('content', t === 'day' ? '#FAF7F3' : '#1A0E15');
    $$('[data-theme-btn]').forEach(b => { b.innerHTML = themeIcon(); b.setAttribute('aria-label', themeLabel()); b.setAttribute('title', themeLabel()); });
  }
  const bindTheme = () => $$('[data-theme-btn]').forEach(b => b.onclick = () => setTheme(curTheme() === 'night' ? 'day' : 'night'));

  /* ---------- armazón ---------- */
  function topbar() { const m = me();
    return `<div class="top"><img src="logo-mark.png" alt=""><div class="nm"><b>Fluffy Lashes</b><span>${isMgr() ? 'Portal de manager' : 'Portal de lashistas'}</span></div>${themeBtn()}<button class="av" id="avatar" aria-label="Opciones de ${esc(m.name || '')}">${esc(initials(first(m.name)))}</button></div>`; }
  function renderNav() {
    if (!S.in) { navEl.innerHTML = ''; return; }
    const mg = isMgr(), it = mg ? [['hoy', 'Hoy'], ['caja', 'Caja'], ['dep', 'Depósitos'], ['pay', 'Payroll'], ['yo', 'Yo']] : [['pedir', 'Pedir insumos'], ['mis', 'Mis solicitudes'], ['sem', 'Mi semana']], on = k => mg ? S.view === k : S.yo === k;
    navEl.innerHTML = `<nav class="tab" aria-label="Secciones">${it.map(([k, l]) => `<button data-nav="${k}" class="${on(k) ? 'on' : ''}" ${on(k) ? 'aria-current="page"' : ''}>${IC[k]}<span>${l}</span></button>`).join('')}</nav>`;
    $$('[data-nav]').forEach(b => b.onclick = () => { if (mg) go(b.dataset.nav); else { S.yo = b.dataset.nav; S.view = 'yo'; window.scrollTo(0, 0); render(); } });
  }
  function paint(html) {
    app.innerHTML = topbar() + html; renderNav(); bindTheme();
    const av = $('#avatar'); if (av) av.onclick = () => sheet(`<h2 style="margin-top:4px">${esc(me().name || '')}</h2><p class="muted small">Entraste con tu clave en este dispositivo.</p><button class="btn line" id="logout" style="margin-top:14px">Salir</button>`, () => { $('#logout').onclick = () => { closeSheet(); logout(); }; });
  }
  function go(v) { S.view = v; window.scrollTo(0, 0); render(); }
  function yoSeg() { if (!isMgr()) return ''; return `<div class="seg" role="tablist">${[['pedir', 'Pedir insumos'], ['mis', 'Mis solicitudes'], ['sem', 'Mi semana']].map(([k, l]) => `<button role="tab" data-yo="${k}" class="${S.yo === k ? 'on' : ''}" aria-selected="${S.yo === k}">${l}</button>`).join('')}</div>`; }
  function bindYo() { $$('[data-yo]').forEach(b => b.onclick = () => { S.yo = b.dataset.yo; S.view = 'yo'; window.scrollTo(0, 0); render(); }); }
  function sheet(html, bind) { const ex = $('.sheet'); if (ex && S.keepSheet) { S.keepSheet = false; ex.querySelector('.pane').innerHTML = '<div class="grab"></div>' + html; if (bind) bind(ex); return; } closeSheet(); const d = document.createElement('div'); d.className = 'sheet'; d.innerHTML = `<div class="pane" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`; document.body.appendChild(d); d.onclick = e => { if (e.target === d) closeSheet(); }; if (bind) bind(d); }
  function closeSheet() { const had = $$('.sheet').length; $$('.sheet').forEach(x => x.remove()); if (had && S.in && S.view === 'yo' && S.yo === 'pedir' && !S.sent && !S.sending) setTimeout(render, 0); }
  function logout() { S.in = false; S.pin = ''; S.mine = S.week = S.day = S.today = S.dep = S.pay = S.myWeek0 = null; S.inc = undefined; S.redo = undefined; S._x = null; S.qty = {}; S.notes = []; render(); }

  /* ---------- entrar ---------- */
  function renderLogin(err) {
    navEl.innerHTML = '';
    app.innerHTML = `${themeBtn('tgl-fl')}<div class="login"><img class="logo" src="logo-mark.png" alt="Fluffy Lashes"><h1 style="text-align:center">Portal de lashistas</h1><p class="lead" style="text-align:center">Pide insumos, revisa tus solicitudes y tu semana.</p>
      <label class="field" for="art">Tu nombre</label><select id="art" class="in"><option value="">Elige tu nombre</option>${S.artists.map(a => `<option value="${esc(a.id)}" ${S.artist === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <label class="field" for="pin">Tu clave</label><input id="pin" class="in" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="La que te dio administración">
      <p class="err" id="err">${esc(err || '')}</p><button class="btn" id="enter">Entrar</button></div>`;
    bindTheme();
    $('#pin').oninput = e => { e.target.value = e.target.value.replace(/\D/g, ''); };
    $('#pin').onkeydown = e => { if (e.key === 'Enter') $('#enter').click(); };
    $('#enter').onclick = async () => {
      const a = $('#art').value, p = $('#pin').value;
      if (!a) return ($('#err').textContent = 'Elige tu nombre.');
      if (!/^\d{4,8}$/.test(p)) return ($('#err').textContent = 'Escribe tu clave (4 a 8 números).');
      const b = $('#enter'); b.disabled = true; b.textContent = 'Entrando…';
      const { data, error } = await sb.rpc('fm_my_requests', { p_artist: a, p_pin: p });
      if (error || !data || !data.ok) { b.disabled = false; b.textContent = 'Entrar'; $('#err').textContent = rpcErr(data, error); return; }
      S.artist = a; S.pin = p; S.in = true; try { localStorage.setItem('fm-req-artist', a); } catch (e) {}
      S.mine = { requests: data.requests || [], prices: data.prices || {}, notes: data.notes || [] };
      S.view = 'yo'; S.yo = 'pedir'; loadNotes(); render();
    };
  }

  /* ---------- datos ---------- */
  async function call(fn, args) { const { data, error } = await sb.rpc(fn, Object.assign({ p_artist: S.artist, p_pin: S.pin }, args || {})); return (error || !data || !data.ok) ? { err: rpcErr(data, error) } : data; }
  async function loadNotes() { const r = await call('fm_my_notes'); if (!r.err) { S.notes = r.notes || []; if (S.in && S.view === 'yo') render(); } }
  async function need(key, fn, args, after) { if (S.busy[key]) return; S.busy[key] = true; const r = await call(fn, args); S.busy[key] = false; S[key] = r; if (after) after(r); render(); }

  /* ---------- vistas ---------- */
  function render() {
    if (!S.in) return renderLogin();
    if (!isMgr() && S.view !== 'yo') S.view = 'yo';
    ({ hoy: vHoy, caja: vCaja, dep: vDep, pay: vPay, yo: vYo })[S.view]();
  }
  const errBox = r => `<p class="err">${esc(r.err)}</p><button class="btn line" data-retry>Intentar otra vez</button>`;
  const bindRetry = (key) => $$('[data-retry]').forEach(b => b.onclick = () => { S[key] = null; render(); });

  // HOY (manager)
  function vHoy() {
    if (!S.today) need('today', 'fm_mgr_day', {});
    if (!S.dep) need('dep', 'fm_mgr_deposits');
    if (!S.myWeek0) need('myWeek0', 'fm_my_week', { p_offset: 0 });
    let body;
    if (!S.today) body = '<p class="loading">Cargando el día…</p>';
    else if (S.today.err) body = errBox(S.today);
    else {
      const x = S.today;
      const t = x.totals, fams = families(x.methods), tot = Number(t.net) + Number(t.tips) + Number(t.products);
      const none = (fams.find(f => f[0] === 'Sin forma de pago') || [0, 0])[1], nNone = (x.rows || []).filter(r => /sin m[eé]todo/i.test(r.method)).length;
      const dep = S.dep && !S.dep.err ? S.dep : null, unv = dep ? dep.upcoming.filter(a => !/verific/i.test(a.depStatus || '')) : [];
      const w = S.myWeek0 && !S.myWeek0.err ? S.myWeek0 : null;
      const pend = [];
      if (nNone) pend.push(['var(--warn)', `${nNone} cobro${nNone > 1 ? 's' : ''} sin forma de pago`, `De ${M(none)}; avísale a recepción para asignarlo`, 'caja']);
      if (unv.length) pend.push(['var(--gold)', `${unv.length} depósito${unv.length > 1 ? 's' : ''} por verificar`, unv.slice(0, 2).map(a => a.client).join(' y ') + (unv.length > 2 ? ` y ${unv.length - 2} más` : ''), 'dep']);
      body = `<div class="fanwrap">${fan(fams.length ? fams : [['Sin forma de pago', 1]])}<div class="fanc"><b>${M(tot)}</b><span>cobrado hoy en el salón</span></div></div>
        <div class="legend">${fams.map(([n]) => `<span><i class="dot" style="background:${FAM[n]};width:8px;height:8px"></i>${n === 'Sin forma de pago' ? 'Sin forma' : n}</span>`).join('')}</div>
        <div class="stats"><div><b>${t.count}</b><span>Servicios</span></div><div><b>${M(t.tips, false)}</b><span>Tips</span></div><div><b>${M(t.count ? t.net / t.count : 0, false)}</b><span>Ticket prom.</span></div></div>
        <h2>Pendientes de hoy</h2>${pend.length ? pend.map(([c, a, b, to]) => `<button class="row" data-goto="${to}"><i class="dot" style="background:${c}"></i><div class="grow"><div class="t1">${esc(a)}</div><div class="t2">${esc(b)}</div></div>${IC.chev}</button>`).join('') : '<p class="empty">Todo en orden: no hay cobros sin forma de pago ni depósitos por verificar.</p>'}
        ${w ? weekCard(w) : ''}`;
    }
    paint(`<h1>${hello()}, ${esc(first(me().name))}</h1><p class="lead">${esc(fdate(todayISO()))}</p>${body}<button class="pill" id="refresh" style="margin-top:22px">Actualizar</button>`);
    $$('[data-goto]').forEach(b => b.onclick = () => go(b.dataset.goto));
    const wc = $('#weekcard'); if (wc) wc.onclick = () => { S.yo = 'sem'; go('yo'); };

  function openCard(k) {
    const x = S._x; if (!x) return; let h = '';
    const row = (a, b) => `<div class="pt-row"><span>${a}</span><b>${b}</b></div>`, head = (t, s, ic) => `<div class="pt-dh"><button class="pt-back" data-close aria-label="Volver">${pic('back')}</button><div>${ic ? `<div class="pt-hero-ic">${pic(ic, 'gold')}</div>` : ''}<h2 class="${ic === 'crown' ? 'goldt' : ''}">${t}</h2>${s ? `<p>${s}</p>` : ''}</div></div>`;
    if (k === 'quality') h = `${head('Indicadores de calidad', 'Los verifica administración cada semana. Aquí solo puedes verlos.', 'medal')}<section class="pt-box"><h3>Esta semana</h3>${CHECKS.map(([kk, l]) => { const v = x.checks[kk]; return `<div class="pt-li">${circ(v)}<span class="grow">${l}</span><b class="${v === 'O' ? 'okt' : v === 'X' ? 'wt' : ''}">${v === 'O' ? 'Hecho' : v === 'X' ? 'No cumplido' : v === '?' ? 'Por revisar' : 'Falta'}</b></div>`; }).join('')}</section>${x.qMan ? `<section class="pt-box glow on"><p class="pt-sub" style="margin:0">${x.qOk ? 'Cumplido' : 'No cumplido'} por ajuste de administración${x.reason ? ': ' + esc(x.reason) : ''}.</p></section>` : ''}${x.month ? `<section class="pt-box"><h3>${esc(mlab(x.ym))}</h3><p class="pt-sub" style="margin:0">${x.month.q} de ${x.month.total} semanas con los 3 indicadores (se piden ${x.month.required}).</p></section>` : ''}${x.cfg && Number(x.cfg.quality) > 0 ? `<section class="pt-box"><p class="pt-sub" style="margin:0">Cumplirlos da el descuento estándar de insumos (${Number(x.cfg.quality)}%).</p></section>` : ''}`;
    else if (k === 'excellence') { const un = !!(x.exc || x.benefit), disc = x.exc ? rv(x.exc) : (x.cfg && Number(x.cfg.excellence) > 0 ? Number(x.cfg.excellence) + '%' : 'según configuración'), closed = x.month && x.month.closed;
      h = `${head('Fluffy Excellence', 'Tu nivel de excelencia', 'crown')}
        <section class="pt-box glow ${un ? 'on' : ''}"><div class="pt-h"><h3>Estado actual</h3>${un ? pill('¡Desbloqueado!', 'gold') : closed ? pill('No alcanzado', 'mute') : pill('En curso', 'mute')}</div><p class="pt-sub" style="margin:6px 0 0">${un ? `Desbloqueaste el beneficio premium: vale para ${esc(mlab(x.nx))}.` : closed ? 'Este mes no se alcanzó. ¡El próximo es una nueva oportunidad!' : 'Cumple tu meta semanal y los 3 indicadores de calidad.'}</p></section>
        <section class="pt-box"><h3>Beneficios (próximo mes)</h3><div class="pt-li">${pic('tag')}<span class="grow">Mayor descuento en insumos</span><b>${esc(disc)}</b></div><div class="pt-li">${pic('bolt')}<span class="grow">Comisión 100% en servicios Before Hours y After Hours<br><small>Fluffy Co recibe 0% de esos servicios</small></span><b>${un ? '✓' : ''}</b></div></section>
        <section class="pt-box"><h3>Requisitos de esta semana</h3><div class="pt-li">${circ(x.goalOk ? 'O' : '')}<span class="grow">Meta monetaria alcanzada<br><small>${M(x.neto, false)} / ${M(x.meta, false)}${x.gMan ? ' · ajuste de administración' : ''}</small></span></div>${CHECKS.map(([kk, l]) => `<div class="pt-li">${circ(x.checks[kk])}<span class="grow">${l}</span></div>`).join('')}${(x.gMan || x.qMan) && x.reason ? `<p class="pt-sub" style="margin:10px 0 0">Ajuste de administración: ${esc(x.reason)}</p>` : ''}${x.month ? `<p class="pt-sub" style="margin:10px 0 0">En ${esc(mlab(x.ym))}: ${x.month.e} de ${x.month.total} semanas completas${x.month.required < x.month.total ? ` (mínimo ${x.month.required})` : ''}.</p>` : ''}</section>
        <section class="pt-box"><div class="pt-li" style="border:0;padding:0">${pic('cal')}<span class="grow"><b>Vigencia del beneficio</b><br><small>Para ${esc(mlab(x.nx))}; no es retroactivo. Tus comisiones habituales no cambian.</small></span></div></section>`; }
    else if (k === 'redo') { const c = redoCtx(x) || { wk: [], mo: [] };
      h = `${head('Buena compañera', 'Cuando arreglas o rehaces el servicio de una compañera ayudas a todo el equipo. ¡Gracias!', 'heart')}${x.redoTop ? `<section class="pt-box glow on"><div class="pt-h"><h3>${pic('crown', 'gold')} Compañera del mes</h3>${pill('★', 'gold')}</div><p class="pt-sub" style="margin:6px 0 0">Fuiste la lashista que más ayudó en ${esc(mlab(x.ym))}.</p></section>` : ''}
        <section class="pt-box"><div class="pt-row"><span>Esta semana</span><b>${c.wk.length}</b></div><div class="pt-row"><span>${esc(mlab(x.ym))}</span><b>${c.mo.length}</b></div></section>
        <section class="pt-box"><h3>Tus Redo/Fix de ${esc(mlab(x.ym))}</h3>${c.mo.length ? c.mo.map(r => `<div class="pt-li">${pic('heart')}<span class="grow"><b>${esc(fshort(r.date))}</b><br><small>${r.ofService ? 'Servicio de una compañera: ' + esc(r.ofService) : 'Servicio de una compañera'}</small></span></div>`).join('') : '<p class="pt-sub" style="margin:0">Todavía no hay Redo/Fix este mes.</p>'}</section>
        <section class="pt-note">${pic('info')}<p>Es un reconocimiento: no cambia tu meta, tus comisiones ni tus descuentos.</p></section>`; }
    else if (k === 'tombola') { const tb = x.tomb, st = tb ? tb.status : 'pendiente';
      h = `${head('Tómbola mensual', 'Participan las lashistas que cumplen los 3 indicadores y su meta monetaria del mes.', 'ticket')}<section class="pt-box"><h3>Estado</h3><div class="pt-li"><span class="grow">${({ ganadora: '¡Ganadora!', participa: 'Participas', participo: 'Participaste', pendiente: 'Pendiente (mes en curso)', no_califica: 'No calificaste este mes' }[st]) || 'Pendiente'}</span></div>${tb && tb.date ? row('Fecha de la tómbola', esc(new Date(tb.date + 'T12:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }))) : ''}${(x.rewards || []).filter(r => r.type === 'tombola').map(r => row('Tu premio', `${esc(rv(r))} · ${ST[r.status]}${r.noteInvoice ? ` · nota #${esc(r.noteInvoice)}` : ''}`)).join('')}</section>`; }
    else if (k === 'content') h = `${head('Content Reward', 'Si uno de los videos que subiste se selecciona para promocionar el salón en redes, ganas un descuento adicional en tu nota de insumos.', 'play')}<section class="pt-box">${x.content.length ? x.content.map(r => `<div class="pt-li"><span class="grow"><b>${esc((r.detail || {}).ref || 'Contenido seleccionado')}</b><br><small>${esc(r.periodLabel)}${r.noteInvoice ? ` · nota #${esc(r.noteInvoice)}` : ''}</small></span><b>${esc(rv(r))}</b>${pill(ST[r.status], r.status === 'aplicado' ? 'ok' : 'gold')}</div>`).join('') : `<p class="pt-sub" style="margin:0">Todavía no se ha seleccionado uno de tus videos en ${esc(mlab(x.ym))}. Si se elige para redes, administración lo marca y se suma tu descuento.</p>`}</section>`;
    else if (k === 'disc') { const grp = [['quality', 'Fluffy Quality', '3 indicadores cumplidos', 'medal'], ['excellence', 'Fluffy Excellence', 'Meta + 3 indicadores', 'crown'], ['tombola', 'Tómbola mensual', 'Premio de la tómbola', 'ticket'], ['content', 'Content Reward', 'Video seleccionado para redes', 'play'], ['extra', 'Extra', 'Descuento extra', 'tag']];
      h = `${head('Descuentos del mes', esc(mlab(x.ym)))}<section class="pt-total">${pic('gift', 'rose')}<div><span>Total de descuentos ganados</span><b>${esc(amt(x.won))}</b></div></section>
        <section class="pt-box" style="padding:6px 14px">${row('Aplicados en tu nota', esc(amt(x.applied)))}${row('Ganados, por aplicar', esc(amt(x.toApply)))}</section>
        <section class="pt-box" style="padding:4px 14px">${grp.map(([t, l, d, ic]) => { const r = x.disc.filter(q => q.type === t); const pend = x.pending.find(p => p.label === l); return r.length ? r.map(q => `<div class="pt-li">${pic(ic)}<span class="grow"><b>${l}</b><br><small>${d}${q.detail && q.detail.ref ? ' · ' + esc(q.detail.ref) : ''}${q.noteInvoice ? ` · nota #${esc(q.noteInvoice)}` : ''}</small></span><span class="pt-r"><b>${esc(rv(q))}</b>${pill(ST[q.status], q.status === 'aplicado' ? 'ok' : 'gold-o')}</span></div>`).join('') : `<div class="pt-li dim">${pic(ic)}<span class="grow"><b>${l}</b><br><small>${pend ? 'Pendiente: se confirma al cerrar el mes' : d}</small></span>${pend ? `<span class="pt-r"><b>${esc(rv(pend))}</b>${pill('Pendiente', 'gold-o')}</span>` : '<span class="pt-r"><b>—</b></span>'}</div>`; }).join('')}</section>
        <section class="pt-note">${pic('info')}<p>Los descuentos se aplican en tu nota mensual de insumos por administración, uno después de otro. Los pendientes no están en tus descuentos ganados ni aplicados: se confirman al cerrar el mes.</p></section>`; }
    sheet(h, d => { d.classList.add('pt-full'); $$('[data-close]', d).forEach(c => c.onclick = closeSheet); });
  }

  function detail(w) {
    const byDay = {}; (w.rows || []).forEach(r => (byDay[r.date] = byDay[r.date] || []).push(r));
    const sent = w.sentAt ? new Date(w.sentAt).toLocaleString('es-MX', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
    return `<h2>Tu detalle de la semana</h2><p class="muted small" style="margin-top:-4px">Revisado y enviado por administración${sent ? ' el ' + esc(sent) : ''}</p>
      ${Object.keys(byDay).length ? Object.entries(byDay).map(([d, l]) => `<h2 style="font-size:15px;margin:16px 0 0">${esc(fdate(d))}</h2>${l.map(r => `<div class="row"><div class="grow"><div class="t1">${esc(r.service)}</div><div class="t2">${esc(r.client || '')}, neto ${M(r.net)}</div><button class="pill" style="margin-top:6px;min-height:28px;padding:3px 10px" data-noteref="${esc(fshort(r.date) + ' · ' + r.service + ' · ' + (r.client || ''))}" data-topic="semana">Mandar nota</button></div><div class="r"><div class="t1">${M(Number(r.commission) + Number(r.tip))}</div><div class="t2">comisión ${M(r.commission, false)}${Number(r.tip) ? ` + tip ${M(r.tip, false)}` : ''}</div></div></div>`).join('')}`).join('') : '<p class="empty">No hay servicios en esta semana.</p>'}`;
  }

  /* ---------- arranque ---------- */
  sb.rpc('fm_public_form').then(({ data, error }) => {
    if (error || !data) { app.innerHTML = '<p class="err" style="padding-top:30px">No se pudo cargar el portal. Revisa tu internet e intenta más tarde.</p>'; return; }
    S.artists = data.artists || []; S.products = data.products || [];
    if (!S.artists.length) { app.innerHTML = '<p class="err" style="padding-top:30px">Todavía no hay lashistas con clave. Pide a administración que te asigne una.</p>'; return; }
    if (!S.artists.some(a => a.id === S.artist)) S.artist = '';
    render();
  });
})();
</script>
</body>
</html>
