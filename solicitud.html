<style>

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.two .card span{display:block;font-size:12.5px;color:var(--soft);font-weight:500}.two .card b{font-family:var(--serif);font-weight:500;font-size:22px;display:block;margin-top:6px}
.stack{display:flex;gap:2px;height:12px;margin:14px 0 4px}.stack i{display:block;border-radius:3px;min-width:3px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:12px;color:var(--soft);margin:2px 0 6px}.legend span{display:inline-flex;align-items:center;gap:6px}
.fanwrap{position:relative;width:100%;max-width:340px;margin:4px auto 0}.fanwrap svg{width:100%;height:auto;display:block}.fanc{position:absolute;left:0;right:0;bottom:6px;text-align:center}.fanc b{font-family:var(--serif);font-weight:500;font-size:32px;letter-spacing:-.6px;display:block}.fanc span{font-size:12.5px;color:var(--soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:12px -22px 6px;padding-left:22px;padding-right:22px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}

.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card);height:34px}.step button{border:0;background:none;width:34px;height:34px;color:var(--mauve);font-size:18px}.step b{min-width:22px;text-align:center;font-size:14px}
.add{border:0;background:var(--blush);color:var(--mauve);border-radius:999px;padding:0 16px;height:34px;font-weight:600;font-size:12.5px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:12.5px;min-height:32px}.pill.pri{border-color:var(--mauve);color:var(--mauve)}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--mauve);color:#fff;font-weight:700;font-size:15px;min-height:50px;padding:0 20px}.btn.line{background:none;border:1.5px solid var(--mauve);color:var(--mauve)}.btn:disabled{opacity:.55}
.field{display:block;margin:14px 0 6px;font-size:13px;font-weight:600;color:var(--soft)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px}
.err{color:var(--warn);font-weight:600;font-size:13.5px;min-height:1px;margin:8px 0}
.okmsg{background:var(--blush);color:var(--sage);border-radius:14px;padding:10px 14px;font-weight:600;font-size:13.5px;margin:10px 0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.sh h2{margin-bottom:6px}
.req{padding:14px 0;border-bottom:1px solid var(--line)}.req .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.req .hd b{font-family:var(--serif);font-weight:600;font-size:15.5px}
.li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0}.li .st{font-size:11.5px;font-weight:600}
.reply{margin-top:8px;font-size:13px;color:var(--sage)}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.check .ic{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));width:min(520px,calc(100% - 32px));border:0;border-radius:999px;background:var(--mauve);color:#fff;min-height:54px;padding:0 24px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14.5px;box-shadow:0 10px 24px rgba(181,115,124,.35);z-index:4}
.fab.solo{bottom:calc(24px + env(safe-area-inset-bottom))}
nav.tab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(520px,calc(100% - 32px));height:66px;border-radius:33px;background:var(--bar);display:flex;align-items:center;padding:0 8px;z-index:5;box-shadow:0 12px 30px rgba(59,35,41,.22)}
nav.tab button{flex:1;border:0;background:none;color:var(--barink);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;height:50px;border-radius:25px;justify-content:center}
nav.tab button.on{background:var(--petal);color:#3B2329;font-weight:700}nav.tab svg{width:20px;height:20px}
@media (prefers-color-scheme:dark){nav.tab button{color:#3B2329}nav.tab button:not(.on){color:#7C6268}}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(28,21,23,.38)}
.sheet .pane{background:var(--bg);width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.done{text-align:center;padding:30px 0}.done .tick{width:64px;height:64px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 14px}
.login{max-width:420px;margin:0 auto;padding-top:6vh}.login .logo{width:58px;height:58px;display:block;margin:0 auto 12px}
.empty{color:var(--soft);font-size:14px;padding:16px 0}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:7px 0 6px}.bar i{display:block;height:100%;background:var(--mauve);border-radius:2px}
.ini{width:36px;height:36px;border-radius:50%;background:var(--blush);color:var(--mauve);font-family:var(--serif);font-weight:600;font-size:12.5px;display:grid;place-items:center;flex:none}
.wk{display:flex;align-items:center;justify-content:space-between;background:var(--blush);border-radius:999px;padding:4px;margin:0 0 16px}.wk button{border:0;background:none;width:40px;height:34px;border-radius:999px;font-size:18px;color:var(--soft)}.wk button:disabled{opacity:.3}.wk b{font-size:13.5px;font-weight:600}
.fine{font-size:12px;color:var(--soft);margin-top:10px;line-height:1.45}
.loading{color:var(--soft);padding:30px 0;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet .pane{animation:up .28s cubic-bezier(.32,.72,0,1)}@keyframes up{from{transform:translateY(40px);opacity:.6}}}
</style>

<body>
<main id="app"><p class="loading">Cargando…</p></main>
<div id="nav"></div>
<script>
(function () {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const cfg = window.FM_CONFIG || {}, app = $('#app'), navEl = $('#nav');
  if (!cfg.url || !cfg.anonKey || /TU-PROYECTO|PEGA/.test(cfg.url + cfg.anonKey)) { app.innerHTML = '<p class="err">Falta configurar el sistema.</p>'; return; }
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey, { auth: { persistSession: false } });

  /* ---------- estado ---------- */
  const S = { artists: [], products: [], artist: '', pin: '', in: false, view: 'pedir', yo: 'pedir',
    qty: {}, cat: '', q: '', note: '', sending: false, sent: null,
    mine: null, edit: null, week: null, wofs: 0, notes: [],
    day: null, today: null, date: '', dep: null, pay: null, pofs: 0, myWeek0: null, allSvc: false, busy: {} };
  try { S.artist = localStorage.getItem('fm-req-artist') || ''; } catch (e) {}
  const me = () => S.artists.find(a => a.id === S.artist) || {};
  const isMgr = () => !!me().manager;
  const initials = n => { const w = String(n || '').replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g, ' ').trim().split(/\s+/).filter(Boolean); return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '·').slice(0, 2)).toUpperCase(); };
  const first = n => { const x = String(n || '').replace(/(ag|ii)$/i, ''); return x.charAt(0).toUpperCase() + x.slice(1).toLowerCase(); };
  const total = () => Object.values(S.qty).reduce((t, n) => t + n, 0);

  /* ---------- formato ---------- */
  const M = (v, dec = true) => '$' + Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 });
  const D = iso => new Date(String(iso).slice(0, 10) + 'T12:00:00');
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const fdate = iso => cap(D(iso).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }));
  const fshort = iso => D(iso).toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });
  const wdm = (iso, month) => { const d = D(iso); return `${d.toLocaleDateString('es-MX', { weekday: 'long' })} ${d.getDate()}${month ? ' de ' + d.toLocaleDateString('es-MX', { month: 'long' }) : ''}`; };
  const fday = iso => D(iso).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
  const hm = iso => iso ? new Date(iso).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }) : '';
  const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
  const rel = (iso, today) => { const n = Math.round((D(iso) - D(today)) / 864e5); return n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : n === -1 ? 'Ayer' : fdate(iso); };
  const hello = () => { const h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'; };
  const rpcErr = (data, error) => (data && data.error) || (error && /function|schema cache/i.test(error.message || '') ? 'Esta opción todavía no está activada. Avísale a administración.' : 'No se pudo cargar. Revisa tu internet e intenta de nuevo.');

  /* ---------- colores por forma de pago ---------- */
  const famOf = k => /efectivo/i.test(k) ? 'Efectivo' : /sin m[eé]todo|sin registrar/i.test(k) ? 'Sin forma de pago' : /tarjeta|clover|stripe/i.test(k) ? 'Tarjeta' : /zelle/i.test(k) ? 'Zelle' : 'Otros';
  const FAM = { Tarjeta: 'var(--mauve)', Zelle: 'var(--goldline)', Efectivo: 'var(--sage)', Otros: 'var(--other)', 'Sin forma de pago': 'var(--nomethod)' };
  const families = meth => { const f = {}; Object.entries(meth || {}).forEach(([k, v]) => { const n = famOf(k); f[n] = (f[n] || 0) + Number(v); }); return ['Tarjeta', 'Zelle', 'Efectivo', 'Otros', 'Sin forma de pago'].filter(n => f[n] > 0).map(n => [n, Math.round(f[n] * 100) / 100]); };

  /* ---------- íconos ---------- */
  const IC = {
    hoy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 18 6 11M12 18l-3-8M12 18V9M12 18l3-8M12 18l6-7"/></svg>',
    caja: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6.5" width="18" height="12" rx="3"/><circle cx="12" cy="12.5" r="2.6"/></svg>',
    dep: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M4 10.5h16M8.5 3v4M15.5 3v4"/></svg>',
    pay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 19v-7M12 19V5M19 19v-10"/></svg>',
    yo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c1.6-4 4.2-5.5 7.5-5.5s5.9 1.5 7.5 5.5"/></svg>',
    search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="color:var(--soft)"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>',
    chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>',
  };

  /* ---------- abanico (el motivo del logo) ---------- */
  function fan(parts, opts) {
    const o = Object.assign({ n: 52, r0: 104, r1: 156, fill: null }, opts), W = 340, cx = W / 2, cy = 168, tot = parts.reduce((t, p) => t + p[1], 0) || 1;
    let cols = [];
    if (o.fill != null) cols = Array.from({ length: o.n }, (_, i) => (i + .5) / o.n <= o.fill ? 'var(--mauve)' : 'var(--line)');
    else { parts.forEach(([name, v]) => { const c = Math.max(v > 0 ? 1 : 0, Math.round(v / tot * o.n)); for (let i = 0; i < c; i++) cols.push(FAM[name]); }); cols = cols.slice(0, o.n); while (cols.length < o.n) cols.push(cols[cols.length - 1] || 'var(--line)'); }
    const lines = cols.map((c, i) => { const a = Math.PI - (i + .5) * Math.PI / o.n, l = o.r1 - (i % 2 ? 6 : 0); return `<line x1="${(cx + o.r0 * Math.cos(a)).toFixed(1)}" y1="${(cy - o.r0 * Math.sin(a)).toFixed(1)}" x2="${(cx + l * Math.cos(a)).toFixed(1)}" y2="${(cy - l * Math.sin(a)).toFixed(1)}" stroke="${c}" stroke-width="2.3" stroke-linecap="round"/>`; }).join('');
    return `<svg viewBox="0 0 ${W} 176" aria-hidden="true">${lines}<path d="M${cx - o.r0 + 4} ${cy} A${o.r0 - 4} ${o.r0 - 4} 0 0 1 ${cx + o.r0 - 4} ${cy}" fill="none" stroke="var(--goldline)" stroke-width="1" opacity=".55"/></svg>`;
  }

  /* ---------- armazón ---------- */
  function topbar() { const m = me();
    return `<div class="top"><img src="logo-mark.png" alt=""><div class="nm"><b>Fluffy Lashes</b><span>${isMgr() ? 'Portal de manager' : 'Portal de lashistas'}</span></div><button class="av" id="avatar" aria-label="Opciones de ${esc(m.name || '')}">${esc(initials(first(m.name)))}</button></div>`; }
  function renderNav() {
    if (!S.in || !isMgr()) { navEl.innerHTML = ''; return; }
    const it = [['hoy', 'Hoy'], ['caja', 'Caja'], ['dep', 'Depósitos'], ['pay', 'Payroll'], ['yo', 'Yo']];
    navEl.innerHTML = `<nav class="tab" aria-label="Secciones">${it.map(([k, l]) => `<button data-nav="${k}" class="${S.view === k ? 'on' : ''}" ${S.view === k ? 'aria-current="page"' : ''}>${IC[k]}<span>${l}</span></button>`).join('')}</nav>`;
    $$('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
  }
  function paint(html) {
    app.innerHTML = topbar() + html; renderNav();
    const av = $('#avatar'); if (av) av.onclick = () => sheet(`<h2 style="margin-top:4px">${esc(me().name || '')}</h2><p class="muted small">Entraste con tu clave en este dispositivo.</p><button class="btn line" id="logout" style="margin-top:14px">Salir</button>`, () => { $('#logout').onclick = () => { closeSheet(); logout(); }; });
  }
  function go(v) { S.view = v; window.scrollTo(0, 0); render(); }
  function yoSeg() { return `<div class="seg" role="tablist">${[['pedir', 'Pedir insumos'], ['mis', 'Mis solicitudes'], ['sem', 'Mi semana']].map(([k, l]) => `<button role="tab" data-yo="${k}" class="${S.yo === k ? 'on' : ''}" aria-selected="${S.yo === k}">${l}</button>`).join('')}</div>`; }
  function bindYo() { $$('[data-yo]').forEach(b => b.onclick = () => { S.yo = b.dataset.yo; S.view = 'yo'; window.scrollTo(0, 0); render(); }); }
  function sheet(html, bind) { const ex = $('.sheet'); if (ex && S.keepSheet) { S.keepSheet = false; ex.querySelector('.pane').innerHTML = '<div class="grab"></div>' + html; if (bind) bind(ex); return; } closeSheet(); const d = document.createElement('div'); d.className = 'sheet'; d.innerHTML = `<div class="pane" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`; document.body.appendChild(d); d.onclick = e => { if (e.target === d) closeSheet(); }; if (bind) bind(d); }

  function goalInfo(w, past) {

    if (!meta) return { meta, neto, msg: 'Todavía no tienes meta asignada esta semana.' };
    let msg;

    else if (past) msg = `Te faltaron ${M(falta)} para tu meta.`;
    else if (falta <= rf) msg = `Estás a un refill de tu meta: te faltan ${M(falta)}.`;
    else if (falta <= fs) msg = `Estás a un full set de tu meta: te faltan ${M(falta)}.`;
    else msg = `Te faltan ${M(falta)}, más o menos ${Math.ceil(falta / rf)} refills o ${Math.ceil(falta / fs)} full sets.`;

  async function send() {
    const items = Object.entries(S.qty).map(([code, qty]) => ({ code, qty })); if (!items.length) return;
    S.sending = true; const b = $('#send'); if (b) { b.disabled = true; b.textContent = 'Enviando…'; }
    const r = await call('fm_submit_supply_request', { p_items: items, p_note: S.note });
    S.sending = false;
    if (r.err) { if (b) { b.disabled = false; b.textContent = 'Enviar solicitud'; } const e = $('#serr'); if (e) e.textContent = r.err; return; }
    S.sent = items.map(i => ({ ...i, name: (S.products.find(p => p.code === i.code) || {}).name || i.code })); S.qty = {}; S.note = ''; S.mine = null; closeSheet(); render();
  }
  function vSent() {
    paint(`<div class="done"><div class="tick">✓</div><h1>Solicitud enviada</h1><p class="lead">${esc(fdate(todayISO()))}</p></div>
      ${S.sent.map(i => `<div class="li" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(i.name)}</span><b>× ${i.qty}</b></div>`).join('')}
      <p class="fine">Recepción ya la tiene en la app. Si te equivocaste, la puedes corregir en Mis solicitudes mientras no se entregue.</p>
      <div style="display:grid;gap:10px;margin-top:18px"><button class="btn" id="mine">Ver mis solicitudes</button><button class="btn line" id="again">Hacer otra solicitud</button></div>`);
    $('#again').onclick = () => { S.sent = null; render(); }; $('#mine').onclick = () => { S.sent = null; S.yo = 'mis'; render(); };
  }

  // Mis solicitudes
  const reqRef = r => `Solicitud del ${fshort(r.requestDate)}: ${(r.items || []).map(i => i.name + ' × ' + Number(i.qty)).join(', ')}`.slice(0, 190);
  const itemTag = s => s === 'Entregado' ? '<span class="st ok">Entregado</span>' : s === 'Sin stock' ? '<span class="st warn">Sin stock</span>' : '<span class="st goldt">Pendiente</span>';
  function vMis() {
    if (!S.mine) { need('mine', 'fm_my_requests', {}, r => { if (!r.err) S.mine = { requests: r.requests || [], prices: r.prices || {}, notes: r.notes || [] }; }); }
    let body;
    if (!S.mine) body = '<p class="loading">Cargando…</p>';
    else if (S.mine.err) body = errBox(S.mine);
    else {
      const m = S.mine, ym = todayISO().slice(0, 7), mes = cap(new Date().toLocaleDateString('es-MX', { month: 'long' }));
      const cur = m.requests.filter(r => (r.deliveredAt || r.requestDate || '').slice(0, 7) === ym), ent = cur.flatMap(r => (r.items || []).filter(i => i.state === 'Entregado'));
      const sub = ent.reduce((t, i) => t + Number(i.qty) * Number(m.prices[i.code] || 0), 0), pz = ent.reduce((t, i) => t + Number(i.qty), 0);
      body = `<div class="soft"><div class="muted small">Tu nota de insumos de ${esc(mes.toLowerCase())}, aproximada</div><div class="sh" style="margin-top:4px"><span class="mid">${M(sub)}</span><span class="muted small">${pz} pieza${pz === 1 ? '' : 's'} entregada${pz === 1 ? '' : 's'}</span></div></div>
        <p class="fine">A precio lashista, antes de descuentos por metas y tax. La nota final la envía administración.</p>
        ${(m.notes || []).length ? `<h2>Tus notas de insumos</h2>${m.notes.map(n => `<div class="li" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>Nota #${esc(n.invoice)}, ${esc(n.month)}</span><span class="st ${n.status === 'Pagada' ? 'ok' : 'goldt'}">${esc(n.status)}${Number(n.paid) ? ` · pagado ${M(n.paid, false)}` : ''}</span></div>`).join('')}` : ''}
        <h2>Tus solicitudes</h2>
        ${m.requests.length ? m.requests.map(r => S.edit && S.edit.id === r.id ? editBox(r) : `<div class="req"><div class="hd"><b>${esc(fdate(r.requestDate))}</b>${r.status === 'Cancelada' ? '<span class="muted small">Cancelada</span>' : r.deliveredAt ? `<span class="st ok small" style="font-weight:600">Entregado el ${esc(fday(r.deliveredAt))}</span>` : '<span class="goldt small" style="font-weight:700">Por entregar</span>'}</div>
          ${r.editedAt ? '<div class="muted small" style="margin-top:2px">La corregiste</div>' : ''}
          ${(r.items || []).map(i => `<div class="li"><span>${esc(i.name)}</span><span>${(r.items || []).some(x => x.state && x.state !== 'Pendiente') ? itemTag(i.state) + ' ' : ''}<b>× ${Number(i.qty)}</b></span></div>`).join('')}
          ${r.note ? `<div class="muted small" style="margin-top:4px">Nota: ${esc(r.note)}</div>` : ''}
          <div class="pills">${r.editable ? `<button class="pill pri" data-redit="${esc(r.id)}">Corregir</button><button class="pill" data-rcancel="${esc(r.id)}">Cancelar</button>` : ''}<button class="pill" data-noteref="${esc(reqRef(r))}" data-topic="insumos">Mandar nota</button></div></div>`).join('') : '<p class="empty">No tienes solicitudes en los últimos 75 días.</p>'}
        ${notesBlock('insumos')}
        <button class="btn line" style="margin-top:18px" data-noteref="General (insumos o nota del mes)" data-topic="insumos">Mandar nota a administración</button>`;
    }
    paint(`<h1>Mis solicitudes</h1><p class="lead">Puedes corregirlas mientras no se entreguen</p>${yoSeg()}${body}`);
    bindYo(); bindRetry('mine'); bindNotes(); bindEdit();
    $$('[data-redit]').forEach(b => b.onclick = () => { const r = S.mine.requests.find(x => x.id === b.dataset.redit); S.edit = { id: r.id, items: (r.items || []).map(i => ({ code: i.code, name: i.name, qty: Number(i.qty) })), note: r.note || '' }; render(); });
    $$('[data-rcancel]').forEach(b => b.onclick = () => sheet(`<h2 style="margin-top:4px">¿Cancelar esta solicitud?</h2><p class="muted">Recepción ya no la va a entregar.</p><div style="display:grid;gap:10px;margin-top:16px"><button class="btn" id="yes">Sí, cancelar</button><button class="btn line" id="no">No</button></div>`, () => { $('#no').onclick = closeSheet; $('#yes').onclick = () => { closeSheet(); saveEdit(b.dataset.rcancel, [], ''); }; }));
  }
  function editBox(r) {
    const e = S.edit;
    return `<div class="req" style="background:var(--blush);border-radius:18px;padding:14px 16px;border:0;margin:8px 0"><div class="hd"><b>Corregir: ${esc(fdate(r.requestDate))}</b></div>
      ${e.items.map((i, k) => `<div class="li" style="align-items:center"><span>${esc(i.name)}</span><span class="step"><button data-em="${k}" aria-label="Quitar uno">−</button><b>${i.qty}</b><button data-ep="${k}" aria-label="Agregar uno">+</button></span></div>`).join('') || '<p class="muted small">Sin productos: si guardas así, la solicitud se cancela.</p>'}
      <label class="field" for="eadd">Agregar producto</label><select id="eadd" class="in"><option value="">Elige un producto</option>${S.products.map(p => `<option value="${esc(p.code)}">${esc(p.name)}</option>`).join('')}</select>
      <label class="field" for="enote">Nota (opcional)</label><input id="enote" class="in" value="${esc(e.note || '')}" maxlength="300">
      <p class="err" id="eerr"></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" id="esave">Guardar</button><button class="btn line" id="eback">No cambiar</button></div></div>`;
  }
  function bindEdit() {
    const e = S.edit; if (!e || !$('#esave')) return;
    $$('[data-ep]').forEach(b => b.onclick = () => { const i = e.items[+b.dataset.ep]; i.qty = Math.min(100, i.qty + 1); render(); });
    $$('[data-em]').forEach(b => b.onclick = () => { const k = +b.dataset.em; if (e.items[k].qty > 1) e.items[k].qty--; else e.items.splice(k, 1); render(); });
    $('#eadd').onchange = ev => { const p = S.products.find(x => x.code === ev.target.value); if (!p) return; const ex = e.items.find(x => x.code === p.code); if (ex) ex.qty++; else e.items.push({ code: p.code, name: p.name, qty: 1 }); render(); };
    $('#enote').oninput = ev => { e.note = ev.target.value; };
    $('#eback').onclick = () => { S.edit = null; render(); };
    $('#esave').onclick = () => saveEdit(e.id, e.items, e.note);
  }
  async function saveEdit(id, items, note) {
    const r = await call('fm_edit_my_request', { p_id: id, p_items: (items || []).map(i => ({ code: i.code, qty: i.qty })), p_note: note || '' });
    if (r.err) { const el = $('#eerr'); if (el) el.textContent = r.err; else alert(r.err); return; }
    S.edit = null; S.mine = null; S.flash = r.cancelled ? 'Solicitud cancelada. Recepción ya ve el cambio.' : 'Solicitud corregida. Recepción ya ve el cambio.'; render();
  }

  // notas a administración
  function notesBlock(topic) {
    const l = (S.notes || []).filter(n => n.topic === topic); if (!l.length) return S.flash ? `<p class="okmsg">${esc(S.flash)}</p>` : '';
    const out = `${S.flash ? `<p class="okmsg">${esc(S.flash)}</p>` : ''}<h2>Tus notas a administración</h2>${l.map(n => `<div class="card" style="margin-bottom:10px"><div class="sh"><b style="font-size:13.5px">“${esc(n.text)}”</b><span class="small ${n.status === 'Resuelto' ? 'ok' : 'goldt'}" style="font-weight:600;white-space:nowrap">${n.status === 'Resuelto' ? 'Resuelto' : n.status === 'Visto' ? 'Visto' : 'Enviada'}</span></div><div class="muted small" style="margin-top:4px">${esc(n.ref || '')}</div>${n.reply ? `<div class="reply">Administración: ${esc(n.reply)}</div>` : ''}</div>`).join('')}`;
    S.flash = ''; return out;
  }
  function bindNotes() { $$('[data-noteref]').forEach(b => b.onclick = () => noteSheet(b.dataset.topic || 'insumos', b.dataset.noteref)); }
  function noteSheet(topic, ref) {
    const types = topic === 'semana' ? ['Falta una clienta o servicio', 'Tip incorrecto', 'Servicio o precio incorrecto', 'Comisión incorrecta', 'Otro'] : null;
    sheet(`<h2 style="margin-top:4px">Mandar nota a administración</h2><p class="muted small">Sobre: ${esc(ref)}</p>
      ${types ? `<label class="field" for="ntype">¿Qué pasa?</label><select id="ntype" class="in">${types.map(t => `<option>${esc(t)}</option>`).join('')}</select>` : ''}
      <label class="field" for="ntext">Tu nota</label><textarea id="ntext" class="in" rows="3" maxlength="800" placeholder="${topic === 'semana' ? 'Ej. el tip de Olessia fue de $30, no de $20' : 'Ej. el CC del 13 de octubre no lo pedí'}"></textarea>
      <p class="err" id="nerr"></p><button class="btn" id="nsend">Enviar a administración</button><p class="fine" style="text-align:center">Te contestan aquí mismo.</p>`, () => {
      setTimeout(() => { const t = $('#ntext'); if (t) t.focus(); }, 80);
      $('#nsend').onclick = async () => {
        const txt = $('#ntext').value.trim(), ty = $('#ntype') ? $('#ntype').value : ''; if (!txt) return ($('#nerr').textContent = 'Escribe tu nota.');
        const b = $('#nsend'); b.disabled = true; b.textContent = 'Enviando…';
        const r = await call('fm_send_artist_note', { p_topic: topic, p_ref: [ty, ref].filter(Boolean).join(' · '), p_text: txt });
        if (r.err) { b.disabled = false; b.textContent = 'Enviar a administración'; $('#nerr').textContent = r.err; return; }
        closeSheet(); S.flash = 'Tu nota se envió a administración.'; const n = await call('fm_my_notes'); if (!n.err) S.notes = n.notes || []; render();
      };
    });
  }

  // Mi semana
  const CHECKS = [['limpieza', 'Limpieza'], ['reviews', 'Reviews'], ['fotos', 'Fotos y videos']];
  function vSem() {
    if (!S.week || (!S.week.err && S.week._ofs !== S.wofs)) need('week', 'fm_my_week', { p_offset: S.wofs }, r => { r._ofs = S.wofs; });
    let body, sub = 'De viernes a jueves';
    if (!S.week || S.busy.week) body = '<p class="loading">Cargando…</p>';
    else if (S.week.err) body = errBox(S.week);
    else {
      const w = S.week, t = w.totals || {}, g = goalInfo(w, S.wofs < 0), d = w.detail;
      sub = `${cap(wdm(w.weekStart))} al ${wdm(w.weekEnd, true)}`;
      body = `${g.meta ? `<div class="fanwrap">${fan([], { n: 44, r0: 96, r1: 142, fill: Math.min(1, g.neto / g.meta) })}<div class="fanc"><b>${M(g.neto, false)}</b><span>de tu meta de ${M(g.meta, false)}</span></div></div><p style="text-align:center;color:var(--mauve);font-weight:600;font-size:14px;margin:12px 0 0">${esc(g.msg)}</p>` : `<p class="empty">${esc(g.msg)}</p>`}
        <div class="stats" style="margin-top:20px"><div><b>${Number(t.count || 0)}</b><span>Servicios</span></div><div><b>${M(t.commission, false)}</b><span>Comisión</span></div><div><b>${M(t.tips, false)}</b><span>Tips</span></div></div>
        <div class="soft sh" style="margin-top:16px;align-items:center"><span class="muted">Total a recibir</span><b class="mid">${M(Number(t.commission || 0) + Number(t.tips || 0))}</b></div>
        <p class="fine">Ventas netas de la semana: ${M(t.sales)}. La meta cuenta precio menos descuentos. El total no incluye descuentos de tu nota de insumos ni ajustes de administración.</p>
        <h2>Tus otras metas</h2>${CHECKS.map(([k, l]) => { const v = (w.checks || {})[k];
          return `<div class="check">${v === 'O' ? '<span class="ic" style="background:var(--sage);color:#fff">✓</span>' : v === 'X' ? '<span class="ic" style="background:var(--warn);color:#fff">×</span>' : '<span class="ic" style="border:1.6px solid var(--gold)"></span>'}<span style="flex:1;font-weight:500">${l}</span><span class="small" style="font-weight:600;color:${v === 'O' ? 'var(--sage)' : v === 'X' ? 'var(--warn)' : 'var(--gold)'}">${v === 'O' ? 'Hecho' : v === 'X' ? 'No cumplido' : v === '?' ? 'Por revisar' : 'Falta'}</span></div>`; }).join('')}
        <button class="btn line" id="reqdet" style="margin-top:18px" ${d === 'Pendiente' ? 'disabled' : ''}>${d === 'Pendiente' ? 'Ya pediste el detalle de esta semana' : d === 'Enviado' ? '¿Algo no cuadra? Pedir que lo revisen otra vez' : 'Pedir el detalle de mi semana'}</button>
        ${d === 'Pendiente' ? '<p class="fine" style="text-align:center">Administración va a revisar tu semana; cuando esté lista, tu detalle aparece aquí.</p>' : ''}
        ${d === 'Enviado' ? detail(w) : ''}
        ${notesBlock('semana')}
        <button class="btn line" style="margin-top:14px" data-noteref="Semana ${esc(fshort(w.weekStart))} – ${esc(fshort(w.weekEnd))}" data-topic="semana">Mandar nota sobre mi semana</button>
        <p class="err" id="werr"></p>`;
    }
    paint(`<h1>Mi semana</h1><p class="lead">${esc(sub)}</p>${yoSeg()}<div class="wk"><button data-wk="-1" ${S.wofs <= -8 ? 'disabled' : ''} aria-label="Semana anterior">‹</button><b>${S.wofs === 0 ? 'Esta semana' : S.wofs === -1 ? 'Semana pasada' : `Hace ${-S.wofs} semanas`}</b><button data-wk="1" ${S.wofs >= 0 ? 'disabled' : ''} aria-label="Semana siguiente">›</button></div>${body}`);
    bindYo(); bindRetry('week'); bindNotes();
    $$('[data-wk]').forEach(b => b.onclick = () => { S.wofs = Math.max(-8, Math.min(0, S.wofs + Number(b.dataset.wk))); S.week = null; render(); });
    const rq = $('#reqdet'); if (rq) rq.onclick = async () => { rq.disabled = true; rq.textContent = 'Enviando…'; const r = await call('fm_request_week_detail', { p_offset: S.wofs });
      if (r.err) { rq.disabled = false; rq.textContent = 'Pedir el detalle de mi semana'; $('#werr').textContent = r.err; return; } S.week.detail = 'Pendiente'; render(); };
  }
  function detail(w) {
    const byDay = {}; (w.rows || []).forEach(r => (byDay[r.date] = byDay[r.date] || []).push(r));
    const sent = w.sentAt ? new Date(w.sentAt).toLocaleString('es-MX', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
    return `<h2>Tu detalle de la semana</h2><p class="muted small" style="margin-top:-4px">Revisado y enviado por administración${sent ? ' el ' + esc(sent) : ''}</p>
      ${Object.keys(byDay).length ? Object.entries(byDay).map(([d, l]) => `<h2 style="font-size:15px;margin:16px 0 0">${esc(fdate(d))}</h2>${l.map(r => `<div class="row"><div class="grow"><div class="t1">${esc(r.service)}</div><div class="t2">${esc(r.client || '')}, neto ${M(r.net)}</div><button class="pill" style="margin-top:6px;min-height:28px;padding:3px 10px" data-noteref="${esc(fshort(r.date) + ' · ' + r.service + ' · ' + (r.client || ''))}" data-topic="semana">Mandar nota</button></div><div class="r"><div class="t1">${M(Number(r.commission) + Number(r.tip))}</div><div class="t2">comisión ${M(r.commission, false)}${Number(r.tip) ? ` + tip ${M(r.tip, false)}` : ''}</div></div></div>`).join('')}`).join('') : '<p class="empty">No hay servicios en esta semana.</p>'}`;
  }

  /* ---------- arranque ---------- */
  sb.rpc('fm_public_form').then(({ data, error }) => {
    if (error || !data) { app.innerHTML = '<p class="err" style="padding-top:30px">No se pudo cargar el portal. Revisa tu internet e intenta más tarde.</p>'; return; }
    S.artists = data.artists || []; S.products = data.products || [];
    if (!S.artists.length) { app.innerHTML = '<p class="err" style="padding-top:30px">Todavía no hay lashistas con clave. Pide a administración que te asigne una.</p>'; return; }
    if (!S.artists.some(a => a.id === S.artist)) S.artist = '';
    render();
  });
})();
</script>
</body>
</html>
